name: Bug report
description: The app crashes, freezes or does something it should not.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. One problem per issue, please.
        Wrong English or a bad explanation in a lesson goes in a learning content error report instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a lesson from Today
        2. Tap the speaker button twice
        3. The app closes
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App version
      description: Android Settings > Apps > Gil shows it at the bottom.
      placeholder: 0.1.0
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Pixel 6a, Android 16
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Optional. Remove anything personal first.
      render: text
