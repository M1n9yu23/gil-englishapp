name: 기능 제안
description: 앱이 더 잘하거나 다르게 했으면 하는 점을 제안합니다.
title: "[제안] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Gil은 인터넷 없이 동작하고 계정, 광고, 분석 도구가 없습니다.
        서버나 인터넷 연결이 있어야 하는 기능은 받지 않습니다.

  - type: textarea
    id: problem
    attributes:
      label: 불편한 점
      description: 공부할 때 어떤 상황에서 불편한지 적어 주세요. 해결책은 다음 칸에 적습니다.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: 제안
      description: 무엇이 있으면 도움이 될지, 그리고 어떻게 쓸지 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 다른 방법
      description: 선택 항목입니다. 지금 쓰고 있거나 생각해 본 다른 방법이 있으면 적어 주세요.
