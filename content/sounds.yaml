# Sound items of stage 1. The format is described in docs/content.md.
# Letter names (s1-01, s1-02): symbol is the name of the letter, examples start with it.

- id: sound.letter-a
  symbol: eɪ
  spelling: A a
  ko: "이름은 \"에이\"예요. 단어 안에서는 `apple`처럼 \"애\"에 가깝게 날 때가 많아요."
  examples: [apple, name]
- id: sound.letter-b
  symbol: biː
  spelling: B b
  ko: 이름은 "비"예요. 두 입술을 붙였다가 떼면서 소리 내요.
  examples: [bag, bed]
- id: sound.letter-c
  symbol: siː
  spelling: C c
  ko: "이름은 \"씨\"예요. 단어 안에서는 `cat`처럼 `k` 소리가 날 때가 많아요."
  examples: [cat, cup]
- id: sound.letter-d
  symbol: diː
  spelling: D d
  ko: 이름은 "디"예요. 혀끝을 윗잇몸에 댔다가 떼요.
  examples: [dog, desk]
- id: sound.letter-e
  symbol: iː
  spelling: E e
  ko: "이름은 길게 \"이\"예요. `I`(아이)와 헷갈리기 쉬워요."
  examples: [egg, bed]
- id: sound.letter-f
  symbol: ɛf
  spelling: F f
  ko: "\"에프\"라고 적지만 끝에 \"으\"를 붙이지 않아요. 윗니를 아랫입술에 댄 채 바람만 내고 끝내요."
  examples: [fan, fish]
- id: sound.letter-g
  symbol: dʒiː
  spelling: G g
  ko: "이름은 \"지\"예요. `J`(제이)와 헷갈리기 쉬워요. 단어 안에서는 `gift`처럼 `g` 소리가 날 때가 많아요."
  examples: [gift, bag]
- id: sound.letter-h
  symbol: eɪtʃ
  spelling: H h
  ko: 이름은 "에이치"예요. 끝의 "치"는 아주 짧게 내요.
  examples: [hat, hot]
- id: sound.letter-i
  symbol: aɪ
  spelling: I i
  ko: "이름은 \"아이\"예요. `E`(이)와 헷갈리기 쉬워요."
  examples: [ink, kite]
- id: sound.letter-j
  symbol: dʒeɪ
  spelling: J j
  ko: "이름은 \"제이\"예요. `G`(지)와 헷갈리기 쉬워요."
  examples: [jam, jet]
- id: sound.letter-k
  symbol: keɪ
  spelling: K k
  ko: 이름은 "케이"예요.
  examples: [kid, kite]
- id: sound.letter-l
  symbol: ɛl
  spelling: L l
  ko: 이름은 "엘"이에요. 혀끝을 윗잇몸에 붙인 채로 끝내요.
  examples: [leg, lip]
- id: sound.letter-m
  symbol: ɛm
  spelling: M m
  ko: 이름은 "엠"이에요. 입술을 닫은 채로 끝내요.
  examples: [map, milk]
- id: sound.letter-n
  symbol: ɛn
  spelling: N n
  ko: "이름은 \"엔\"이에요. 혀끝을 윗잇몸에 붙인 채로 끝내요. `M`과 헷갈리기 쉬워요."
  examples: [net, nine]
- id: sound.letter-o
  symbol: oʊ
  spelling: O o
  ko: 이름은 "오우"예요. "오"로 끝내지 말고 입을 살짝 오므려요.
  examples: [box, go]
- id: sound.letter-p
  symbol: piː
  spelling: P p
  ko: 이름은 "피"예요. 두 입술을 붙였다가 터뜨리듯 떼요.
  examples: [pen, pig]
- id: sound.letter-q
  symbol: kjuː
  spelling: Q q
  ko: "이름은 \"큐\"예요. 단어에서는 거의 늘 `qu`로 함께 써요."
  examples: [queen, quick]
- id: sound.letter-r
  symbol: ɑːr
  spelling: R r
  ko: 입을 벌려 "아"라고 한 뒤 혀를 뒤로 말며 끝내요. 혀끝은 어디에도 닿지 않아요.
  examples: [red, run]
- id: sound.letter-s
  symbol: ɛs
  spelling: S s
  ko: 이름은 "에스"예요. 끝의 "스"는 "으" 없이 바람 소리만 내요.
  examples: [sun, six]
- id: sound.letter-t
  symbol: tiː
  spelling: T t
  ko: 이름은 "티"예요.
  examples: [ten, tap]
- id: sound.letter-u
  symbol: juː
  spelling: U u
  ko: "이름은 \"유\"예요. 단어 안에서는 `cup`처럼 \"어\"에 가깝게 날 때가 많아요."
  examples: [up, cute]
- id: sound.letter-v
  symbol: viː
  spelling: V v
  ko: "윗니를 아랫입술에 대고 목을 울리며 시작해서 길게 \"이\"로 끝내요. 두 입술을 붙이는 `B`와 달라요."
  examples: [van, vet]
- id: sound.letter-w
  symbol: ˈdʌbəlju
  spelling: W w
  ko: "이름은 \"더블유\"예요. `double u`, 곧 `U` 두 개라는 뜻이에요. 단어 안에서는 `wet`처럼 입술을 오므렸다 푸는 소리예요."
  examples: [wet, win]
- id: sound.letter-x
  symbol: ɛks
  spelling: X x
  ko: "이름은 \"엑스\"예요. 단어 끝에서는 `box`처럼 `ks` 소리가 나요."
  examples: [box, six]
- id: sound.letter-y
  symbol: waɪ
  spelling: Y y
  ko: "이름은 \"와이\"예요. 단어 첫머리에서는 `yes`처럼 이름과 다른 소리가 나요."
  examples: [yes, yellow]
- id: sound.letter-z
  symbol: ziː
  spelling: Z z
  ko: "미국에서는 `zee`라고 불러요. 우리말 \"지\"로 내면 `G`로 들리니 혀를 `s`처럼 두고 목을 울려요. \"제트\"는 영국식 이름 `zed`에 가까운 말이에요."
  examples: [zoo, zip]

# Consonants (s1-04 to s1-07)
- id: sound.b
  symbol: b
  spelling: b
  ko: 두 입술을 붙였다가 떼요. 우리말 "바"의 첫소리보다 바람이 적어요. 단어 가운데에서는 목도 울려요.
  examples: [bat, bus]
- id: sound.p
  symbol: p
  spelling: p
  ko: 두 입술을 붙였다가 바람을 터뜨리듯 떼요. 목은 울리지 않아요.
  examples: [pen, cup]
- id: sound.m
  symbol: m
  spelling: m
  ko: 입술을 닫고 코로 소리를 내요. 우리말 "마"의 첫소리와 거의 같아요.
  examples: [man, map]
- id: sound.f
  symbol: f
  spelling: f, ph
  ko: 윗니를 아랫입술에 살짝 대고 바람만 내보내요. 두 입술이 붙는 우리말 "파"와 달라요.
  examples: [fan, fish]
- id: sound.v
  symbol: v
  spelling: v
  ko: "`f`처럼 윗니를 아랫입술에 대고 목을 울려요. 두 입술이 붙는 우리말 \"바\"와 달라요."
  examples: [van, five]
- id: sound.t
  symbol: t
  spelling: t
  ko: 혀끝을 윗잇몸에 댔다가 바람을 터뜨리듯 떼요.
  examples: [tap, ten]
- id: sound.d
  symbol: d
  spelling: d
  ko: "`t`와 같은 자리에서 목을 울려요."
  examples: [dog, red]
- id: sound.n
  symbol: n
  spelling: n
  ko: 혀끝을 윗잇몸에 대고 코로 소리를 내요. 우리말 "나"의 첫소리와 거의 같아요.
  examples: [net, sun]
- id: sound.l
  symbol: l
  spelling: l
  ko: 혀끝을 윗잇몸에 꼭 붙이고 소리 내요. 혀끝이 닿아야 해요.
  examples: [leg, lip]
- id: sound.r
  symbol: r
  spelling: r
  ko: 혀를 뒤로 살짝 말고 입술을 조금 내밀어요. 혀끝은 어디에도 닿지 않아요.
  examples: [red, run]
- id: sound.k
  symbol: k
  spelling: c, k, ck
  ko: 혀 뒤쪽을 입천장에 댔다가 바람을 터뜨리듯 떼요.
  examples: [cat, kid, back]
- id: sound.g
  symbol: g
  spelling: g
  ko: "`k`와 같은 자리에서 목을 울려요."
  examples: [go, bag]
- id: sound.h
  symbol: h
  spelling: h
  ko: 입을 벌리고 목에서 바람만 가볍게 내보내요.
  examples: [hat, hot]
- id: sound.w
  symbol: w
  spelling: w
  ko: 입술을 동그랗게 오므렸다가 빠르게 풀어요. "우"에서 시작한다고 생각해요.
  examples: [wet, win]
- id: sound.y
  symbol: j
  spelling: y
  ko: "혀를 입천장 가까이 올리되 막지 않고 \"이\"에서 시작해 다음 모음으로 미끄러져요. `yes`는 \"예스\"에 가까워요. 발음기호 `j`는 이 소리예요."
  examples: [yes, yellow]
- id: sound.j
  symbol: dʒ
  spelling: j, g
  ko: 혀 앞부분을 윗잇몸 뒤쪽에 댔다가 떼면서 목을 울려요. 입술을 조금 내밀어서 우리말 "자"보다 입술이 앞으로 나와요.
  examples: [jam, jet]
- id: sound.s
  symbol: s
  spelling: s, c
  ko: 혀끝을 윗잇몸 가까이 두고 바람을 내보내요. 목은 울리지 않아요.
  examples: [sun, bus]
- id: sound.z
  symbol: z
  spelling: z, s
  ko: "`s`처럼 바람을 내면서 목을 울려요. 벌이 윙윙거리는 소리예요. 우리말 \"주\"의 첫소리와 달라요."
  examples: [zoo, zip]
- id: sound.sh
  symbol: ʃ
  spelling: sh
  ko: 입술을 둥글게 내밀고 "쉬" 하고 바람을 내보내요. 조용히 하라고 할 때 내는 소리예요.
  examples: [ship, fish]
- id: sound.ch
  symbol: tʃ
  spelling: ch, tch
  ko: 입술을 내밀고 "취" 하고 짧게 터뜨려요.
  examples: [chip, chin]
- id: sound.th-voiceless
  symbol: θ
  spelling: th
  ko: 혀끝을 윗니와 아랫니 사이에 살짝 물고 바람만 내보내요. 한글로는 "씽크"처럼 적을 수밖에 없지만 혀는 이 사이에 둬요.
  examples: [think, bath]
- id: sound.th-voiced
  symbol: ð
  spelling: th
  ko: "혀끝을 이 사이에 두고 목을 울려요. `this`, `mother`의 소리예요. 한글 보조에 \"디스\"처럼 적혀 있어도 혀는 이 사이에 둬요."
  examples: [this, mother]

# Short vowels (s1-08)
- id: sound.short-a
  symbol: æ
  spelling: a
  ko: 입을 크게 벌리고 "애"라고 해요. 우리말 "애"보다 입을 더 벌려요.
  examples: [cat, map]
- id: sound.short-e
  symbol: ɛ
  spelling: e
  ko: 입을 조금만 벌리고 "에"라고 해요.
  examples: [bed, pen]
- id: sound.short-i
  symbol: ɪ
  spelling: i
  ko: 힘을 빼고 짧게 "이"라고 해요. "에"에 조금 가까워요.
  examples: [sit, pig]
- id: sound.short-o
  symbol: ɑː
  spelling: o
  ko: 입을 크게 벌리고 "아"라고 해요. 미국 영어에서 짧은 `o`는 대부분 "오"보다 "아"에 가까워요. 발음기호에는 `ː`가 붙지만 철자로는 짧은 `o`라고 불러요.
  examples: [hot, box]
- id: sound.short-u
  symbol: ʌ
  spelling: u
  ko: 힘을 빼고 입을 조금 벌려 짧게 "어"라고 해요.
  examples: [cup, sun]

# Long vowels with a final e (s1-09)
- id: sound.a-e
  symbol: eɪ
  spelling: a_e
  ko: "끝에 `e`가 붙으면 `a`가 이름대로 \"에이\" 소리가 나요. 끝의 `e`는 소리 내지 않아요."
  examples: [cape, make]
- id: sound.i-e
  symbol: aɪ
  spelling: i_e
  ko: "끝에 `e`가 붙으면 `i`가 이름대로 \"아이\" 소리가 나요."
  examples: [kite, time]
- id: sound.o-e
  symbol: oʊ
  spelling: o_e
  ko: "끝에 `e`가 붙으면 `o`가 이름대로 \"오우\" 소리가 나요."
  examples: [hope, home]
- id: sound.u-e
  symbol: juː
  spelling: u_e
  ko: "끝에 `e`가 붙으면 `u`가 이름대로 \"유\"로 나요. `rule`처럼 \"우\"로만 나는 단어도 있어요."
  examples: [cube, cute]

# Vowel teams (s1-10)
- id: sound.ee-ea
  symbol: iː
  spelling: ee, ea
  ko: 입꼬리를 옆으로 당기고 길게 "이이"라고 해요. 짧은 `i`와 다른 소리예요. `ea`는 `head`처럼 짧은 "에"일 때도 있어요.
  examples: [sheep, eat]
- id: sound.ai-ay
  symbol: eɪ
  spelling: ai, ay
  ko: "대부분 \"에이\"라고 해요. 단어 가운데에서는 주로 `ai`, 끝에서는 `ay`로 써요."
  examples: [rain, day]
- id: sound.oa-ow
  symbol: oʊ
  spelling: oa, ow
  ko: "\"오우\"라고 해요. 끝을 \"오\"로 닫지 말고 입술을 살짝 오므려요."
  examples: [boat, snow]
- id: sound.oo-long
  symbol: uː
  spelling: oo
  ko: 입술을 동그랗게 내밀고 길게 "우우"라고 해요.
  examples: [moon, food]
- id: sound.oo-short
  symbol: ʊ
  spelling: oo
  ko: "힘을 빼고 짧게 \"우\"라고 해요. `book`, `look`처럼 `oo` 뒤에 `k`가 오면 이 소리일 때가 많아요."
  examples: [book, look]
- id: sound.ou-ow
  symbol: aʊ
  spelling: ou, ow
  ko: "\"아\"에서 \"우\"로 미끄러지며 \"아우\"라고 해요. `ow`는 `snow`처럼 \"오우\", `ou`는 `you`처럼 다르게 읽는 단어도 있어요."
  examples: [out, cow]

# Vowels with r (s1-11)
- id: sound.ar
  symbol: ɑːr
  spelling: ar
  ko: "\"아\"라고 한 뒤 혀를 뒤로 말아요. \"아르\"처럼 \"으\"를 넣지 않아요."
  examples: [car, star]
- id: sound.or
  symbol: ɔːr
  spelling: or
  ko: "\"오\"라고 한 뒤 혀를 뒤로 말아요."
  examples: [fork, horse]
- id: sound.er-ir-ur
  symbol: ɝː
  spelling: er, ir, ur
  ko: 세 가지 철자가 모두 같은 소리예요. 혀를 뒤로 말고 "어"를 길게 내요.
  examples: [term, bird, turn]

# Consonant clusters (s1-12)
- id: sound.blend-l
  symbol: bl
  spelling: bl, cl, fl, gl, pl, sl
  ko: "두 자음을 한 번에 이어서 내요. `black`을 말할 때 `b` 뒤에 \"으\"를 넣지 말고 `bl`을 붙여요."
  examples: [black, play, flag]
- id: sound.blend-r
  symbol: tr
  spelling: br, cr, dr, fr, gr, tr
  ko: "앞 자음을 내자마자 혀를 말아 `r`로 넘어가요. `tree`는 \"트리\"가 아니라 한 박자예요."
  examples: [tree, frog, bread]
- id: sound.blend-s
  symbol: st
  spelling: sk, sm, sn, sp, st
  ko: "`s` 뒤에 바로 다음 자음을 붙여요. `stop`은 \"스톱\"처럼 두 박자가 아니라 한 박자예요."
  examples: [stop, snow, spoon]
- id: sound.blend-three
  symbol: str
  spelling: scr, spl, spr, str
  ko: "자음 세 개를 \"으\" 없이 한 번에 이어요. `street`는 한 박자예요."
  examples: [street, splash, scream]
- id: sound.ng
  symbol: ŋ
  spelling: ng
  ko: "혀 뒤쪽을 입천장에 붙이고 코로 내요. 우리말 \"강\"의 받침과 같아요. 단어 끝의 `ng`에서는 `g`를 따로 소리 내지 않아요."
  examples: [sing, long]
- id: sound.nk
  symbol: ŋk
  spelling: nk
  ko: "\"잉\"의 받침 소리 뒤에 `k`를 아주 짧게 붙여요. `pink`는 \"핑크\"처럼 \"크\"를 또렷하게 내지 않아요."
  examples: [pink, think]

# Stress and rhythm (s1-13, s1-14)
- id: sound.stress
  symbol: ˈ
  spelling: ˈ
  ko: 두 음절 이상인 단어에는 더 세고 길게 말하는 음절이 하나 있어요. 발음기호에서는 그 음절 앞 위쪽에 짧은 세로줄 `ˈ`가 붙어요.
  examples: [banana, hotel, apple]
- id: sound.schwa
  symbol: ə
  spelling: a, e, i, o, u
  ko: "강세가 없는 음절의 모음은 힘을 빼고 짧은 \"어\"로 약해져요. 영어에서 가장 자주 나는 모음이에요."
  examples: [about, sofa, banana]
- id: sound.linking
  symbol: ‿
  spelling: ‿
  ko: "자음으로 끝난 단어 뒤에 모음으로 시작하는 단어가 오면 한 단어처럼 이어서 말해요. `an apple`은 \"어내플\"처럼 들려요."
  examples: [stand up, wake up]
- id: sound.weak-form
  symbol: tə
  spelling: a, an, the, and, of, to
  ko: "문장 안에서 `a`, `and`, `of`, `to` 같은 짧은 단어는 힘을 빼고 \"어\"처럼 약하게 말해요. 중요한 단어만 세게 말해요."
  examples: [fish and chips, a cup]
