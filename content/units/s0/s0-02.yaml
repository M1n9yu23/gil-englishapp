id: unit.s0-02
title: { ko: 영어와 한국어는 이렇게 달라요, en: How English differs from Korean }
lessons:
  - id: lesson.s0-02.1
    title: { ko: "누가, 한다, 무엇을", en: Who does what }
    goal: { ko: 영어 문장의 순서를 알 수 있어요, en: Know the order of an English sentence }
    introduces: []
    steps:
      - type: listen
        en: "[I]{who} [eat]{do} [apples]{what}."
        ko: 나는 사과를 먹어요.
        literal: 나는 / 먹는다 / 사과들을
        checkVocab: false
      - type: explain
        checkVocab: false
        text: |
          한국어는 "나는 사과를 먹어요"처럼 "먹어요"가 맨 끝에 와요. 영어는 `I eat apples.`처럼 "먹는다"에 해당하는 `eat`이 `I` 바로 뒤에 와요.

          영어 문장은 대부분 누가, 한다, 무엇을 순서예요. 예문의 덩어리 표시를 보면 순서가 보여요. 단어는 외우지 않아도 돼요.

          한국어는 "사과를 나는 먹어요"처럼 순서를 바꿔도 뜻이 통해요. 영어는 순서가 바뀌면 뜻이 달라지거나 틀린 문장이 돼요. 아래 두 문장은 단어가 같은데 좋아하는 사람이 반대예요.

          `likes` 끝의 `s`는 나중에 배워요. 지금은 순서만 보면 돼요.
        examples:
          - en: "[I]{who} [eat]{do} [apples]{what}."
            ko: 나는 사과를 먹어요.
            literal: 나는 / 먹는다 / 사과들을
          - en: "[@Mina]{who} [likes]{do} [@Jun]{what}."
            ko: 미나는 준을 좋아해요.
            literal: 미나는 / 좋아한다 / 준을
          - en: "[@Jun]{who} [likes]{do} [@Mina]{what}."
            ko: 준은 미나를 좋아해요.
            literal: 준은 / 좋아한다 / 미나를
      - type: chooseMeaning
        en: "@Sam helps @Ana."
        checkVocab: false
        options:
          - { ko: 샘이 아나를 도와요, correct: true }
          - { ko: 아나가 샘을 도와요, why: "맨 앞의 `Sam`이 \"누가\"예요. 돕는 사람은 샘이에요." }
          - { ko: 샘과 아나가 서로 도와요, why: "서로 돕는다는 말은 없어요. `helps` 뒤의 `Ana`가 도움을 받아요." }
      - type: arrange
        ko: 나는 사과를 먹어요.
        en: I eat apples.
        checkVocab: false
      - type: listenChoose
        en: "@Leo likes @Priya."
        checkVocab: false
        options:
          - { ko: 레오는 프리야를 좋아해요, correct: true }
          - { ko: 프리야는 레오를 좋아해요, why: "맨 앞에 들린 `Leo`가 \"누가\"예요. 좋아하는 사람은 레오예요." }
          - { ko: 레오와 프리야는 서로 좋아해요, why: "서로 좋아한다는 말은 없어요. `likes` 뒤의 `Priya`가 \"무엇을\" 자리예요." }
      - type: arrange
        ko: 미나는 샘을 좋아해요.
        en: "@Mina likes @Sam."
        checkVocab: false
      - type: shadow
        en: I eat apples.
        ko: 나는 사과를 먹어요.
        checkVocab: false
  - id: lesson.s0-02.2
    title: { ko: 띄어쓰기와 대문자, en: Spaces and capital letters }
    goal: { ko: 영어 문장의 대문자와 띄어쓰기를 알아볼 수 있어요, en: Spot capitals and spaces in an English sentence }
    introduces: []
    steps:
      - type: listen
        en: My name is @Mina.
        ko: 제 이름은 미나예요.
        checkVocab: false
      - type: explain
        checkVocab: false
        text: |
          한국어는 "사과를"처럼 조사를 단어에 붙여 써요. 영어에는 붙이는 조사가 없고 단어마다 띄어 써요. `I eat apples.`는 세 단어예요.

          영어 글자에는 큰 글자(대문자)와 작은 글자(소문자)가 있어요. 대문자를 쓰는 대표적인 자리는 문장의 첫 글자, 나를 뜻하는 `I`, 사람과 도시와 나라 이름의 첫 글자예요. 요일과 달 이름도 대문자로 시작해요.

          문장 끝에는 마침표 `.`를 찍고, 묻는 문장은 물음표 `?`로 끝내요. `What's`의 `'`는 글자를 줄였다는 표시인데 나중에 배워요.

          글자 모양은 1단계에서 하나씩 배워요. 지금은 대문자가 어디에 오는지만 보면 돼요.
        examples:
          - en: My name is @Mina.
            ko: 제 이름은 미나예요.
          - en: "@Sam and I live in Korea."
            ko: 샘이랑 나는 한국에 살아요.
          - en: What's your name?
            ko: 이름이 뭐예요?
      - type: readPassage
        checkVocab: false
        sentences:
          - en: "@Leo and I live in Canada."
            ko: 레오랑 나는 캐나다에 살아요.
        questions:
          - ko: 문장 가운데에 있는 I는 왜 대문자일까요?
            options:
              - { ko: I는 어디에 있든 대문자라서, correct: true }
              - { ko: 문장의 첫 단어라서, why: "첫 단어는 `Leo`예요. `I`는 문장 어디에 있든 대문자로 써요." }
              - { ko: 중요한 단어라서, why: "중요하다고 대문자로 쓰지는 않아요. `I`는 늘 대문자예요." }
          - ko: 마지막 단어는 왜 대문자로 시작할까요?
            options:
              - { ko: 나라 이름이라서, correct: true }
              - { ko: 문장의 마지막 단어라서, why: "끝에 온다고 대문자로 쓰지는 않아요. `Canada`는 나라 이름이에요." }
              - { ko: 사람 이름이라서, why: "사람 이름은 `Leo`예요. `Canada`는 나라 이름이에요." }
          - ko: 문장 가운데에 와도 대문자로 시작해야 하는 단어는 무엇인가요?
            options:
              - { en: korea, correct: true }
              - { en: apple, why: "`apple`은 사과라는 보통 단어예요. 문장 첫 단어가 아니면 소문자로 써요." }
              - { en: name, why: "`name`은 \"이름\"이라는 보통 단어예요. 누군가의 이름은 아니라서 소문자로 써요." }
      - type: chooseEnglish
        ko: 나는 사과를 먹어요.
        checkVocab: false
        options:
          - { en: I eat apples., correct: true }
          - { en: I eatapples., why: "단어마다 띄어 써요. `eat`과 `apples` 사이에 빈칸이 있어야 해요." }
          - { en: I eat apples, why: "문장 끝의 마침표 `.`가 빠졌어요." }
      - type: chooseEnglish
        ko: 이름이 뭐예요?
        checkVocab: false
        options:
          - { en: What's your name?, correct: true }
          - { en: What's your name., why: "묻는 문장은 마침표 대신 물음표 `?`로 끝내요." }
          - { en: What's yourname?, why: "`your`와 `name`은 다른 단어라 띄어 써요." }
      - type: arrange
        ko: 제 이름은 미나예요.
        en: My name is @Mina.
        checkVocab: false
      - type: shadow
        en: My name is @Mina.
        ko: 제 이름은 미나예요.
        checkVocab: false
  - id: lesson.s0-02.3
    title: { ko: a와 -s 맛보기, en: A first look at a and -s }
    goal: { ko: a와 -s가 무엇을 알려 주는지 알 수 있어요, en: Know what a and -s tell you }
    introduces: []
    steps:
      - type: listen
        en: I have a cat.
        ko: 나는 고양이가 한 마리 있어요.
        checkVocab: false
      - type: listen
        en: I have two cats.
        ko: 나는 고양이가 두 마리 있어요.
        checkVocab: false
      - type: explain
        checkVocab: false
        text: |
          한국어는 "고양이가 있어요"라고만 해도 돼요. 영어는 하나인지 여럿인지를 단어에 표시할 때가 많아요. 하나면 앞에 `a`를 붙이고, 여럿이면 끝에 `s`를 붙여요. `water`처럼 `a`를 붙이지 않는 단어도 있어요.

          `a`는 "하나"라는 뜻이지만 우리말로 옮기지 않을 때가 많아요. `I have a dog.`는 "나는 개를 키워요"라고 옮기면 자연스러워요.

          지금은 `cat`, `book`처럼 이름을 나타내는 단어 앞의 `a`는 하나, 끝의 `s`는 여럿이라고 보면 돼요. `likes`처럼 하는 일 끝에 붙는 `s`는 다른 뜻이고 나중에 배워요. 자세한 규칙도 나중 단원에서 배워요.
        examples:
          - en: I have a dog.
            ko: 나는 개를 키워요.
          - en: I have two dogs.
            ko: 나는 개를 두 마리 키워요.
      - type: chooseMeaning
        en: I see a bird.
        checkVocab: false
        options:
          - { ko: 새 한 마리가 보여요, correct: true }
          - { ko: 새가 여러 마리 보여요, why: "앞에 `a`가 있으니 한 마리예요. 여럿이면 `birds`처럼 `s`가 붙어요." }
          - { ko: 새 두 마리가 보여요, why: "두 마리면 `two birds`예요. `a`는 하나를 알려 줘요." }
      - type: chooseEnglish
        ko: 나는 책이 세 권 있어요.
        checkVocab: false
        options:
          - { en: I have three books., correct: true }
          - { en: I have three book., why: "여럿이면 끝에 `s`를 붙여요. 세 권이니 `books`예요." }
          - { en: I have a books., why: "`a`는 하나에만 써요. 여럿 앞에는 `a`를 쓰지 않아요." }
      - type: fillBlank
        en: I have two ___.
        ko: 나는 고양이가 두 마리 있어요.
        checkVocab: false
        options:
          - { en: cats, correct: true }
          - { en: cat, why: "두 마리면 끝에 `s`를 붙여 `cats`라고 해요." }
          - { en: a cat, why: "`a`는 하나일 때 써요. 앞에 `two`가 있으니 여럿이에요." }
      - type: arrange
        ko: 나는 개를 한 마리 키워요.
        en: I have a dog.
        extra: [dogs]
        checkVocab: false
      - type: shadow
        en: I have two cats.
        ko: 나는 고양이가 두 마리 있어요.
        checkVocab: false
