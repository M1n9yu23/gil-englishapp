id: unit.s0-01
title: { ko: 이 앱으로 공부하는 법, en: How to study here }
lessons:
  - id: lesson.s0-01.1
    title: { ko: 매일 조금씩, en: A little every day }
    goal: { ko: 하루 공부 순서를 알 수 있어요, en: Know what a day of study looks like }
    introduces: []
    steps:
      - type: listen
        en: Hello.
        ko: 안녕하세요.
        checkVocab: false
      - type: listen
        en: Hi.
        ko: 안녕하세요.
        checkVocab: false
      - type: explain
        checkVocab: false
        text: |
          방금 들은 `Hello`는 만났을 때 하는 인사예요. `Hi`도 만났을 때 하는 인사인데 조금 더 가벼워요. 지금 외우지 않아도 돼요. 1단계에서 다시 나와요.

          0단계에서는 영어를 외우기보다 이 앱으로 공부하는 법과 영어 문장의 모양을 먼저 봐요. 0단계의 수업은 짧아서 금방 끝나요.

          하루 목표는 10분, 20분, 30분, 60분 중에서 골라요. 한 번에 길게 하는 것보다 짧게라도 매일 하는 편이 오래 기억에 남아요. 처음에는 10분으로 시작해도 돼요.
      - type: explain
        text: |
          "오늘" 탭을 열면 오늘의 길이 그날 할 일을 순서대로 보여 줘요. 복습, 새 수업, 연습 순서예요. 위에서부터 하나씩 하면 돼요.

          복습은 전에 배운 것을 잊어버릴 때쯤 다시 보는 거예요. 언제 볼지는 앱이 계산해서 알려 줘요. 날짜를 따로 기억하지 않아도 돼요.

          중간에 앱을 닫아도 괜찮아요. 다시 열면 멈춘 자리부터 이어서 해요.
      - type: readPassage
        checkVocab: false
        sentences:
          - en: Hello.
            ko: 안녕하세요.
          - en: Hi.
            ko: 안녕하세요.
        questions:
          - ko: 두 말은 언제 하나요?
            options:
              - { ko: 사람을 만났을 때, correct: true }
              - { ko: 고마울 때, why: "고마울 때는 `Thank you`라고 해요. `Hello`와 `Hi`는 만났을 때 하는 인사예요." }
              - { ko: 잠자리에 들 때, why: "잘 때 하는 인사는 따로 있어요. `Hello`와 `Hi`는 만났을 때 써요." }
          - ko: 오늘의 길에서 맨 먼저 하는 것은 무엇인가요?
            options:
              - { ko: 복습, correct: true }
              - { ko: 새 수업, why: 새 수업은 복습 다음이에요. 먼저 전에 배운 것을 다시 봐요. }
              - { ko: 연습, why: 연습은 맨 마지막이에요. 복습과 새 수업을 마친 뒤에 해요. }
      - type: shadow
        en: Hello.
        ko: 안녕하세요.
        checkVocab: false
  - id: lesson.s0-01.2
    title: { ko: "소리 먼저, 틀려도 괜찮아요", en: "Sound first, mistakes are fine" }
    goal: { ko: 소리를 먼저 듣고 따라 말할 수 있어요, en: Listen first and say it aloud }
    introduces: []
    steps:
      - type: listen
        en: Thank you.
        ko: 고마워요.
        checkVocab: false
      - type: explain
        text: |
          방금처럼 새 말은 소리부터 들어요. 글자를 보기 전에 귀로 먼저 익혀 두면 나중에 글자를 볼 때 소리가 같이 떠올라요.

          들은 다음에는 꼭 소리 내서 따라 말해요. 눈으로만 읽으면 입이 익지 않아요. 따라 말하기 단계에서는 내 목소리를 녹음해서 원래 소리와 번갈아 들어 볼 수 있어요.

          소리 버튼은 몇 번이든 눌러도 돼요. 한 번에 다 알아듣지 못해도 괜찮아요.
      - type: shadow
        en: Thank you.
        ko: 고마워요.
        checkVocab: false
      - type: listenChoose
        en: Good morning.
        checkVocab: false
        options:
          - { ko: 좋은 아침이에요, correct: true }
          - { ko: 잘 자요, why: "잘 자라는 인사는 `Good night`이에요. 방금 들은 건 아침 인사예요." }
          - { ko: 안녕히 가세요, why: "헤어질 때는 `Bye`라고 해요. 방금 들은 건 아침에 만났을 때 하는 인사예요." }
      - type: explain
        text: |
          방금 문제를 틀렸어도 괜찮아요. 처음 듣는 말이라 모르는 게 당연해요. 틀려도 점수는 깎이지 않아요.

          틀리면 앱이 정답과 이유를 보여 줘요. 1단계부터는 틀린 단어와 소리가 복습에서 더 빨리 다시 나와요. 그러니 모르겠으면 망설이지 말고 하나 골라 보세요.
      - type: readPassage
        checkVocab: false
        sentences:
          - en: Good morning.
            ko: 좋은 아침이에요.
          - en: Thank you.
            ko: 고마워요.
        questions:
          - ko: 첫 문장은 언제 하는 말인가요?
            options:
              - { ko: 아침에 만났을 때, correct: true }
              - { ko: 밤에 잠자리에 들 때, why: "그때는 `Good night`이라고 해요. `morning`은 아침이에요." }
              - { ko: 고마울 때, why: "고마울 때는 두 번째 문장 `Thank you`를 써요." }
          - ko: 문제를 틀리면 어떻게 되나요?
            options:
              - { ko: 정답과 이유를 보여 줘요, correct: true }
              - { ko: 점수가 깎여요, why: 점수는 깎이지 않아요. 정답과 이유를 보고 넘어가면 돼요. }
              - { ko: 그 문제는 다시 안 나와요, why: 1단계부터는 틀린 단어와 소리가 복습에서 더 빨리 다시 나와요. }
      - type: shadow
        en: Good morning.
        ko: 좋은 아침이에요.
        checkVocab: false
