id: unit.s0-05
title: { ko: 문장 뜯어보기 쓰는 법, en: Taking a sentence apart }
lessons:
  - id: lesson.s0-05.1
    title: { ko: 단어와 덩어리, en: Words and chunks }
    goal: { ko: 문장을 덩어리로 나눠 읽을 수 있어요, en: Read a sentence in chunks }
    introduces: []
    steps:
      - type: listen
        en: "[I]{who} [drink]{do} [coffee]{what} [at home]{where} [in the morning]{when}."
        ko: 나는 아침에 집에서 커피를 마셔요.
        literal: 나는 / 마신다 / 커피를 / 집에서 / 아침에
        checkVocab: false
      - type: explain
        checkVocab: false
        text: |
          예문을 누르면 문장 뜯어보기가 열려요. 거기서 단어를 누르면 그 문장에서 쓰인 뜻 하나만 나와요. 사전처럼 뜻을 여러 개 늘어놓지 않아요.

          문장은 덩어리로 나뉘어 있어요. 덩어리마다 누가, 한다, 무엇을, 어디서, 언제 중 하나가 글자와 색으로 표시돼요. 단어를 하나씩 읽는 것보다 덩어리로 읽으면 뜻이 빨리 들어와요.

          아래 예문을 한국어 번역과 비교해 보세요. "누가" 다음부터는 한국어와 순서가 거꾸로예요. 영어는 한다, 무엇을, 어디서, 언제 순서로 이어질 때가 많아요.
        examples:
          - en: "[@Priya]{who} [reads]{do} [books]{what} [in the park]{where} [on Sundays]{when}."
            ko: 프리야는 일요일마다 공원에서 책을 읽어요.
            literal: 프리야는 / 읽는다 / 책들을 / 공원에서 / 일요일마다
      - type: readPassage
        checkVocab: false
        sentences:
          - en: "@Jun plays soccer at school after lunch."
            ko: 준은 점심을 먹고 학교에서 축구를 해요.
        questions:
          - ko: "\"학교에서\"에 해당하는 덩어리는 어떤 역할인가요?"
            options:
              - { ko: 어디서, correct: true }
              - { ko: 언제, why: "\"언제\"는 `after lunch`예요. `at school`은 장소를 말해요." }
              - { ko: 무엇을, why: "\"무엇을\"은 `soccer`예요. `at school`은 장소를 말해요." }
          - ko: "\"언제\"에 해당하는 덩어리는 무엇인가요?"
            options:
              - { en: after lunch, correct: true }
              - { en: at school, why: "`at school`은 \"학교에서\", 어디서예요." }
              - { en: soccer, why: "`soccer`는 축구, 무엇을이에요." }
      - type: chooseEnglish
        ko: 나는 저녁에 집에서 책을 읽어요.
        checkVocab: false
        options:
          - { en: I read books at home in the evening., correct: true }
          - { en: I at home in the evening books read., why: "한국어 순서 그대로예요. \"한다\"인 `read`는 `I` 바로 뒤에 와요." }
          - { en: I read at home books in the evening., why: "\"무엇을\"인 `books`는 `read` 바로 뒤에 와요." }
      - type: arrange
        ko: 나는 아침에 집에서 커피를 마셔요.
        en: I drink coffee at home in the morning.
        accept:
          - I drink coffee in the morning at home.
          - In the morning I drink coffee at home.
        checkVocab: false
      - type: shadow
        en: I drink coffee at home in the morning.
        ko: 나는 아침에 집에서 커피를 마셔요.
        checkVocab: false
  - id: lesson.s0-05.2
    title: { ko: 직역과 자연스러운 번역, en: Word-for-word and natural }
    goal: { ko: 직역과 자연스러운 번역을 비교할 수 있어요, en: Compare a word-by-word gloss with a natural translation }
    introduces: []
    steps:
      - type: listen
        en: "[I]{who} [have]{do} [two kids]{what}."
        ko: 나는 아이가 둘 있어요.
        literal: 나는 / 가지고 있다 / 두 아이들을
        checkVocab: false
      - type: explain
        checkVocab: false
        text: |
          문장 뜯어보기에는 번역이 두 가지 있어요. 하나는 단어마다 옮긴 직역이고, 다른 하나는 우리말답게 고친 자연스러운 번역이에요.

          `I have two kids.`를 직역하면 "나는 / 가지고 있다 / 두 아이들을"이에요. 우리말로는 "나는 아이가 둘 있어요"가 자연스러워요. `have`는 "가지고 있다"지만 "있다"로 옮길 때가 많아요.

          직역은 영어가 어떤 순서로 말하는지 보여 주고, 자연스러운 번역은 뜻을 보여 줘요. 직역 줄이 어색한 건 당연해요. 두 줄을 같이 보면 돼요.
      - type: explain
        checkVocab: false
        text: |
          `It's cold today.`에서 `It's`는 `It is`를 줄인 말이에요. 직역하면 "그것은 / 이다 / 추운 / 오늘"인데, 자연스러운 번역에는 "그것"이 나오지 않아요. 영어는 날씨를 말할 때도 "누가" 자리를 비우지 않고 `it`을 넣어요.

          뜯어보기 아래쪽에는 그 문장과 관련된 문법 설명으로 가는 링크도 있어요. 문법은 지금 몰라도 돼요. 궁금할 때 눌러 보면 돼요.
        examples:
          - en: It's cold today.
            ko: 오늘 추워요.
            literal: 그것은 / 이다 / 추운 / 오늘
      - type: chooseMeaning
        en: I have a car.
        checkVocab: false
        options:
          - { ko: 나는 차가 있어요, correct: true }
          - { ko: 나는 차를 들고 있어요, why: "직역하면 \"가지고 있다\"지만 차를 손에 든 건 아니에요. 우리말로는 \"차가 있어요\"예요." }
          - { ko: 나는 차를 사요, why: "사는 건 `buy`예요. `have`는 가지고 있다는 뜻이에요." }
      - type: readPassage
        checkVocab: false
        sentences:
          - en: It's cold today.
            ko: 오늘 추워요.
        questions:
          - ko: 이 문장을 자연스럽게 옮긴 것은 무엇인가요?
            options:
              - { ko: 오늘 추워요, correct: true }
              - { ko: 그것은 오늘 추워요, why: "직역을 그대로 옮겼어요. 날씨를 말하는 `it`은 우리말로 옮기지 않아요." }
              - { ko: 오늘 감기에 걸렸어요, why: "`cold`에는 감기라는 뜻도 있지만 여기서는 \"추운\"이에요." }
          - ko: 이 문장의 직역 줄은 무엇을 보여 주나요?
            options:
              - { ko: 영어가 말하는 순서, correct: true }
              - { ko: 우리말다운 번역, why: 그건 자연스러운 번역 줄이에요. 직역은 단어마다 옮겨요. }
              - { ko: 문장에 쓰인 문법 규칙, why: 문법은 문법 링크에서 봐요. 직역은 단어를 하나씩 옮긴 거예요. }
      - type: arrange
        ko: 나는 아이가 둘 있어요.
        en: I have two kids.
        checkVocab: false
      - type: shadow
        en: It's cold today.
        ko: 오늘 추워요.
        checkVocab: false
