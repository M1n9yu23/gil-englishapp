id: unit.s0-04
title: { ko: 발음기호 처음 보기, en: First look at pronunciation symbols }
lessons:
  - id: lesson.s0-04.1
    title: { ko: 글자와 소리는 달라요, en: Letters and sounds differ }
    goal: { ko: 발음기호가 무엇을 알려 주는지 알 수 있어요, en: Know what a pronunciation symbol tells you }
    introduces: []
    steps:
      - type: listen
        en: Cat.
        ko: 고양이.
        checkVocab: false
      - type: listen
        en: Cake.
        ko: 케이크.
        checkVocab: false
      - type: explain
        checkVocab: false
        text: |
          방금 들은 두 단어를 보세요. `cat`과 `cake`에는 둘 다 `a`가 들어 있는데 소리가 달라요. 영어는 같은 글자라도 단어에 따라 소리가 달라질 때가 많아요.

          그래서 사전에는 소리를 따로 적은 발음기호가 있어요. 빗금 두 개 `/ /` 안에 든 것이 소리예요. `cat`은 `/kæt/`, `cake`는 `/keɪk/`로 적어요.

          글자로는 둘 다 `a`지만 발음기호로는 `/æ/`와 `/eɪ/`로 달라요. `cat`의 `c`도 소리대로 `/k/`로 적혀 있어요. `phone`은 `ph`로 시작하지만 발음기호는 `/foʊn/`이에요.

          발음기호는 외우지 않아도 돼요. 소리 버튼을 누르면서 기호를 같이 보면 자주 나오는 기호부터 눈에 익어요. 소리 하나하나는 1단계에서 연습해요.
        examples:
          - en: Cat.
            ko: 고양이.
          - en: Cake.
            ko: 케이크.
          - en: Phone.
            ko: 전화기.
      - type: readPassage
        checkVocab: false
        sentences:
          - en: Cat.
            ko: 고양이.
          - en: Cake.
            ko: 케이크.
          - en: Phone.
            ko: 전화기.
        questions:
          - ko: 발음기호에서 빗금 두 개 사이에 적힌 것은 무엇인가요?
            options:
              - { ko: 단어의 소리, correct: true }
              - { ko: 단어의 뜻, why: 뜻은 따로 적혀 있어요. 빗금 안은 소리예요. }
              - { ko: 단어의 철자, why: "철자와 다를 때가 많아요. `cat`의 `c`도 `/k/`로 적어요." }
          - ko: 세 번째 단어의 첫소리를 발음기호로 쓰면 무엇인가요?
            options:
              - { en: f, correct: true }
              - { en: p, why: "글자는 `p`로 시작하지만 `ph`는 `/f/` 소리가 나요. 발음기호 `/foʊn/`을 보면 알 수 있어요." }
      - type: listenChoose
        en: Cat.
        checkVocab: false
        options:
          - { en: kæt, correct: true }
          - { en: keɪt, why: "`/eɪ/`는 `cake`의 `a` 소리예요. 방금 들은 건 짧은 `/æ/`였어요." }
      - type: shadow
        en: Cake.
        ko: 케이크.
        checkVocab: false
      - type: shadow
        en: I have a cat.
        ko: 나는 고양이가 한 마리 있어요.
        checkVocab: false
  - id: lesson.s0-04.2
    title: { ko: 길이와 강세 표시, en: Length and stress marks }
    goal: { ko: 길게 읽는 표시와 강세 표시를 알아볼 수 있어요, en: Spot the long-sound and stress marks }
    introduces: []
    steps:
      - type: listen
        en: Ship.
        ko: 배.
        checkVocab: false
      - type: listen
        en: Sheep.
        ko: 양.
        checkVocab: false
      - type: explain
        checkVocab: false
        text: |
          방금 들은 두 단어를 보세요. `ship`은 `/ʃɪp/`, `sheep`은 `/ʃiːp/`예요. 쌍점처럼 생긴 `ː`는 바로 앞 소리를 길게 내라는 표시예요.

          그런데 이 두 단어는 길이보다 입 모양 차이가 더 커요. `sheep`은 입꼬리를 옆으로 당기고 내요. `ship`은 입에 힘을 빼고 짧게 내요. 이 차이는 1단계에서 소리로 연습해요.
        examples:
          - en: Ship.
            ko: 배.
          - en: Sheep.
            ko: 양.
      - type: minimalPair
        words: [ship, sheep]
        answer: sheep
        why: "`sheep`은 입꼬리를 옆으로 당겨 길게 내요. `ship`은 힘을 빼고 짧게 끊어요. 발음기호에서는 `ː`가 이 차이를 알려 줘요."
      - type: explain
        checkVocab: false
        text: |
          이번에는 `apple`과 `banana`를 들어 보세요. 발음기호는 `/ˈæpəl/`, `/bəˈnænə/`예요.

          위쪽에 붙은 작은 세로줄 `ˈ`는 강세 표시예요. 바로 뒤 음절을 가장 세고 또렷하게 읽으라는 뜻이에요. 음절은 모음을 중심으로 한 소리 덩어리예요. `banana`는 세 음절이고, 가운데 음절이 세요.

          한국어 "바나나"는 세 글자를 비슷한 힘으로 읽지만, 영어는 강세 음절만 세게 읽고 나머지는 약하게 흘려요. 음절이 하나뿐인 단어에는 `ˈ`를 붙이지 않아요.
        examples:
          - en: Apple.
            ko: 사과.
          - en: Banana.
            ko: 바나나.
      - type: listenChoose
        en: Banana.
        checkVocab: false
        options:
          - { en: bəˈnænə, correct: true }
          - { en: ˈbænənə, why: "이건 첫 음절이 센 표시예요. 방금 들은 `banana`는 가운데 음절이 셌어요." }
      - type: readPassage
        checkVocab: false
        sentences:
          - en: Sheep.
            ko: 양.
          - en: Apple.
            ko: 사과.
        questions:
          - ko: 첫 번째 단어의 발음기호에 있는 쌍점 모양 표시는 무엇을 알려 주나요?
            options:
              - { ko: 앞 소리를 길게 내요, correct: true }
              - { ko: 뒤 음절을 세게 읽어요, why: "그건 위쪽의 작은 세로줄 `ˈ`예요. `/ʃiːp/`의 `ː`는 길이를 알려 줘요." }
              - { ko: 그 소리는 내지 않아요, why: "소리를 빼라는 표시가 아니에요. `ː` 앞 소리를 길게 내요." }
          - ko: 두 번째 단어에서 세게 읽는 음절은 어디인가요?
            options:
              - { ko: 첫 음절, correct: true }
              - { ko: 둘째 음절, why: "발음기호 `/ˈæpəl/`에서 `ˈ`가 맨 앞에 있어요. 첫 음절이 세요." }
              - { ko: 두 음절을 똑같이, why: "영어는 한 음절을 세게 읽어요. `apple`은 `ˈ` 바로 뒤의 첫 음절이 세요." }
      - type: shadow
        en: I like bananas.
        ko: 나는 바나나를 좋아해요.
        checkVocab: false
