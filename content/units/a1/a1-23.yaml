id: unit.a1-23
title: { ko: 할 수 있어요, en: "Can and can't" }
lessons:
  - id: lesson.a1-23.1
    title: { ko: 수영할 줄 알아요, en: I can swim }
    goal: { ko: 할 줄 아는 것과 못 하는 것을 말할 수 있어요, en: "Say what you can and can't do" }
    introduces: [sense.can.modal.ability, sense.ride.v.bike, sense.dance.v.move, sense.sing.v.song, sense.draw.v.picture]
    steps:
      - type: listen
        en: I can swim.
        ko: 저는 수영할 줄 알아요.
      - type: listen
        en: "She can't ride a bike."
        ko: 그 사람은 자전거를 못 타요.
      - type: explain
        text: |
          `can`은 "~할 수 있다", "~할 줄 안다"예요. 동사 앞에 두고, 뒤의 동사는 그대로 써요. `she` 뒤에서도 `She can swim`이에요. `can`에도 동사에도 `-s`를 붙이지 않아요. 못 하면 `can't`예요. `can't`는 `cannot`을 줄인 말이고, `cannot`은 붙여 써요.

          `I can swim`처럼 동사 앞에 오는 `can`은 약하게 "큰"처럼 말해요. `can't`는 세고 길게 "캔(트)"처럼 말해요(영국식은 "칸트"에 가까워요). 끝의 `t`는 잘 안 들려서 이 세기 차이로 알아들어요.
        examples:
          - en: "[I]{who} [can swim]{do}."
            ko: 저는 수영할 줄 알아요.
            literal: 나는 / 수영할 수 있다
          - en: "She can't ride a bike."
            ko: 그 사람은 자전거를 못 타요.
          - en: My brother can sing and dance.
            ko: 남동생은 노래도 하고 춤도 출 줄 알아요.
          - en: "I can't draw."
            ko: 저는 그림을 못 그려요.
      - type: chooseMeaning
        en: My brother can sing and dance.
        item: sense.dance.v.move
        options:
          - { ko: 남동생은 노래도 하고 춤도 출 줄 알아요., correct: true }
          - { ko: 남동생은 노래는 하는데 춤은 못 춰요., why: "`can't`가 아니라 `can`이에요. 둘 다 할 줄 알아요." }
          - { ko: 남동생은 노래도 하고 그림도 그릴 줄 알아요., why: "그림을 그리는 건 `draw`예요. `dance`는 춤추다예요." }
      - type: listenChoose
        en: "I can't draw."
        item: sense.can.modal.ability
        options:
          - { en: "I can't draw.", correct: true }
          - { en: I can draw., why: "세고 길게 말한 `can't`가 들렸어요." }
          - { en: "I can't dance.", why: "`dance`가 아니라 `draw`가 들렸어요." }
      - type: chooseEnglish
        ko: 그 사람은 노래를 못 해요.
        item: sense.sing.v.song
        options:
          - { en: "She can't sing.", correct: true }
          - { en: "She can't sings.", why: "`can't` 뒤의 동사는 그대로 써요. `sing`이에요." }
          - { en: "She doesn't can sing.", why: "`can`이 있으면 `doesn't`를 쓰지 않아요. 못 한다고 할 때는 `can't`예요." }
      - type: fillBlank
        item: sense.ride.v.bike
        en: He can ___ a bike.
        ko: 그 사람은 자전거를 탈 줄 알아요.
        options:
          - { en: ride, correct: true }
          - { en: rides, why: "`can` 뒤의 동사는 그대로 써요." }
          - { en: drive, why: "`drive`는 차를 운전할 때 써요. 자전거는 `ride`예요." }
      - type: dialogue
        item: sense.can.modal.ability
        lines:
          - { speaker: Carlos, en: "I can't swim.", ko: 저는 수영을 못 해요. }
        question: 하린도 수영을 못 해요. 하린이 할 말을 골라요.
        options:
          - { en: Me neither., correct: true }
          - { en: Me too., why: "못 한다는 말에 \"저도요\"라고 할 때는 `Me neither`예요." }
          - { en: I can., why: "`I can`은 할 줄 안다는 말이에요. 하린도 못 해요." }
      - type: fillBlank
        item: sense.draw.v.picture
        en: "I can't ___."
        ko: 저는 그림을 못 그려요.
        answers: [draw]
      - type: arrange
        item: sense.can.modal.ability
        ko: 제 여동생은 자전거를 못 타요.
        en: "My sister can't ride a bike."
        extra: [rides, "don't"]
      - type: dictation
        item: sense.sing.v.song
        en: My brother can sing and dance.
        ko: 남동생은 노래도 하고 춤도 출 줄 알아요.
      - type: spell
        sense: sense.dance.v.move
      - type: shadow
        en: I can swim, and I can ride a bike.
        ko: 저는 수영도 하고 자전거도 탈 줄 알아요.
  - id: lesson.a1-23.2
    title: { ko: 할 줄 알아요?, en: Can you speak French? }
    goal: { ko: 할 줄 아는지 묻고 짧게 대답할 수 있어요, en: Ask if someone can do something and give short answers }
    introduces: [pattern.short-answer-can, sense.well.adv.good, sense.write.v.text, sense.french.n.language, sense.fix.v.repair]
    steps:
      - type: listen
        en: Can you speak French?
        ko: 프랑스어 할 줄 알아요?
      - type: listen
        en: "No, I can't. I can speak English and Spanish."
        ko: 아니요, 못 해요. 영어랑 스페인어는 할 줄 알아요.
      - type: explain
        text: |
          할 줄 아는지 물을 때는 `can`을 앞으로 보내 `Can you ~?`라고 해요. 대답은 `Yes, I can`이나 `No, I can't`예요. `Do you can ~?`이라고 하지 않아요. 대답 끝의 `can`은 `Yes, I can`처럼 세게 "캔"이라고 해요.

          어떻게 하는지 말하는 "잘"은 `well`이에요. `swim well`, `speak English well`처럼 동사 뒤에 오고, 목적어가 있으면 그 뒤에 와요. `good`은 `a good book`, `It's good`처럼 어떤지 말할 때 써서 보통 `swim good`이라고 하지 않아요.
        examples:
          - en: "Can [you]{who} [speak]{do} [French]{what}?"
            ko: 프랑스어 할 줄 알아요?
            literal: 너는 / 말할 수 있니 / 프랑스어를
          - en: "Yes, I can."
            ko: 네, 할 줄 알아요.
          - en: He can fix computers.
            ko: 그 사람은 컴퓨터를 고칠 줄 알아요.
          - en: I can swim well.
            ko: 저는 수영을 잘해요.
      - type: chooseMeaning
        en: He can fix computers.
        item: sense.fix.v.repair
        options:
          - { ko: 그 사람은 컴퓨터를 고칠 줄 알아요., correct: true }
          - { ko: 그 사람은 컴퓨터를 살 수 있어요., why: "사다는 `buy`예요. `fix`는 고치다예요." }
          - { ko: 그 사람은 컴퓨터를 못 고쳐요., why: "`can't`가 아니라 `can`이에요." }
      - type: listenChoose
        en: "Can you write in {Korean|sense.korean.n.language}?"
        item: sense.write.v.text
        options:
          - { en: "Can you write in {Korean|sense.korean.n.language}?", correct: true }
          - { en: "Can you speak {Korean|sense.korean.n.language}?", why: "`speak`가 아니라 `write`가 들렸어요." }
          - { en: "Can you write in {Chinese|sense.chinese.n.language}?", why: "`Chinese`가 아니라 `Korean`이 들렸어요." }
      - type: chooseEnglish
        ko: 저는 수영을 잘해요.
        item: sense.well.adv.good
        options:
          - { en: I can swim well., correct: true }
          - { en: I can swim good., why: "어떻게 하는지 말하는 \"잘\"은 `well`이에요. `good`은 `It's good`처럼 어떤지 말할 때 써요." }
          - { en: I can well swim., why: "`well`은 동사 뒤에 와요. `swim well`이에요." }
      - type: fillBlank
        item: pattern.short-answer-can
        en: "Can you speak French? No, I ___."
        ko: 프랑스어 할 줄 알아요? 아니요, 못 해요.
        options:
          - { en: "can't", correct: true }
          - { en: "don't", why: "`Can`으로 물으면 `can't`로 대답해요." }
          - { en: "am not", why: "`Can`으로 물으면 `can't`로 대답해요. `am not`은 `Are you ~?`에 대답할 때예요." }
      - type: dialogue
        item: pattern.short-answer-can
        lines:
          - { speaker: Emma, en: Can you fix bikes?, ko: 자전거 고칠 줄 알아요? }
        question: 준은 자전거를 고칠 줄 알아요. 준이 할 말을 골라요.
        options:
          - { en: "Yes, I can.", correct: true }
          - { en: "Yes, I do.", why: "`Can`으로 물으면 `Yes, I can`으로 대답해요." }
          - { en: "No, I can't.", why: "`No, I can't`는 못 한다는 말이에요. 준은 고칠 줄 알아요." }
      - type: fillBlank
        item: sense.well.adv.good
        en: I can speak English ___.
        ko: 저는 영어를 잘해요.
        answers: [well]
      - type: arrange
        item: sense.write.v.text
        ko: 그 사람은 글을 잘 써요.
        en: She can write well.
        extra: [good, do]
      - type: dictation
        item: sense.french.n.language
        en: Can you speak French?
        ko: 프랑스어 할 줄 알아요?
      - type: spell
        sense: sense.write.v.text
      - type: shadow
        en: "Can you speak French? No, I can't."
        ko: 프랑스어 할 줄 알아요? 아니요, 못 해요.
  - id: lesson.a1-23.3
    title: { ko: 앉아도 돼요?, en: Can I sit here? }
    goal: { ko: 해도 되는지 묻고 부탁할 수 있어요, en: Ask for permission and ask for help }
    introduces: [sense.help.v.assist, sense.sit.v.seat, sense.use.v.utilize, sense.wait.v.stay, sense.borrow.v.take, sense.sure.interj.yes]
    steps:
      - type: listen
        en: Can I sit here?
        ko: 여기 앉아도 돼요?
      - type: listen
        en: "Can you help me, please?"
        ko: 좀 도와주실래요?
      - type: explain
        text: |
          `Can I ~?`는 "~해도 돼요?"라고 허락을 구하는 말이에요. `Can I sit here?`는 "여기 앉아도 돼요?"예요. 앞 단원에서 배운 `Can I have ~?`도 같은 모양이에요.

          `Can I ~?`에 괜찮다고 할 때는 `Sure`(그럼요)나 `Yes, you can`이라고 해요. `Can you ~?`는 할 줄 아는지 물을 때도 쓰고 "~해 주실래요?"처럼 부탁할 때도 써요. 부탁을 들어줄 수 있으면 `Sure`, 안 되면 `Sorry, I can't`라고 해요.
        examples:
          - en: "Can [I]{who} [sit]{do} [here]{where}?"
            ko: 여기 앉아도 돼요?
            literal: 내가 / 앉아도 되니 / 여기에
          - en: "Can you help me, please?"
            ko: 좀 도와주실래요?
          - en: Can I use your phone?
            ko: 휴대폰 좀 써도 돼요?
          - en: Can you wait a minute?
            ko: 잠깐만 기다려 줄래요?
          - en: Can I borrow your pen?
            ko: 펜 좀 빌려도 돼요?
      - type: chooseMeaning
        en: Can I use your phone?
        item: sense.use.v.utilize
        options:
          - { ko: 휴대폰 좀 써도 돼요?, correct: true }
          - { ko: 휴대폰 좀 사도 돼요?, why: "사다는 `buy`예요. `use`는 쓰다예요." }
          - { ko: 휴대폰 쓸 줄 알아요?, why: "`Can I`는 내가 해도 되는지 묻는 말이에요. 상대가 할 줄 아는지는 `Can you`로 물어요." }
      - type: listenChoose
        en: Can I borrow your pen?
        item: sense.borrow.v.take
        options:
          - { ko: 펜 좀 빌려도 돼요?, correct: true }
          - { ko: 펜 좀 써도 돼요?, why: "`use`가 아니라 `borrow`가 들렸어요." }
          - { ko: 책 좀 빌려도 돼요?, why: "`book`이 아니라 `pen`이 들렸어요." }
      - type: chooseEnglish
        ko: 여기 앉아도 돼요?
        item: sense.sit.v.seat
        options:
          - { en: Can I sit here?, correct: true }
          - { en: I can sit here?, why: "물을 때는 `Can`이 앞에 와요." }
          - { en: Can I sit there?, why: "\"여기\"는 `here`예요. `there`는 거기, 저기예요." }
      - type: fillBlank
        item: sense.help.v.assist
        en: "Can you ___ me, please?"
        ko: 좀 도와주실래요?
        options:
          - { en: help, correct: true }
          - { en: wait, why: "`wait`은 기다리다예요. 도와 달라고 할 때는 `help`예요." }
          - { en: use, why: "`use`는 쓰다, 사용하다예요. 도와 달라고 할 때는 `help`예요." }
      - type: dialogue
        item: sense.use.v.utilize
        lines:
          - { speaker: Sam, en: Can I use your pen?, ko: 펜 좀 써도 돼요? }
        question: 미나는 펜을 빌려줘도 괜찮아요. 미나가 할 말을 골라요.
        options:
          - { en: "{Sure|sense.sure.interj.yes}.", correct: true }
          - { en: "Yes, I can.", why: "`Yes, I can`은 내가 할 수 있다는 말이에요. `Can I`로 물으면 `Sure`나 `Yes, you can`으로 대답해요." }
          - { en: "No, you can't.", why: "`No, you can't`는 안 된다는 말이에요. 미나는 빌려줘도 괜찮아요." }
      - type: fillBlank
        item: sense.wait.v.stay
        en: Can you ___ a minute?
        ko: 잠깐만 기다려 줄래요?
        answers: [wait]
      - type: arrange
        item: sense.borrow.v.take
        ko: 펜 좀 빌려도 돼요?
        en: Can I borrow your pen?
        extra: [you, do]
      - type: dictation
        item: sense.help.v.assist
        en: "Can you help me, please?"
        ko: 좀 도와주실래요?
      - type: spell
        sense: sense.borrow.v.take
      - type: shadow
        en: "Excuse me. Can I sit here?"
        ko: 저기요, 여기 앉아도 돼요?
