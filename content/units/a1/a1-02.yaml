id: unit.a1-02
title: { ko: "I am, you are", en: "I am, you are" }
lessons:
  - id: lesson.a1-02.1
    title: { ko: "I'm, you're", en: "I'm, you're" }
    goal: { ko: "피곤하다, 배고프다 같은 상태를 말하고 물어볼 수 있어요", en: Say and ask how someone feels }
    introduces: [sense.tired.adj.sleepy, sense.hungry.adj.food, sense.happy.adj.glad, sense.busy.adj.work, sense.thirsty.adj.drink]
    steps:
      - type: listen
        en: "I'm tired."
        ko: 피곤해요.
      - type: listen
        en: Are you hungry?
        ko: 배고파요?
      - type: explain
        text: |
          `I'm tired`는 "피곤해요"예요. `I am`을 줄여 `I'm`이라고 하고 평소에는 거의 늘 줄여요. 상대 이야기는 `You are`를 줄인 `You're`로 해요.

          물을 때는 `Are you tired?`처럼 `Are`를 앞으로 옮겨요. 영어 문장에는 보통 누구 이야기인지 `I'm`이나 `You're`가 들어가요. 짧게 대답할 때는 빼기도 해요.
        examples:
          - en: "I'm tired."
            ko: 피곤해요.
          - en: "I'm hungry."
            ko: 배고파요.
          - en: "You're busy."
            ko: 바쁘네요.
          - en: Are you thirsty?
            ko: 목말라요?
      - type: chooseMeaning
        en: "I'm hungry."
        item: sense.hungry.adj.food
        options:
          - { ko: 배고파요., correct: true }
          - { ko: 목말라요., why: "목마른 건 `thirsty`예요. `hungry`는 배고픈 거예요." }
          - { ko: 피곤해요., why: "피곤한 건 `tired`예요. `hungry`는 배고픈 거예요." }
      - type: listenChoose
        en: Are you thirsty?
        item: sense.thirsty.adj.drink
        options:
          - { ko: 목말라요?, correct: true }
          - { ko: 배고파요?, why: "배고픈 건 `hungry`예요. 들린 말은 `th`로 시작하는 `thirsty`예요." }
          - { ko: 저는 목말라요., why: "`Are you`로 시작해서 상대에게 묻는 말이에요." }
      - type: explain
        text: |
          `busy`는 철자와 소리가 달라요. `u`가 `big`의 `i`처럼 소리 나요.

          `thirsty`는 `thank`처럼 혀끝을 이 사이에 두고 시작해요. `happy`와 `hungry`는 둘 다 `h`로 시작하니 그다음 소리를 잘 들어요.
        examples:
          - en: Are you busy?
            ko: 바빠요?
          - en: "I'm thirsty."
            ko: 목말라요.
          - en: "I'm happy."
            ko: 기뻐요.
      - type: listenChoose
        en: "I'm happy."
        item: sense.happy.adj.glad
        options:
          - { ko: 기뻐요., correct: true }
          - { ko: 배고파요., why: "`h` 뒤에 `cat`의 `a` 소리가 났어요. 기쁜 `happy`예요. `hungry`는 `h` 뒤에 `cup`의 `u` 소리가 나요." }
          - { ko: 바빠요., why: "바쁜 건 `busy`예요. 들린 말은 `h`로 시작했어요." }
      - type: dialogue
        item: sense.busy.adj.work
        lines:
          - { speaker: Mina, en: "Are you busy, @Omar?", ko: "바빠요, 오마르 씨?" }
        question: 오마르는 지금 바빠요. 오마르가 할 말을 골라요.
        options:
          - { en: "Yes, I am.", correct: true }
          - { en: "Yes, I'm.", why: "평소에는 `I'm`으로 줄여도 대답 끝에 오는 `I am`은 줄이지 않아요." }
          - { en: "Yes, you are.", why: "`you are`는 상대 이야기예요. 내 이야기는 `I am`이에요." }
      - type: chooseEnglish
        ko: 피곤해요?
        item: sense.tired.adj.sleepy
        options:
          - { en: Are you tired?, correct: true }
          - { en: "You're tired.", why: "마침표로 끝나서 묻는 말이 아니에요. 물을 때는 `Are`를 앞으로 옮겨요." }
          - { en: Are you hungry?, why: "`hungry`는 배고픈 거예요. 피곤한 건 `tired`예요." }
      - type: fillBlank
        item: sense.am.v.be
        en: ___ tired.
        ko: 피곤해요.
        answers: ["I'm", "I am"]
      - type: arrange
        item: sense.hungry.adj.food
        ko: 배고프고 목말라요.
        en: "I'm hungry and thirsty."
        accept: ["I'm thirsty and hungry."]
        extra: ["you're"]
      - type: spell
        sense: sense.busy.adj.work
      - type: shadow
        en: "I'm tired. Are you tired?"
        ko: 저는 피곤해요. 피곤해요?
  - id: lesson.a1-02.2
    title: { ko: "I'm not", en: "I'm not" }
    goal: { ko: not을 넣어 아니라고 말하고 대답할 수 있어요, en: Say what you are not and answer with No }
    introduces: [sense.not.adv.negative, sense.late.adj.not-on-time, sense.ready.adj.prepared, sense.sure.adj.certain, sense.right.adj.correct]
    steps:
      - type: listen
        en: Are you ready?
        ko: 준비됐어요?
      - type: listen
        en: "No, I'm not."
        ko: 아니요, 아직요.
      - type: explain
        text: |
          아니라고 할 때는 `am`, `are` 바로 뒤에 `not`을 넣어요. `I'm not ready`처럼 `not`이 `ready` 앞에 와요.

          상대 이야기는 `You're not`이라고 하고 `You aren't`도 같은 말이에요. `I am not`은 `I'm not`으로만 줄여요. `Are you ready?`에 아니라고 할 때는 `No, I'm not`이라고 해요.
        examples:
          - en: "I'm not ready."
            ko: 저는 준비 안 됐어요.
          - en: "You're not late."
            ko: 안 늦었어요.
          - en: "You aren't late."
            ko: 안 늦었어요.
          - en: Are you ready?
            ko: 준비됐어요?
          - en: "No, I'm not."
            ko: 아니요, 안 됐어요.
      - type: dialogue
        item: sense.not.adv.negative
        lines:
          - { speaker: Leo, en: "Are you ready, @Hana?", ko: "하나야, 준비됐어?" }
        question: 하나는 아직 준비가 안 됐어요. 하나가 할 말을 골라요.
        options:
          - { en: "No, I'm not.", correct: true }
          - { en: "No, I amn't.", why: "`am`과 `not`은 줄여 붙이지 않아요. `I'm not`이라고 해요." }
          - { en: "No, I am.", why: "`I am`만으로는 준비됐다는 말이 돼요. 아니면 `not`을 넣어 `I'm not`이라고 해요." }
      - type: fillBlank
        item: sense.not.adv.negative
        en: You ___ late.
        ko: 안 늦었어요.
        options:
          - { en: "aren't", correct: true }
          - { en: "isn't", why: "`isn't`는 `is not`을 줄인 말이에요. `you`와는 `aren't`를 써요." }
          - { en: not, why: "`are`가 빠졌어요. `aren't`나 `You're not`이라고 해요." }
      - type: explain
        text: |
          약속에 늦었을 때는 `Sorry, I'm late`라고 먼저 말해요. 확실히 모를 때는 `I'm not sure`라고 해요. `sure`가 "확실한"이라서 "잘 모르겠어요"라는 뜻이 돼요. `Are you sure?`는 "정말이에요?"예요.

          상대 말이 맞으면 `You're right`라고 해요. `right`는 "맞는"이에요.
        examples:
          - en: "Sorry, I'm late."
            ko: 늦어서 미안해요.
          - en: "I'm not sure."
            ko: 잘 모르겠어요.
          - en: Are you sure?
            ko: 정말이에요?
          - en: "You're right."
            ko: 맞아요.
      - type: chooseMeaning
        en: "I'm not sure."
        item: sense.sure.adj.certain
        options:
          - { ko: 잘 모르겠어요., correct: true }
          - { ko: 확실해요., why: "`not`이 있어서 반대예요. 확실하지 않다는 말이에요." }
          - { ko: 준비 안 됐어요., why: "준비는 `ready`예요. `sure`는 확실하다는 말이에요." }
      - type: listenChoose
        en: "You aren't late."
        item: sense.late.adj.not-on-time
        options:
          - { ko: 안 늦었어요., correct: true }
          - { ko: 늦었어요., why: "`aren't`가 들렸어요. `are not`을 줄인 말이라 안 늦었다는 뜻이에요." }
          - { ko: 저 늦었어요., why: "`You`로 시작했어요. 상대 이야기예요." }
      - type: dialogue
        item: sense.right.adj.correct
        lines:
          - { speaker: Linh, en: The tea is cold., ko: 차가 식었어. }
        question: 차가 정말 식었어요. 린의 말에 맞장구칠 말을 골라요.
        options:
          - { en: "You're right.", correct: true }
          - { en: "I'm right.", why: "내가 맞다는 말이에요. 상대 말이 맞으면 `You're right`예요." }
          - { en: "You're welcome.", why: "`You're welcome`은 고맙다는 말에 하는 대답이에요." }
      - type: chooseEnglish
        ko: 늦어서 미안해요.
        item: sense.late.adj.not-on-time
        options:
          - { en: "Sorry, I'm late.", correct: true }
          - { en: "Sorry, you're late.", why: "`you're`는 상대 이야기예요. 내가 늦었으면 `I'm late`예요." }
          - { en: "Sorry, I'm not late.", why: "`not`이 들어가면 안 늦었다는 말이 돼요." }
      - type: arrange
        item: sense.ready.adj.prepared
        ko: 미안해요, 아직 준비가 안 됐어요.
        en: "Sorry, I'm not ready."
        extra: ["no"]
      - type: dictation
        item: sense.sure.adj.certain
        en: Are you sure?
        ko: 정말이에요?
      - type: spell
        sense: sense.ready.adj.prepared
  - id: lesson.a1-02.3
    title: { ko: "아주, 정말", en: Very and really }
    goal: { ko: "얼마나 피곤한지, 시간이 있는지 말할 수 있어요", en: "Say how tired you are and if you're free" }
    introduces: [sense.very.adv.much, sense.really.adv.truly, sense.free.adj.not-busy, sense.home.adv.at-home, sense.sick.adj.ill]
    steps:
      - type: listen
        en: Are you free tomorrow?
        ko: 내일 시간 있어요?
      - type: listen
        en: "Sorry, I'm really busy."
        ko: 미안해요, 정말 바빠요.
      - type: explain
        text: |
          `I'm very tired`는 "아주 피곤해요"예요. `very`와 `really`는 우리말 "아주, 정말"처럼 뜻을 세게 해요. 말할 때는 `really`를 더 자주 쓰지만 뜻은 거의 같아요.

          `not very`는 "별로 안"이에요. `I'm not very hungry`는 "별로 안 배고파요"예요.
        examples:
          - en: "I'm very tired."
            ko: 아주 피곤해요.
          - en: "I'm really hungry."
            ko: 정말 배고파요.
          - en: "I'm not very hungry."
            ko: 별로 안 배고파요.
      - type: chooseMeaning
        en: "I'm not very hungry."
        item: sense.very.adv.much
        options:
          - { ko: 별로 안 배고파요., correct: true }
          - { ko: 아주 배고파요., why: "`not`이 있어서 반대예요. `not very`는 \"별로 안\"이에요." }
          - { ko: 별로 안 목말라요., why: "목마른 건 `thirsty`예요. `hungry`는 배고픈 거예요." }
      - type: explain
        text: |
          `Are you free?`는 "시간 있어요?"예요. `free`는 `busy`의 반대예요.

          `I'm home`은 "집이에요"예요. 이 뜻일 때 `home` 앞에는 `in`이나 `to`를 붙이지 않아요. `sick`은 "아픈"이에요.
        examples:
          - en: Are you free?
            ko: 시간 있어요?
          - en: "I'm home."
            ko: 집이에요.
          - en: Go home.
            ko: 집에 가세요.
          - en: "I'm sick."
            ko: 아파요.
      - type: listenChoose
        en: Are you home?
        item: sense.home.adv.at-home
        options:
          - { ko: 집이에요?, correct: true }
          - { ko: 저 집이에요., why: "`Are you`로 시작해서 상대에게 묻는 말이에요." }
          - { ko: 아파요?, why: "아픈 건 `sick`이에요. 들린 말은 `home`, 집이에요." }
      - type: chooseEnglish
        ko: 집에 가세요.
        item: sense.home.adv.at-home
        options:
          - { en: Go home., correct: true }
          - { en: Go to home., why: "`home` 앞에는 `to`를 붙이지 않아요. `Go home`이라고 해요." }
          - { en: Go in home., why: "`home` 앞에는 `in`을 붙이지 않아요. `Go home`이라고 해요." }
      - type: dialogue
        item: sense.free.adj.not-busy
        lines:
          - { speaker: Ana, en: "Are you free tomorrow, @Diego?", ko: "디에고, 내일 시간 있어?" }
        question: 디에고는 내일 바빠요. 디에고가 할 말을 골라요.
        options:
          - { en: "Sorry, I'm busy.", correct: true }
          - { en: "Yes, I'm free.", why: "`free`는 시간이 있다는 말이에요. 바쁘면 `I'm busy`예요." }
          - { en: "Sorry, I'm not busy.", why: "`not busy`는 안 바쁘다는 말이에요. 바쁘면 `not`을 빼요." }
      - type: dialogue
        item: sense.sick.adj.ill
        lines:
          - { speaker: Jun, en: "Are you OK, @Chloe?", ko: "클로이 씨, 괜찮아요?" }
        question: 클로이는 몸이 안 좋아요. 클로이가 할 말을 골라요.
        options:
          - { en: "No, I'm sick.", correct: true }
          - { en: "No, I'm sorry.", why: "`sorry`는 미안하다는 말이에요. 아플 때는 `sick`이에요." }
          - { en: "Yes, I'm sick.", why: "`Are you OK?`에 `Yes`라고 하면 괜찮다는 말이 돼요. 아프면 `No`로 대답해요." }
      - type: fillBlank
        item: sense.really.adv.truly
        en: "I'm ___ hungry."
        ko: 정말 배고파요.
        answers: [really, very]
      - type: arrange
        item: sense.free.adj.not-busy
        ko: 저 내일 시간 있어요.
        en: "I'm free tomorrow."
        extra: [to]
      - type: spell
        sense: sense.sick.adj.ill
      - type: shadow
        en: "I'm not very hungry."
        ko: 별로 안 배고파요.
  - id: lesson.a1-02.4
    title: { ko: "저도요", en: "Me too, me neither" }
    goal: { ko: "상대 말에 \"저도요\"라고 맞장구칠 수 있어요", en: Agree with someone }
    introduces: [pattern.me-too, pattern.me-neither, sense.great.adj.very-good, sense.bad.adj.not-good, sense.angry.adj.mad]
    steps:
      - type: listen
        en: "I'm not hungry."
        ko: 저는 배 안 고파요.
      - type: listen
        en: Me neither.
        ko: 저도요.
      - type: explain
        text: |
          상대 말이 나에게도 맞으면 `Me too`라고 해요. `I'm hungry`에 `Me too`라고 하면 "저도 배고파요"예요.

          상대가 `not`이 든 말을 했을 때는 보통 `Me neither`라고 해요. `I'm not hungry`에 `Me neither`라고 하면 "저도 배 안 고파요"예요. 우리말로는 둘 다 "저도요"라서 헷갈리기 쉬워요.
        examples:
          - en: "I'm hungry."
            ko: 배고파요.
          - en: Me too.
            ko: 저도요.
          - en: "I'm not hungry."
            ko: 배 안 고파요.
          - en: Me neither.
            ko: 저도요.
      - type: dialogue
        item: pattern.me-too
        lines:
          - { speaker: Priya, en: "I'm really tired.", ko: "정말 피곤해요." }
        question: 오마르도 피곤해요. 오마르가 할 말을 골라요.
        options:
          - { en: Me too., correct: true }
          - { en: Me neither., why: "`Me neither`는 `not`이 든 말에 맞장구칠 때 써요. 프리야의 말에는 `not`이 없어요." }
          - { en: "I'm too.", why: "`I'm`은 뒤에 아무 말 없이 끝내지 않아요. `Me too`나 `I'm tired, too`라고 해요." }
      - type: dialogue
        item: pattern.me-neither
        lines:
          - { speaker: Sam, en: "I'm not ready.", ko: "나 아직 준비 안 됐어." }
        question: 유키도 아직 준비가 안 됐어요. 유키가 할 말을 골라요.
        options:
          - { en: Me neither., correct: true }
          - { en: Me too., why: "`not`이 든 말에는 보통 `Me neither`로 맞장구쳐요." }
          - { en: Me not., why: "이런 말은 쓰지 않아요. `not`이 든 말에는 `Me neither`라고 해요." }
      - type: explain
        text: |
          `How are you?`에 아주 잘 지내면 `Great, thanks`라고 해요. 그럭저럭 괜찮으면 `Not bad`라고 해요. `bad`는 "나쁜"이라서 "나쁘지 않아요"라는 말이에요.

          `angry`는 "화난"이에요. `hungry`와 헷갈리기 쉬운데 `angry`는 `a`로, `hungry`는 `h`로 시작해요.
        examples:
          - en: "Great, thanks."
            ko: 아주 잘 지내요, 고마워요.
          - en: Not bad.
            ko: 나쁘지 않아요.
          - en: Are you angry?
            ko: 화났어요?
          - en: "No, I'm not."
            ko: 아니요, 화 안 났어요.
      - type: chooseMeaning
        en: Not bad.
        item: sense.bad.adj.not-good
        options:
          - { ko: 나쁘지 않아요., correct: true }
          - { ko: 안 좋아요., why: "`not`이 있어서 반대예요. 나쁘지 않다, 괜찮다는 말이에요." }
          - { ko: 아주 좋아요., why: "아주 좋은 건 `great`예요. `Not bad`는 그럭저럭 괜찮다는 말이에요." }
      - type: listenChoose
        en: Are you angry?
        item: sense.angry.adj.mad
        options:
          - { ko: 화났어요?, correct: true }
          - { ko: 배고파요?, why: "`hungry`는 `h`로 시작해요. 들린 말은 `h` 없이 `cat`의 `a` 소리로 시작하는 `angry`예요." }
          - { ko: 화났어요., why: "`Are you`로 시작해서 묻는 말이에요." }
      - type: chooseEnglish
        ko: 아주 잘 지내요, 고마워요.
        item: sense.great.adj.very-good
        options:
          - { en: "Great, thanks.", correct: true }
          - { en: "Not bad, thanks.", why: "`Not bad`는 그럭저럭 괜찮다는 말이에요. 아주 좋을 때는 `great`예요." }
          - { en: "Bad, thanks.", why: "`bad`는 나쁜 거예요. 아주 좋을 때는 `great`예요." }
      - type: fillBlank
        item: pattern.me-neither
        en: Me ___.
        ko: "(오마르: `I'm not angry.`) 저도 화 안 났어요."
        options:
          - { en: neither, correct: true }
          - { en: too, why: "앞의 말에 `not`이 있어서 `Me neither`로 맞장구쳐요." }
      - type: arrange
        item: sense.angry.adj.mad
        ko: 화난 거 아니에요. 배고픈 거예요.
        en: "I'm not angry. I'm hungry."
        extra: [are]
      - type: spell
        sense: sense.great.adj.very-good
      - type: shadow
