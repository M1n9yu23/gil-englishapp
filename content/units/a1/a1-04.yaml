id: unit.a1-04
title: { ko: "다른 사람 소개하기", en: "Introducing people" }
lessons:
  - id: lesson.a1-04.1
    title: { ko: he와 she, en: he and she }
    goal: { ko: 친구나 동료를 소개할 수 있어요, en: Introduce a friend or a coworker }
    introduces: [sense.he.pron.male, sense.she.pron.female, sense.friend.n.person, sense.coworker.n.work, sense.classmate.n.school]
    steps:
      - type: listen
        en: "This is @Jun. He's my friend."
        ko: "이쪽은 준이에요. 제 친구예요."
      - type: listen
        en: "This is @Hana. She's my coworker."
        ko: "이쪽은 하나 씨예요. 제 직장 동료예요."
      - type: explain
        text: |
          사람을 소개할 때는 `This is Jun`처럼 `this`로 시작해요. 우리말은 "그 사람"이라고 하거나 아예 빼고 말하지만 영어는 남자면 `he`, 여자면 `she`로 꼭 넣어요. `He's`, `She's`는 `He is`, `She is`를 줄인 말이에요.

          `friend`는 나이와 상관없이 가까운 사람에게 써요. 함께 일하는 사람은 `coworker`, 같은 반 학생은 `classmate`예요.
        examples:
          - en: "This is @Jun. He's my friend."
            ko: "이쪽은 준이에요. 제 친구예요."
          - en: "[She]{who} [is]{do} [my coworker]{what}."
            ko: 제 직장 동료예요.
            literal: 그 사람은 / ~이다 / 제 직장 동료
          - en: He's my classmate.
            ko: 저랑 같은 반이에요.
      - type: chooseMeaning
        en: She's my classmate.
        item: sense.classmate.n.school
        options:
          - { ko: 저랑 같은 반이에요., correct: true }
          - { ko: 제 직장 동료예요., why: "직장 동료는 `coworker`예요. `classmate`는 같은 반 학생이에요." }
          - { ko: 제 선생님이에요., why: "선생님은 `teacher`예요. `classmate`는 같은 반에서 함께 배우는 사람이에요." }
      - type: listenChoose
        en: He's my coworker.
        item: sense.coworker.n.work
        options:
          - { ko: 그 남자는 제 직장 동료예요., correct: true }
          - { ko: 그 여자는 제 직장 동료예요., why: "`she`가 아니라 `he`가 들렸어요. `he`는 남자를 가리켜요." }
          - { ko: 그 남자는 제 친구예요., why: "친구는 `friend`예요. 들린 말은 함께 일하는 사람 `coworker`예요." }
      - type: dialogue
        item: sense.she.pron.female
        lines:
          - { speaker: Jun, en: "@Mina, this is @Chloe.", ko: "미나야, 이쪽은 클로이야." }
        question: 클로이는 준과 같은 반이에요. 준이 이어서 할 말을 골라요.
        options:
          - { en: She's my classmate., correct: true }
          - { en: He's my classmate., why: "클로이는 여자라서 `she`를 써요. `he`는 남자를 가리켜요." }
          - { en: It's my classmate., why: "`it`은 물건이나 동물을 가리켜요. 사람은 `he`나 `she`예요." }
      - type: dialogue
        item: sense.he.pron.male
        lines:
          - { speaker: Ana, en: "Hi, @Sam. This is @Diego.", ko: "안녕하세요, 샘 씨. 이쪽은 디에고 씨예요." }
        question: 디에고는 아나의 직장 동료예요. 아나가 이어서 할 말을 골라요.
        options:
          - { en: He's my coworker., correct: true }
          - { en: She's my coworker., why: "디에고는 남자라서 `he`를 써요. `she`는 여자를 가리켜요." }
          - { en: He's my classmate., why: "`classmate`는 같은 반 학생이에요. 함께 일하는 사람은 `coworker`예요." }
      - type: chooseEnglish
        ko: 이쪽은 제 친구 준이에요.
        item: sense.friend.n.person
        options:
          - { en: "This is my friend, @Jun.", correct: true }
          - { en: "He's my friend, @Jun.", why: "처음 소개할 때는 `This is`로 시작해요. `he`는 이미 소개한 사람을 다시 가리킬 때 써요." }
          - { en: "This my friend, @Jun.", why: "`is`가 빠졌어요. 영어는 `is`를 빼지 않아요." }
      - type: fillBlank
        item: sense.coworker.n.work
        en: She's my ___.
        ko: 제 직장 동료예요.
        answers: [coworker]
      - type: arrange
        item: sense.classmate.n.school
        ko: 이쪽은 레오예요. 저랑 같은 반이에요.
        en: "This is @Leo. He's my classmate."
        extra: [She's]
      - type: dictation
        item: sense.friend.n.person
        en: She's my friend.
        ko: 제 친구예요.
      - type: spell
        sense: sense.friend.n.person
      - type: shadow
        en: "This is @Jun. He's my friend."
        ko: "이쪽은 준이에요. 제 친구예요."
  - id: lesson.a1-04.2
    title: { ko: 어떤 사람인지 말하기, en: What people are like }
    goal: { ko: 어떤 사람인지 짧게 말할 수 있어요, en: Say what someone is like }
    introduces: [sense.kind.adj.nice, sense.funny.adj.laugh, sense.tall.adj.height, sense.short.adj.height, sense.smart.adj.clever]
    steps:
      - type: listen
        en: "This is @Diego. He's tall and very funny."
        ko: "이쪽은 디에고예요. 키가 크고 아주 웃겨요."
      - type: listen
        en: She's kind and really smart.
        ko: 친절하고 정말 똑똑해요.
      - type: explain
        text: |
          `He's tall`은 "키가 커요"예요. 사람이 어떤지도 `He's`, `She's` 바로 뒤에 붙여요. 사람 키를 말할 때는 `big`, `small`보다 `tall`, `short`를 써요.

          `kind`는 "친절한", `smart`는 "똑똑한", `funny`는 "웃긴"이에요. 두 가지를 말할 때는 `and`로 이어요.
        examples:
          - en: He's tall.
            ko: 키가 커요.
          - en: She's short.
            ko: 키가 작아요.
          - en: He's kind and funny.
            ko: 친절하고 재미있어요.
          - en: She's really smart.
            ko: 정말 똑똑해요.
      - type: chooseMeaning
        en: He's tall.
        item: sense.tall.adj.height
        options:
          - { ko: 키가 커요., correct: true }
          - { ko: 키가 작아요., why: "키가 작은 건 `short`예요. `tall`은 키가 큰 거예요." }
          - { ko: 덩치가 커요., why: "크기를 말할 때는 `big`이에요. `tall`은 키가 크다는 말이에요." }
      - type: listenChoose
        en: She's short.
        item: sense.short.adj.height
        options:
          - { ko: 키가 작아요., correct: true }
          - { ko: 키가 커요., why: "키가 큰 건 `tall`이에요. 들린 말은 `short`예요." }
          - { ko: 똑똑해요., why: "`smart`는 `s` 소리, `short`는 `sh` 소리로 시작해요. 들린 말은 `short`예요." }
      - type: chooseEnglish
        ko: 정말 웃겨요.
        item: sense.funny.adj.laugh
        options:
          - { en: He's really funny., correct: true }
          - { en: He's really kind., why: "`kind`는 친절하다는 말이에요. 웃기다는 `funny`예요." }
          - { en: He's really smart., why: "`smart`는 똑똑하다는 말이에요. 웃기다는 `funny`예요." }
      - type: readPassage
        sentences:
          - en: "This is @Linh."
            ko: "이쪽은 린이에요."
          - en: "She's my classmate."
            ko: "저랑 같은 반이에요."
          - en: "She's from Vietnam."
            ko: "베트남에서 왔어요."
          - en: "She's tall and really funny."
            ko: "키가 크고 정말 웃겨요."
          - en: "She's smart, too."
            ko: "똑똑하기도 해요."
        questions:
          - ko: 린은 어떤 사람이에요?
            options:
              - { ko: 키가 크고 웃겨요., correct: true }
              - { ko: 키가 작고 웃겨요., why: "`tall`이라고 했어요. 키가 커요." }
              - { ko: 키가 크고 친절해요., why: "`funny`라고 했어요. 친절하다는 `kind`예요." }
          - ko: 린은 글쓴이와 어떤 사이예요?
            options:
              - { ko: 같은 반, correct: true }
              - { ko: 직장 동료, why: "`classmate`라고 했어요. 같은 반에서 함께 배워요." }
      - type: fillBlank
        item: sense.kind.adj.nice
        en: She's very ___.
        ko: 아주 친절해요.
        answers: [kind]
      - type: arrange
        item: sense.smart.adj.clever
        ko: 키가 크고 똑똑해요.
        en: He's tall and smart.
        extra: [big]
      - type: dictation
        item: sense.kind.adj.nice
        en: She's kind and very funny.
        ko: 친절하고 아주 웃겨요.
      - type: spell
        sense: sense.funny.adj.laugh
      - type: shadow
        en: He's tall and really funny.
        ko: 키가 크고 정말 웃겨요.
  - id: lesson.a1-04.3
    title: { ko: 누구예요?, en: Who is he? }
    goal: { ko: 다른 사람이 누구인지 묻고 대답할 수 있어요, en: Ask and answer questions about someone }
    introduces: [sense.who.pron.question, sense.neighbor.n.next-door, sense.boss.n.work, sense.married.adj.spouse, sense.shy.adj.timid]
    steps:
      - type: listen
        en: Who is he?
        ko: 저 사람은 누구예요?
      - type: listen
        en: "He's my neighbor. He's very shy."
        ko: "제 이웃이에요. 낯을 많이 가려요."
      - type: explain
        text: |
          누구인지 물을 때는 `who`를 맨 앞에 두고 `Who is he?`라고 해요. 대답은 `He's my neighbor`처럼 해요. `Who is`는 `Who's`로 줄여 말하기도 해요.

          `married`는 "결혼한"이에요. 우리말은 "결혼했어요"처럼 지난 일로 말하지만 영어는 `I'm married`처럼 지금 상태로 말해요.
        examples:
          - en: Who is he?
            ko: 저 사람은 누구예요?
          - en: He's my neighbor.
            ko: 제 이웃이에요.
          - en: I'm married.
            ko: 저는 결혼했어요.
      - type: chooseMeaning
        en: Is he married?
        item: sense.married.adj.spouse
        options:
          - { ko: 그 사람 결혼했어요?, correct: true }
          - { ko: 그 사람은 결혼했어요., why: "`Is`로 시작해서 묻는 말이에요." }
          - { ko: 그 사람 이웃이에요?, why: "이웃은 `neighbor`예요. `married`는 결혼했다는 말이에요." }
      - type: listenChoose
        en: She's my boss.
        item: sense.boss.n.work
        options:
          - { ko: 제 상사예요., correct: true }
          - { ko: 제 직장 동료예요., why: "같이 일하는 동료는 `coworker`예요. `boss`는 내 위에 있는 상사예요." }
          - { ko: 제 이웃이에요., why: "이웃은 `neighbor`예요. 들린 말은 `boss`예요." }
      - type: dialogue
        item: sense.who.pron.question
        lines:
          - { speaker: Mina, en: "Who is she?", ko: "저 사람은 누구예요?" }
        question: 그 여자는 준의 이웃이에요. 준이 할 말을 골라요.
        options:
          - { en: She's my neighbor., correct: true }
          - { en: "Yes, she is.", why: "`Who`로 묻는 말에는 `Yes`나 `No`로 대답하지 않아요. 누구인지 말해요." }
          - { en: He's my neighbor., why: "미나가 `she`로 물었어요. 여자를 가리키니 `She's`로 대답해요." }
      - type: explain
        text: |
          `he`, `she`로 물을 때도 `is`를 앞으로 옮겨요. `Is she married?`에는 `Yes, she is`나 `No, she isn't`로 대답해요. `isn't`는 `is not`을 줄인 말이에요. 대답 끝의 `she is`는 줄이지 않아요.
        examples:
          - en: Is she married?
            ko: 그 사람 결혼했어요?
          - en: "Yes, she is."
            ko: "네, 했어요."
          - en: "No, she isn't."
            ko: "아니요, 안 했어요."
      - type: dialogue
        item: sense.shy.adj.timid
        lines:
          - { speaker: Ana, en: "Is @Leo shy?", ko: "레오는 낯을 가려요?" }
        question: 레오는 낯을 가리지 않아요. 알맞은 대답을 골라요.
        options:
          - { en: "No, he isn't.", correct: true }
          - { en: "No, she isn't.", why: "레오는 남자라서 `he`로 가리켜요." }
          - { en: "No, he is.", why: "아니라고 할 때는 `is` 뒤에 `not`이 붙어서 `No, he isn't`가 돼요." }
      - type: fillBlank
        item: sense.not.adv.negative
        en: "Is she married? No, she ___."
        ko: "그 사람 결혼했어요? 아니요, 안 했어요."
        options:
          - { en: "isn't", correct: true }
          - { en: "aren't", why: "`are`는 `you`와 짝이에요. `she`에는 `is`를 써서 `isn't`예요." }
          - { en: not, why: "`is`가 빠졌어요. `she is not`을 줄이면 `she isn't`예요." }
      - type: chooseEnglish
        ko: 제 이웃은 낯을 가려요.
        item: sense.neighbor.n.next-door
        options:
          - { en: My neighbor is shy., correct: true }
          - { en: My boss is shy., why: "`boss`는 직장 상사예요. 이웃은 `neighbor`예요." }
          - { en: My neighbor is funny., why: "`funny`는 웃기다는 말이에요. 낯을 가린다는 `shy`예요." }
      - type: arrange
        item: sense.who.pron.question
        ko: 저 사람은 누구예요?
        en: Who is he?
        extra: [Where]
      - type: spell
        sense: sense.neighbor.n.next-door
      - type: shadow
        en: "Who is he? He's my neighbor."
        ko: "저 사람은 누구예요? 제 이웃이에요."
  - id: lesson.a1-04.4
    title: { ko: we와 they, en: we and they }
    goal: { ko: 우리와 다른 사람들에 대해 말할 수 있어요, en: Talk about us and other people }
    introduces: [sense.we.pron.us, sense.they.pron.them, sense.same.adj.not-different, sense.different.adj.not-same, sense.class.n.group]
    steps:
      - type: listen
        en: "@Jun and I are from @Busan. We're from the same city."
        ko: "준이랑 저는 부산에서 왔어요. 같은 도시 출신이에요."
      - type: listen
        en: "@Ana and @Diego are in my class. They're from Brazil."
        ko: "아나와 디에고는 저랑 같은 반이에요. 브라질에서 왔어요."
      - type: explain
        text: |
          나를 넣어 여럿을 말할 때는 `we`를 써요. `Jun and I`를 한 단어로 하면 `we`예요. 나도 상대도 아닌 여럿은 사람이든 물건이든 `they`예요. `we`와 `they`는 `are`와 짝이고 `We're`, `They're`로 줄여요.
        examples:
          - en: We're from Korea.
            ko: 저희는 한국에서 왔어요.
          - en: They're from Brazil.
            ko: 그 사람들은 브라질에서 왔어요.
          - en: "The bag and the box? They're in the room."
            ko: "가방이랑 상자요? 방에 있어요."
      - type: listenChoose
        en: They're from Mexico.
        item: sense.they.pron.them
        options:
          - { ko: 그 사람들은 멕시코에서 왔어요., correct: true }
          - { ko: 우리는 멕시코에서 왔어요., why: "\"우리\"는 `we`예요. 들린 말은 혀끝을 이 사이에 두고 시작하는 `they`예요." }
          - { ko: 그 사람은 멕시코에서 왔어요., why: "한 사람이면 `He's`나 `She's`예요. 들린 말은 여럿을 가리키는 `They're`예요." }
      - type: fillBlank
        item: sense.we.pron.us
        en: "@Mina and I are in the same class. ___ are from @Seoul."
        ko: "미나와 저는 같은 반이에요. 저희는 서울에서 왔어요."
        options:
          - { en: We, correct: true }
          - { en: They, why: "나를 넣어 말하면 `we`예요. `they`는 나를 뺀 다른 사람들이에요." }
          - { en: I, why: "미나와 나, 두 사람이라서 `we`예요." }
      - type: explain
        text: |
          `same`은 "같은", `different`는 "다른"이에요. "같은 반이에요"는 `We're in the same class`예요. `the same class`, `a different class`처럼 앞에 붙는 말이 달라요.

          `you`는 한 사람에게도, 여러 사람에게도 써요. `Are you in the same class?`는 "두 사람은 같은 반이에요?"예요.
        examples:
          - en: We're in the same class.
            ko: 우리는 같은 반이에요.
          - en: "@Chloe is in a different class."
            ko: 클로이는 다른 반이에요.
          - en: Are you in the same class?
            ko: 두 사람은 같은 반이에요?
      - type: chooseMeaning
        en: They're in the same class.
        item: sense.same.adj.not-different
        options:
          - { ko: 그 사람들은 같은 반이에요., correct: true }
          - { ko: 우리는 같은 반이에요., why: "\"우리\"는 `we`예요. `they`는 나를 뺀 다른 사람들이에요." }
          - { ko: 그 사람들은 다른 반이에요., why: "다른 반은 `a different class`예요. `same`은 \"같은\"이에요." }
      - type: chooseEnglish
        ko: 클로이는 다른 반이에요.
        item: sense.different.adj.not-same
        options:
          - { en: "@Chloe is in a different class.", correct: true }
          - { en: "@Chloe is in the same class.", why: "`same`은 \"같은\"이에요. \"다른\"은 `different`예요." }
          - { en: "@Chloe is in different class.", why: "반 하나를 말할 때는 `a`를 붙여서 `a different class`라고 해요." }
      - type: dialogue
        item: sense.we.pron.us
        lines:
          - { speaker: Omar, en: "Are you in the same class?", ko: "두 사람은 같은 반이에요?" }
        question: 준과 린은 같은 반이에요. 준이 할 말을 골라요.
        options:
          - { en: "Yes, we are.", correct: true }
          - { en: "Yes, they are.", why: "준도 그 반이에요. 나를 넣어 말할 때는 `we`예요." }
          - { en: "Yes, we're.", why: "대답 끝에 오는 `we are`는 줄이지 않아요." }
      - type: readPassage
        sentences:
          - en: "Hi, everyone. I'm @Hana."
            ko: "다들 안녕하세요. 하나예요."
          - en: "This is @Chloe."
            ko: "이쪽은 클로이예요."
          - en: "We're in the same class."
            ko: "저희는 같은 반이에요."
          - en: "She's Canadian. She's from @Toronto."
            ko: "클로이는 캐나다 사람이에요. 토론토에서 왔어요."
          - en: "I'm from @Seoul."
