id: unit.a1-05
title: { ko: "직업과 a, an", en: "Jobs, a and an" }
lessons:
  - id: lesson.a1-05.1
    title: { ko: 직업 말하기, en: Saying a job }
    goal: { ko: 나와 다른 사람의 직업을 말할 수 있어요, en: Say your job and other people's jobs }
    introduces: [sense.doctor.n.medical, sense.nurse.n.medical, sense.chef.n.kitchen, sense.writer.n.books, sense.developer.n.software]
    steps:
      - type: listen
        en: I'm a nurse.
        ko: 저는 간호사예요.
      - type: listen
        en: "@Ana is a doctor."
        ko: 아나 씨는 의사예요.
      - type: explain
        text: |
          직업도 `student`, `teacher`처럼 앞에 `a`를 붙여요. `I'm a nurse.`는 "저는 간호사예요"예요. `a`를 빼고 `I'm nurse.`라고 하면 틀린 문장이 돼요.

          다른 사람의 직업은 `He's a doctor.`, `She's a chef.`처럼 말해요. 물을 때는 `Is he a writer?`처럼 `is`를 앞으로 옮겨요.
        examples:
          - en: I'm a doctor.
            ko: 저는 의사예요.
          - en: He's a nurse.
            ko: 그 사람은 간호사예요.
          - en: She's a chef.
            ko: 그 사람은 요리사예요.
          - en: Is he a writer?
            ko: 그 사람은 작가예요?
          - en: I'm a developer.
            ko: 저는 개발자예요.
      - type: chooseMeaning
        en: He's a nurse.
        item: sense.nurse.n.medical
        options:
          - { ko: 그 사람은 간호사예요., correct: true }
          - { ko: 그 사람은 의사예요., why: "의사는 `doctor`예요. `nurse`는 간호사예요." }
          - { ko: 저는 간호사예요., why: "`He's`로 시작해서 다른 사람 이야기예요. 내 이야기는 `I'm`으로 시작해요." }
      - type: listenChoose
        en: I'm a developer.
        item: sense.developer.n.software
        options:
          - { ko: 저는 개발자예요., correct: true }
          - { ko: 저는 작가예요., why: "둘 다 `er`로 끝나지만 들린 단어는 `developer`, 개발자예요. 작가는 `writer`예요." }
          - { ko: 저는 의사예요., why: "의사는 `doctor`예요. 들린 단어는 `developer`예요." }
      - type: chooseEnglish
        ko: 레오는 요리사예요.
        item: sense.chef.n.kitchen
        options:
          - { en: "@Leo is a chef.", correct: true }
          - { en: "@Leo is chef.", why: "직업 앞에는 `a`를 붙여요. `a chef`예요." }
          - { en: "@Leo is a writer.", why: "`writer`는 작가예요. 요리사는 `chef`예요." }
      - type: dialogue
        item: sense.doctor.n.medical
        lines:
          - { speaker: Mina, en: Are you a doctor?, ko: 의사세요? }
        question: 오마르는 간호사예요. 오마르가 할 말을 골라요.
        options:
          - { en: "No, I'm a nurse.", correct: true }
          - { en: "Yes, I'm a nurse.", why: "의사냐는 질문이에요. 의사가 아니면 `No`로 대답해요." }
          - { en: "No, I'm nurse.", why: "`nurse` 앞에 `a`가 빠졌어요." }
      - type: dialogue
        item: sense.writer.n.books
        lines:
          - { speaker: Sam, en: "Is @Chloe a writer?", ko: 클로이 씨는 작가예요? }
        question: 클로이는 작가가 맞아요. 알맞은 대답을 골라요.
        options:
          - { en: "Yes, she is.", correct: true }
          - { en: "Yes, she's.", why: "대답 끝에 오는 `she is`는 `she's`로 줄이지 않아요." }
          - { en: "Yes, he is.", why: "클로이는 여자라서 `she`로 받아요." }
      - type: fillBlank
        item: sense.doctor.n.medical
        en: She's a ___.
        ko: 그 사람은 의사예요.
        answers: [doctor]
      - type: arrange
        item: sense.chef.n.kitchen
        ko: 그 사람은 요리사예요?
        en: Is he a chef?
        extra: [are]
      - type: spell
        sense: sense.writer.n.books
      - type: shadow
        en: "Hi, I'm @Leo. I'm a developer."
        ko: 안녕하세요, 저는 레오예요. 개발자예요.
  - id: lesson.a1-05.2
    title: { ko: a와 an, en: a and an }
    goal: { ko: 모음 소리 앞에서 an을 쓸 수 있어요, en: Use an before a vowel sound }
    introduces: [sense.an.art.one, sense.engineer.n.job, sense.artist.n.art, sense.actor.n.acting, sense.idea.n.thought]
    steps:
      - type: listen
        en: I'm an engineer.
        ko: 저는 엔지니어예요.
      - type: listen
        en: "@Diego is an actor."
        ko: 디에고 씨는 배우예요.
      - type: explain
        text: |
          `engineer`, `artist`, `actor`는 모음 소리로 시작해요. 이런 단어 앞에서는 `a` 대신 `an`을 써요. `an engineer`는 `n`이 뒤 단어에 붙어서 한 덩어리로 들려요.
        examples:
          - en: I'm an engineer.
            ko: 저는 엔지니어예요.
          - en: She's an artist.
            ko: 그 사람은 예술가예요.
          - en: He's an actor.
            ko: 그 사람은 배우예요.
      - type: chooseMeaning
        en: She's an artist.
        item: sense.artist.n.art
        options:
          - { ko: 그 사람은 예술가예요., correct: true }
          - { ko: 그 사람은 배우예요., why: "배우는 `actor`예요. `artist`는 그림이나 조각 같은 작품을 만드는 사람이에요." }
          - { ko: 그 사람은 개발자예요., why: "개발자는 `developer`예요. `artist`는 그림이나 조각 같은 작품을 만드는 사람이에요." }
      - type: fillBlank
        item: sense.an.art.one
        en: He's ___ actor.
        ko: 그 사람은 배우예요.
        options:
          - { en: an, correct: true }
          - { en: a, why: "`actor`는 모음 소리로 시작해서 `an`을 써요." }
      - type: listenChoose
        en: I'm an engineer.
        item: sense.engineer.n.job
        options:
          - { ko: 저는 엔지니어예요., correct: true }
          - { ko: 저는 개발자예요., why: "개발자는 `developer`예요. 들린 단어는 `engineer`예요." }
          - { ko: 저는 배우예요., why: "배우는 `actor`예요. 끝의 `neer`가 세게 들린 `engineer`예요." }
      - type: explain
        text: |
          `a`와 `an`은 바로 뒤 단어의 첫소리로 정해요. 그래서 `an idea`지만 `a good idea`예요. 글자만 보고 정하면 틀리는 단어가 가끔 있어요. 그래도 규칙은 같아요. 글자 말고 첫소리를 들어요.
        examples:
          - en: It's a good idea.
            ko: 좋은 생각이에요.
      - type: fillBlank
        item: sense.an.art.one
        en: It's ___ good idea.
        ko: 좋은 생각이에요.
        options:
          - { en: a, correct: true }
          - { en: an, why: "바로 뒤 단어 `good`이 자음 소리로 시작해서 `a`를 써요. `idea`가 바로 오면 `an idea`예요." }
      - type: dialogue
        item: sense.idea.n.thought
        lines:
          - { speaker: Leo, en: "I'm cold. Tea?", ko: 추워. 차 마실래? }
        question: 미나도 차를 마시고 싶어요. 미나가 할 말을 골라요.
        options:
          - { en: Good idea., correct: true }
          - { en: Good night., why: "`Good night.`은 밤에 헤어질 때 하는 말이에요. 좋은 생각이라고 할 때는 `Good idea.`예요." }
          - { en: You're welcome., why: "`You're welcome.`은 고맙다는 말에 하는 대답이에요." }
      - type: chooseEnglish
        ko: 샘은 배우예요.
        item: sense.actor.n.acting
        options:
          - { en: "@Sam is an actor.", correct: true }
          - { en: "@Sam is a actor.", why: "`actor`는 모음 소리로 시작해서 `a`가 아니라 `an`이에요." }
          - { en: "@Sam is an artist.", why: "`artist`는 예술가예요. 배우는 `actor`예요." }
      - type: arrange
        item: sense.engineer.n.job
        ko: 아나는 엔지니어예요.
        en: "@Ana is an engineer."
        extra: [a]
      - type: spell
        sense: sense.engineer.n.job
      - type: shadow
        en: "I'm an engineer. Nice to meet you."
        ko: 저는 엔지니어예요. 만나서 반가워요.
  - id: lesson.a1-05.3
    title: { ko: 무슨 일 하세요?, en: What do you do? }
    goal: { ko: 무슨 일을 하는지 묻고 대답할 수 있어요, en: Ask and say what someone does for work }
    introduces: [pattern.what-do-you-do, sense.job.n.work, sense.work.v.job, sense.hospital.n.medical, sense.school.n.education, sense.restaurant.n.food]
    steps:
      - type: listen
        en: What do you do?
        ko: 무슨 일 하세요?
      - type: listen
        en: "I'm a nurse. I work in a hospital."
        ko: 저는 간호사예요. 병원에서 일해요.
      - type: explain
        text: |
          `What do you do?`는 무슨 일을 하는지, 그러니까 직업을 묻는 말이에요. 지금 뭘 하고 있는지 묻는 말이 아니에요. 통째로 외워 두면 돼요. 대답은 `I'm a nurse.`처럼 직업을 말해요.
        examples:
          - en: What do you do?
            ko: 무슨 일 하세요?
          - en: I'm a teacher.
            ko: 저는 교사예요.
      - type: dialogue
        item: pattern.what-do-you-do
        lines:
          - { speaker: Priya, en: What do you do?, ko: 무슨 일 하세요? }
        question: 오마르는 개발자예요. 오마르가 할 말을 골라요.
        options:
          - { en: I'm a developer., correct: true }
          - { en: "I'm fine, thanks.", why: "`What do you do?`는 안부가 아니라 직업을 묻는 말이에요." }
          - { en: "I'm @Omar.", why: "이름은 `What's your name?`에 하는 대답이에요. 여기서는 직업을 말해요." }
      - type: arrange
        item: pattern.what-do-you-do
        ko: 무슨 일 하세요?
        en: What do you do?
        extra: [are]
      - type: explain
        text: |
          일하는 곳은 `I work in a hospital.`처럼 말해요. "일해요"는 `work` 한 단어로 말해요. 그래서 `I'm work`라고 하지 않아요. 우리말은 "병원에서"처럼 뒤에 붙지만 영어는 `in a hospital`처럼 `in`이 앞에 와요. 직업은 `job`이라는 명사로 `It's a good job.`처럼 써요.
        examples:
          - en: "I'm a teacher. I work in a school."
            ko: 저는 교사예요. 학교에서 일해요.
          - en: "I'm a chef. I work in a restaurant."
            ko: 저는 요리사예요. 식당에서 일해요.
          - en: It's a good job.
            ko: 좋은 직업이에요.
      - type: chooseMeaning
        en: I work in a restaurant.
        item: sense.restaurant.n.food
        options:
          - { ko: 저는 식당에서 일해요., correct: true }
          - { ko: 저는 병원에서 일해요., why: "병원은 `hospital`이에요. `restaurant`는 식당이에요." }
          - { ko: 저는 식당에 가요., why: "`work`는 \"일하다\"예요. \"가다\"는 `go`예요." }
      - type: chooseEnglish
        ko: 저는 병원에서 일해요.
        item: sense.work.v.job
        options:
          - { en: I work in a hospital., correct: true }
          - { en: I'm work in a hospital., why: "\"일해요\"는 `work` 한 단어로 말해요. `I'm`과 `work`를 같이 쓰지 않아요." }
          - { en: I'm in a hospital., why: "`I'm in a hospital.`은 지금 병원에 있다는 말이에요. 일한다는 말은 `work`예요." }
      - type: fillBlank
        item: sense.work.v.job
        en: I ___ in a restaurant.
        ko: 저는 식당에서 일해요.
        answers: [work]
      - type: fillBlank
        item: sense.job.n.work
        en: "I'm a chef. It's a good ___."
        ko: 저는 요리사예요. 좋은 직업이에요.
        options:
          - { en: job, correct: true }
          - { en: work, why: "`work`는 \"일하다\"라는 동사예요. `a` 뒤에 오는 직업 하나는 `job`이에요." }
      - type: dictation
        item: sense.hospital.n.medical
        en: I work in a hospital.
        ko: 저는 병원에서 일해요.
      - type: spell
        sense: sense.school.n.education
      - type: shadow
        en: "I'm a chef. I work in a restaurant."
        ko: 저는 요리사예요. 식당에서 일해요.
  - id: lesson.a1-05.4
    title: { ko: "쉬운 일, 힘든 일", en: "Easy job, hard job" }
    goal: { ko: 일이나 물건이 어떤지 말할 수 있어요, en: Say what a job or a thing is like }
    introduces: [sense.easy.adj.not-hard, sense.hard.adj.difficult, sense.interesting.adj.not-boring, sense.boring.adj.not-interesting, sense.old.adj.not-new]
    steps:
      - type: listen
        en: It's a hard job.
        ko: 힘든 일이에요.
      - type: listen
        en: It's an interesting job.
        ko: 재미있는 일이에요.
      - type: explain
        text: |
          `easy`는 "쉬운", `hard`는 "어려운, 힘든"이에요. `interesting`은 "재미있는"이고 반대는 `boring`(지루한)이에요. `old`는 `new`의 반대로 "오래된"이에요.

          `a`와 `an`은 바로 뒤 단어의 첫소리로 정해요. 그래서 `a job`이지만 `an easy job`이에요.
        examples:
          - en: My job is hard.
            ko: 제 일은 힘들어요.
          - en: It's an easy job.
            ko: 쉬운 일이에요.
          - en: It's an interesting book.
            ko: 재미있는 책이에요.
          - en: It's a boring job.
            ko: 지루한 일이에요.
          - en: The school is old.
            ko: 그 학교는 오래됐어요.
      - type: chooseMeaning
        en: It's an easy job.
        item: sense.easy.adj.not-hard
        options:
          - { ko: 쉬운 일이에요., correct: true }
          - { ko: 힘든 일이에요., why: "힘든 건 `hard`예요. `easy`는 쉬운 거예요." }
          - { ko: 새로운 일이에요., why: "새로운 건 `new`예요. `an easy job`은 쉬운 일이에요." }
      - type: listenChoose
        en: The hospital is old.
        item: sense.old.adj.not-new
        options:
          - { ko: 그 병원은 오래됐어요., correct: true }
          - { ko: 그 병원은 새 건물이에요., why: "들린 단어는 `old`예요. `new`의 반대라서 오래됐다는 말이에요." }
          - { ko: 그 병원은 커요., why: "큰 건 `big`이에요. 들린 단어는 `old`예요." }
      - type: chooseMeaning
        en: It's a really interesting book.
        item: sense.interesting.adj.not-boring
        options:
          - { ko: 정말 재미있는 책이에요., correct: true }
          - { ko: 정말 지루한 책이에요., why: "지루한 건 `boring`이에요. `interesting`은 그 반대예요." }
          - { ko: 정말 웃긴 책이에요., why: "웃겨서 재미있는 건 `funny`예요. `interesting`은 흥미로워서 재미있는 거예요." }
      - type: fillBlank
        item: sense.an.art.one
        en: It's ___ old book.
        ko: 오래된 책이에요.
        options:
          - { en: an, correct: true }
          - { en: a, why: "바로 뒤 `old`가 모음 소리로 시작해서 `an`을 써요." }
      - type: dialogue
        item: sense.hard.adj.difficult
        lines:
          - { speaker: Wei, en: Is English easy?, ko: 영어 쉬워요? }
        question: 하나는 영어가 어렵다고 생각해요. 하나가 할 말을 골라요.
        options:
          - { en: "No, it's hard.", correct: true }
          - { en: "Yes, it's hard.", why: "쉽냐고 물었으니 어렵다면 `No`로 대답해요." }
          - { en: "No, it's easy.", why: "`No`라고 했으니 쉽지 않다는 말이 이어져야 해요. 어려운 건 `hard`예요." }
      - type: dialogue
        item: sense.interesting.adj.not-boring
        lines:
          - { speaker: Sam, en: What do you do?, ko: 무슨 일 하세요? }
          - { speaker: Diego, en: I'm an actor., ko: 배우예요. }
        question: 샘이 할 말을 골라요.
        options:
          - { en: "Really? It's an interesting job.", correct: true }
          - { en: "Really? I'm interesting.", why: "`I'm interesting.`은 \"저는 흥미로운 사람이에요\"라는 뜻이에요. 흥미로운 건 디에고의 직업이에요." }
          - { en: "Really? It's a boring job.", why: "`boring`은 지루하다는 말이라서 처음 만난 사람의 직업에 하면 실례예요." }
      - type: arrange
        item: sense.old.adj.not-new
        ko: 이건 오래된 책이에요.
        en: This is an old book.
        extra: [a]
      - type: dictation
        item: sense.boring.adj.not-interesting
        en: It's a boring book.
        ko: 지루한 책이에요.
      - type: spell
        sense: sense.easy.adj.not-hard
      - type: shadow
        en: "It's an old book. It's really interesting."
        ko: 오래된 책이에요. 정말 재미있어요.
