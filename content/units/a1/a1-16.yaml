id: unit.a1-16
title: { ko: 시간과 요일, en: Time and days }
lessons:
  - id: lesson.a1-16.1
    title: { ko: 몇 시예요?, en: What time is it? }
    goal: { ko: 시각을 묻고 말할 수 있어요, en: Ask and tell the time }
    introduces: [pattern.what-time-is-it, sense.oclock.adv.hour, sense.now.adv.present, sense.minute.n.time, sense.early.adj.not-late]
    steps:
      - type: listen
        en: "What time is it? It's seven o'clock."
        ko: 몇 시예요? 7시예요.
      - type: listen
        en: "It's nine thirty now."
        ko: 지금 9시 반이에요.
      - type: explain
        text: |
          시각을 물을 때는 `What time is it?`이라고 해요. 대답은 `It's`로 시작해요. 정각은 `It's seven o'clock`이고, 7시 30분은 `It's seven thirty`처럼 시와 분을 이어서 말해요. `o'clock`은 정각에만 붙이고, 정각은 `It's seven`이라고만 해도 돼요.

          7시 5분처럼 분이 한 자리면 `oh`를 넣어 `seven oh five`라고 해요. `now`는 "지금"이에요. 보통 문장 끝에 와요.
        examples:
          - en: "What time is it? It's seven o'clock."
            ko: 몇 시예요? 7시예요.
          - en: "It's nine thirty now."
            ko: 지금 9시 반이에요.
          - en: "It's eight fifteen."
            ko: 8시 15분이에요.
      - type: explain
        text: |
          `early`는 "이른"이라서 `It's early`는 "아직 일러요"예요. 반대는 앞에서 배운 `late`예요. `minute`은 "분"이에요. 5분은 `five minutes`예요.
        examples:
          - en: "It's six o'clock. It's early."
            ko: 6시예요. 아직 일러요.
          - en: I have ten minutes.
            ko: 시간이 10분 있어요.
      - type: chooseMeaning
        en: "It's seven thirty."
        item: pattern.what-time-is-it
        options:
          - { ko: 7시 30분이에요., correct: true }
          - { ko: 7시예요., why: "정각이면 `seven o'clock`이에요. `thirty`가 붙었으니 30분이에요." }
          - { ko: 7시 13분이에요., why: "13은 `thirteen`이에요. `thirty`는 30이에요." }
      - type: listenChoose
        en: "It's nine o'clock now."
        item: sense.oclock.adv.hour
        options:
          - { ko: 지금 9시예요., correct: true }
          - { ko: 지금 5시예요., why: "5는 `five`예요. 들린 숫자는 `nine`이에요." }
          - { ko: 지금 9시 반이에요., why: "`o'clock`이 들렸으니 정각이에요." }
      - type: chooseEnglish
        ko: 몇 시예요?
        item: pattern.what-time-is-it
        options:
          - { en: What time is it?, correct: true }
          - { en: What time it is?, why: "물을 때는 `is`가 `it` 앞으로 와요." }
          - { en: What time is?, why: "시각을 물을 때도 `it`을 빼지 않아요. `What time is it?`이에요." }
      - type: fillBlank
        item: sense.oclock.adv.hour
        en: "It's ten ___."
        ko: 10시 정각이에요.
        options:
          - { en: "o'clock", correct: true }
          - { en: thirty, why: "`thirty`면 10시 30분이에요. 정각은 `o'clock`이에요." }
          - { en: minutes, why: "정각은 `minutes`가 아니라 `o'clock`으로 말해요." }
      - type: dialogue
        item: pattern.what-time-is-it
        lines:
          - { speaker: Sam, en: What time is it?, ko: 몇 시예요? }
        question: 지금 8시 15분이에요. 하린이 할 말을 골라요.
        options:
          - { en: "It's eight fifteen.", correct: true }
          - { en: "It's eight fifty.", why: "`fifty`는 50이에요. 15는 뒤를 세게 읽는 `fifteen`이에요." }
          - { en: "It's eight o'clock.", why: "정각이 아니라 15분이에요." }
      - type: fillBlank
        item: sense.early.adj.not-late
        en: "It's six o'clock. It's ___."
        ko: 6시예요. 아직 일러요.
        answers: [early]
      - type: arrange
        item: sense.now.adv.present
        ko: 지금 몇 시예요?
        en: What time is it now?
        extra: [are, "o'clock"]
      - type: dictation
        item: sense.minute.n.time
        en: I have ten minutes.
        ko: 시간이 10분 있어요.
      - type: spell
        sense: sense.minute.n.time
      - type: shadow
        en: "What time is it? It's seven thirty."
        ko: 몇 시예요? 7시 반이에요.
  - id: lesson.a1-16.2
    title: { ko: 7시에, en: At seven }
    goal: { ko: 무엇이 몇 시에 시작하고 끝나는지 말할 수 있어요, en: Say when things start and finish }
    introduces: [sense.at.prep.point, sense.start.v.begin, sense.finish.v.end, sense.open.v.business, sense.close.v.business]
    steps:
      - type: listen
        en: My class starts at nine.
        ko: 제 수업은 9시에 시작해요.
      - type: listen
        en: The bank opens at nine and closes at four.
        ko: 은행은 9시에 문을 열고 4시에 닫아요.
      - type: explain
        text: |
          시각 앞에는 `at`을 써요. `at seven`은 "7시에"예요. 보통 `The store opens at ten`처럼 문장 끝에 와요.

          수업이나 회의가 시작하는 건 `start`, 끝나는 건 `finish`예요. 가게나 은행이 문을 여는 건 `open`, 닫는 건 `close`예요. 주어가 `my class`, `the bank`처럼 하나면 `starts`, `opens`처럼 끝에 `-s`가 붙어요.
        examples:
          - en: "[My class]{who} [starts]{do} [at nine]{when}."
            ko: 제 수업은 9시에 시작해요.
            literal: 내 수업은 / 시작한다 / 9시에
          - en: The bank opens at nine and closes at four.
            ko: 은행은 9시에 문을 열고 4시에 닫아요.
          - en: The meeting finishes at three.
            ko: 회의는 3시에 끝나요.
      - type: chooseMeaning
        en: The bank closes at four.
        item: sense.close.v.business
        options:
          - { ko: 은행은 4시에 문을 닫아요., correct: true }
          - { ko: 은행은 4시에 문을 열어요., why: "여는 건 `opens`예요. `closes`는 닫는 거예요." }
          - { ko: 가게는 4시에 문을 닫아요., why: "가게는 `store`예요. `bank`는 은행이에요." }
      - type: listenChoose
        en: My class starts at nine.
        item: sense.start.v.begin
        options:
          - { ko: 제 수업은 9시에 시작해요., correct: true }
          - { ko: 제 수업은 9시에 끝나요., why: "끝나는 건 `finishes`예요. 들린 단어는 `starts`예요." }
          - { ko: 제 수업은 5시에 시작해요., why: "5는 `five`예요. 들린 숫자는 `nine`이에요." }
      - type: chooseEnglish
        ko: 회의는 3시에 끝나요.
        item: sense.at.prep.point
        options:
          - { en: The meeting finishes at three., correct: true }
          - { en: The meeting finishes in three., why: "시각 앞에는 `at`을 써요." }
          - { en: The meeting finish at three., why: "회의는 `it`으로 바꿀 수 있어서 `finishes`예요." }
      - type: fillBlank
        item: sense.at.prep.point
        en: The store opens ___ ten.
        ko: 가게는 10시에 문을 열어요.
        options:
          - { en: at, correct: true }
          - { en: in, why: "`in`은 `in the morning`처럼 아침, 오후 앞에 써요. 시각 앞에는 `at`이에요." }
          - { en: to, why: "`to`는 \"~로\"처럼 가는 쪽을 말해요. 시각 앞에는 `at`이에요." }
      - type: dialogue
        item: sense.open.v.business
        lines:
          - { speaker: Mina, en: What time does the bank open?, ko: 은행은 몇 시에 문을 열어요? }
        question: 은행은 9시에 문을 열어요. 준이 할 말을 골라요.
        options:
          - { en: It opens at nine., correct: true }
          - { en: It open at nine., why: "`it` 뒤라서 `opens`예요." }
          - { en: It opens nine., why: "시각 앞에는 `at`을 붙여요." }
      - type: fillBlank
        item: sense.start.v.begin
        en: Class ___ at nine.
        ko: 수업은 9시에 시작해요.
        answers: [starts]
      - type: arrange
        item: sense.close.v.business
        ko: 은행은 4시에 문을 닫아요.
        en: The bank closes at four.
        extra: [close, in]
      - type: dictation
        item: sense.open.v.business
        en: The store opens at ten and closes at nine.
        ko: 가게는 10시에 문을 열고 9시에 닫아요.
      - type: spell
        sense: sense.finish.v.end
      - type: shadow
        en: My class starts at nine and finishes at twelve.
        ko: 제 수업은 9시에 시작해서 12시에 끝나요.
  - id: lesson.a1-16.3
    title: { ko: 월요일부터 금요일까지, en: Monday to Friday }
    goal: { ko: 무슨 요일에 무엇이 있는지 말할 수 있어요, en: Say what happens on which day }
    introduces: [sense.monday.n.day, sense.tuesday.n.day, sense.wednesday.n.day, sense.thursday.n.day, sense.friday.n.day, sense.on.prep.day]
    steps:
      - type: listen
        en: I have a test on Friday.
        ko: 금요일에 시험이 있어요.
      - type: listen
        en: "Monday, Tuesday, Wednesday, Thursday, Friday."
        ko: 월요일, 화요일, 수요일, 목요일, 금요일.
      - type: explain
        text: |
          요일은 늘 대문자로 시작해요. 요일 앞에는 `on`을 써서 `on Monday`는 "월요일에"예요. 시각 앞은 `at`, 요일 앞은 `on`이에요.

          `Tuesday`와 `Thursday`가 헷갈리기 쉬워요. 가운데 소리가 달라서 `Tuesday`는 "투즈데이", `Thursday`는 혀를 말아서 내는 "써즈데이"에 가까워요. `Wednesday`는 앞쪽 `d`를 소리 내지 않아서 "웬즈데이"에 가까워요.
        examples:
          - en: "[I]{who} [have]{do} [a test]{what} [on Friday]{when}."
            ko: 금요일에 시험이 있어요.
            literal: 나는 / 가지고 있다 / 시험을 / 금요일에
          - en: "We don't have class on Wednesday."
            ko: 우리는 수요일에 수업이 없어요.
          - en: The meeting is on Thursday.
            ko: 회의는 목요일이에요.
      - type: chooseMeaning
        en: "We don't have class on Wednesday."
        item: sense.wednesday.n.day
        options:
          - { ko: 우리는 수요일에 수업이 없어요., correct: true }
          - { ko: 우리는 월요일에 수업이 없어요., why: "월요일은 `Monday`예요. `Wednesday`는 수요일이에요." }
          - { ko: 우리는 수요일에 수업이 있어요., why: "`don't`가 있으니 수업이 없다는 말이에요." }
      - type: minimalPair
        item: sense.tuesday.n.day
        words: [Tuesday, Thursday]
        answer: Tuesday
        why: "가운데 소리를 들어 봐요. `Tuesday`는 \"투\"를 길게 내고(영국식은 \"튜\"), `Thursday`는 혀끝을 이 사이에 댄 뒤 혀를 말아 \"써\"처럼 내요."
      - type: listenChoose
        en: The meeting is on Thursday.
        item: sense.thursday.n.day
        options:
          - { en: The meeting is on Thursday., correct: true }
          - { en: The meeting is on Tuesday., why: "첫소리가 `th`였어요. `Thursday`예요." }
          - { en: The meeting is on Friday., why: "`Friday`가 아니라 `Thursday`가 들렸어요." }
      - type: chooseEnglish
        ko: 월요일에 회의가 있어요.
        item: sense.on.prep.day
        options:
          - { en: I have a meeting on Monday., correct: true }
          - { en: I have a meeting at Monday., why: "`at`은 시각 앞에 써요. 요일 앞에는 `on`이에요." }
          - { en: I have a meeting in Monday., why: "요일 앞에는 `on`을 써요." }
      - type: fillBlank
        item: sense.on.prep.day
        en: We have a test ___ Tuesday.
        ko: 우리는 화요일에 시험이 있어요.
        options:
          - { en: "on", correct: true }
          - { en: at, why: "`at`은 시각 앞에 써요. 요일 앞에는 `on`이에요." }
          - { en: in, why: "요일 앞에는 `in`이 아니라 `on`이에요." }
      - type: dialogue
        item: pattern.short-answer-do
        lines:
          - { speaker: Ana, en: Do you have class on Friday?, ko: 금요일에 수업 있어요? }
        question: 준은 금요일에 수업이 없어요. 준이 할 말을 골라요.
        options:
          - { en: "No, I don't.", correct: true }
          - { en: "No, I'm not.", why: "`Do`로 물었으니 `don't`로 대답해요." }
          - { en: "Yes, I do.", why: "수업이 없으니 `No`로 대답해요." }
      - type: fillBlank
        item: sense.friday.n.day
        en: I have a test on ___.
        ko: 금요일에 시험이 있어요.
        answers: [Friday]
      - type: arrange
        item: sense.tuesday.n.day
        ko: 화요일에 영어 수업이 있어요.
        en: We have English class on Tuesday.
        extra: [at, Thursday]
      - type: dictation
        item: sense.monday.n.day
        en: The meeting is on Monday.
        ko: 회의는 월요일이에요.
      - type: spell
        sense: sense.wednesday.n.day
      - type: shadow
        en: "Monday, Tuesday, Wednesday, Thursday, Friday."
        ko: 월요일, 화요일, 수요일, 목요일, 금요일.
  - id: lesson.a1-16.4
    title: { ko: 주말, en: The weekend }
    goal: { ko: 오늘이 무슨 요일인지 묻고 주말에 하는 일을 말할 수 있어요, en: Ask what day it is and talk about the weekend }
    introduces: [sense.saturday.n.day, sense.sunday.n.day, sense.weekend.n.days, sense.week.n.days, pattern.what-day-is-it, sense.every.det.each]
    steps:
      - type: listen
        en: "What day is it today? It's Saturday."
        ko: 오늘 무슨 요일이에요? 토요일이에요.
      - type: listen
        en: "I don't work on the weekend."
        ko: 저는 주말에는 일 안 해요.
      - type: explain
        text: |
          `What day is it today?`는 "오늘 무슨 요일이에요?"예요. `It's Saturday`처럼 `on` 없이 대답해요. 토요일과 일요일은 `the weekend`, 주말이에요. 미국에서는 `on the weekend`라고 하고, 영국에서는 `at the weekend`도 많이 써요.

          `week`는 "주, 일주일"이에요. `every Sunday`는 "일요일마다", `every week`는 "매주"예요. `every`가 오면 보통 `on`을 붙이지 않아요.
        examples:
          - en: "What day is it today? It's Saturday."
            ko: 오늘 무슨 요일이에요? 토요일이에요.
          - en: "[I]{who} [don't work]{do} [on the weekend]{when}."
            ko: 저는 주말에는 일 안 해요.
            literal: 나는 / 일하지 않는다 / 주말에
          - en: We play soccer every Sunday.
            ko: 우리는 일요일마다 축구를 해요.
          - en: I call my mom every week.
            ko: 저는 매주 엄마한테 전화해요.
      - type: chooseMeaning
        en: "I don't work on the weekend."
        item: sense.weekend.n.days
        options:
          - { ko: 저는 주말에는 일 안 해요., correct: true }
          - { ko: 저는 주말에 일해요., why: "`don't`가 있으니 일을 안 한다는 말이에요." }
          - { ko: 저는 월요일에는 일 안 해요., why: "월요일은 `Monday`예요. `weekend`는 토요일과 일요일이에요." }
      - type: listenChoose
        en: What day is it today?
        item: pattern.what-day-is-it
        options:
          - { ko: 오늘 무슨 요일이에요?, correct: true }
          - { ko: 지금 몇 시예요?, why: "시각은 `What time is it?`으로 물어요. 들린 단어는 `day`예요." }
          - { ko: 오늘 며칠이에요?, why: "`day`는 요일을 물어요. 날짜는 다르게 물어요." }
      - type: chooseEnglish
        ko: 우리는 일요일마다 축구를 해요.
        item: sense.sunday.n.day
        options:
          - { en: We play soccer every Sunday., correct: true }
          - { en: We play soccer on every Sunday., why: "`every`가 오면 보통 `on`을 붙이지 않아요." }
          - { en: We play soccer every Monday., why: "월요일은 `Monday`예요. 일요일은 `Sunday`예요." }
      - type: fillBlank
        item: sense.weekend.n.days
        en: "I don't work ___ the weekend."
        ko: 저는 주말에는 일 안 해요.
        options:
          - { en: "on", correct: true }
          - { en: in, why: "주말 앞에는 `in`을 쓰지 않아요. 미국에서는 `on the weekend`예요." }
          - { en: to, why: "`to`는 가는 쪽을 말해요. 주말 앞에는 `on`이에요." }
      - type: dialogue
        item: sense.saturday.n.day
        lines:
          - { speaker: Mina, en: What day is it today?, ko: 오늘 무슨 요일이에요? }
        question: 오늘은 토요일이에요. 레오가 할 말을 골라요.
        options:
          - { en: "It's Saturday.", correct: true }
          - { en: "It's on Saturday.", why: "무슨 요일인지 말할 때는 `on`을 붙이지 않아요." }
          - { en: "It's seven o'clock.", why: "시각이 아니라 요일을 물었어요." }
      - type: fillBlank
        item: pattern.what-day-is-it
        en: What ___ is it today?
        ko: 오늘 무슨 요일이에요?
        answers: [day]
      - type: arrange
        item: sense.weekend.n.days
        ko: 저는 주말에는 일 안 해요.
        en: "I don't work on the weekend."
        extra: [in, works]
      - type: dictation
        item: sense.week.n.days
        en: I call my mom every week.
        ko: 저는 매주 엄마한테 전화해요.
      - type: spell
        sense: sense.saturday.n.day
      - type: shadow
        en: "What day is it today? It's Saturday."
        ko: 오늘 무슨 요일이에요? 토요일이에요.
