id: unit.a1-09
title: { ko: 가족, en: Family }
lessons:
  - id: lesson.a1-09.1
    title: { ko: "엄마, 아빠", en: "Mom and dad" }
    goal: { ko: 사진을 보며 부모님을 소개할 수 있어요, en: Introduce your parents in a photo }
    introduces: [sense.family.n.relatives, sense.mother.n.parent, sense.father.n.parent, sense.mom.n.parent, sense.dad.n.parent, sense.parent.n.mother-father]
    steps:
      - type: listen
        en: "This is my family."
        ko: 우리 가족이에요.
      - type: listen
        en: "That's my mom, and this is my dad."
        ko: 저분이 우리 엄마고, 이분이 우리 아빠예요.
      - type: explain
        text: |
          `mother`와 `father`는 "어머니, 아버지", `mom`과 `dad`는 "엄마, 아빠"예요. 영어는 어른도 말할 때 `mom`, `dad`를 많이 쓰고, 글이나 격식 있는 자리에서는 `mother`, `father`를 써요.

          두 분을 같이 말할 때는 `parents`예요. "우리 엄마"는 보통 `my mom`이에요. 형제자매가 같이 말할 때만 `our mom`이라고 해요.
        examples:
          - en: "[This]{who} [is]{do} [my family]{what}."
            ko: 우리 가족이에요.
            literal: 이것은 / ~이다 / 내 가족
          - en: My mom is a teacher.
            ko: 우리 엄마는 선생님이에요.
          - en: "My dad's name is @Minsu."
            ko: 우리 아빠 이름은 민수예요.
          - en: My parents are from @Busan.
            ko: 우리 부모님은 부산 분이에요.
          - en: Her father is a nurse.
            ko: 그 친구 아버지는 간호사예요.
      - type: chooseMeaning
        en: My parents are from @Busan.
        item: sense.parent.n.mother-father
        options:
          - { ko: 우리 부모님은 부산 분이에요., correct: true }
          - { ko: 우리 엄마는 부산 분이에요., why: "엄마는 `mom`이에요. `parents`는 엄마와 아빠 두 분이에요." }
          - { ko: 우리 가족은 부산에 있어요., why: "가족은 `family`예요. `from`은 \"~에서 왔다\"예요." }
      - type: listenChoose
        en: My dad is a chef.
        item: sense.dad.n.parent
        options:
          - { ko: 우리 아빠는 요리사예요., correct: true }
          - { ko: 우리 엄마는 요리사예요., why: "엄마는 `mom`이에요. 들린 단어는 `dad`예요." }
          - { ko: 우리 아빠는 작가예요., why: "작가는 `writer`예요. 들린 단어는 `chef`예요." }
      - type: chooseEnglish
        ko: 우리 엄마는 의사예요.
        item: sense.mom.n.parent
        options:
          - { en: My mom is a doctor., correct: true }
          - { en: My dad is a doctor., why: "`dad`는 아빠예요. 엄마는 `mom`이에요." }
          - { en: My mom is doctor., why: "직업 앞에는 `a`를 붙여요." }
      - type: fillBlank
        item: sense.father.n.parent
        en: Her ___ is a nurse.
        ko: 그 친구 아버지는 간호사예요.
        options:
          - { en: father, correct: true }
          - { en: mother, why: "`mother`는 어머니예요. 아버지는 `father`예요." }
          - { en: parents, why: "`parents`는 두 분이라서 `is`가 아니라 `are`가 와요. 그리고 아버지 한 분이에요." }
      - type: dialogue
        item: sense.mother.n.parent
        lines:
          - { speaker: Sam, en: "Who's this?", ko: 이분은 누구예요? }
        question: 샘이 가리킨 사람은 하린의 어머니예요. 하린이 할 말을 골라요.
        options:
          - { en: "That's my mother.", correct: true }
          - { en: "That's my father.", why: "`father`는 아버지예요. 어머니는 `mother`예요." }
          - { en: "That's my parents.", why: "`parents`는 두 분이에요. 한 분이면 `mother`나 `mom`이에요." }
      - type: fillBlank
        item: sense.family.n.relatives
        en: This is my ___.
        ko: 우리 가족이에요.
        answers: [family]
      - type: arrange
        item: sense.parent.n.mother-father
        ko: 우리 부모님은 선생님이에요.
        en: My parents are teachers.
        extra: [is, teacher]
      - type: dictation
        item: sense.mom.n.parent
        en: My mom and dad are from Japan.
        ko: 우리 엄마랑 아빠는 일본 분이에요.
      - type: spell
        sense: sense.family.n.relatives
      - type: shadow
        en: "This is my family. That's my mom, and this is my dad."
        ko: 우리 가족이에요. 저분이 우리 엄마고, 이분이 우리 아빠예요.
  - id: lesson.a1-09.2
    title: { ko: 형제와 자매, en: Brothers and sisters }
    goal: { ko: 형제자매를 소개할 수 있어요, en: Talk about your brothers and sisters }
    introduces: [sense.brother.n.sibling, sense.sister.n.sibling, sense.little.adj.young, sense.only.adj.single, sense.twin.n.sibling]
    steps:
      - type: listen
        en: This is my sister.
        ko: 이쪽은 제 언니예요.
      - type: listen
        en: "He's my little brother."
        ko: 제 남동생이에요.
      - type: explain
        text: |
          영어는 형, 오빠, 남동생이 모두 `brother`, 언니, 누나, 여동생이 모두 `sister`예요. 말하는 사람이 남자든 여자든 같고, 나이도 보통 말하지 않아요.

          꼭 말하고 싶으면 손위는 `big sister`, 손아래는 `little brother`처럼 앞에 붙여요. 말할 때 편하게 쓰는 표현이에요.
        examples:
          - en: "[She]{who} [is]{do} [my sister]{what}."
            ko: 제 언니예요.
            literal: 그녀는 / ~이다 / 내 언니
          - en: "He's my big brother."
            ko: 우리 형이에요.
          - en: "She's my little sister."
            ko: 제 여동생이에요.
          - en: "They're twins."
            ko: 그 둘은 쌍둥이예요.
      - type: explain
        text: |
          형제자매가 없으면 `I'm an only child`라고 해요. `only`는 "하나뿐인"이에요.
        examples:
          - en: "I'm an only child."
            ko: 저는 외동이에요.
      - type: chooseMeaning
        en: "She's my little sister."
        item: sense.little.adj.young
        options:
          - { ko: 제 여동생이에요., correct: true }
          - { ko: 제 언니예요., why: "`little`이 붙어서 손아래예요. 언니라면 `big sister`예요." }
          - { ko: 제 남동생이에요., why: "`sister`는 여자 형제예요. 남동생은 `little brother`예요." }
      - type: listenChoose
        en: "He's my brother."
        item: sense.brother.n.sibling
        options:
          - { ko: 우리 오빠예요., correct: true }
          - { ko: 우리 언니예요., why: "언니는 `sister`예요. 들린 단어는 `brother`예요." }
          - { ko: 우리 아빠예요., why: "아빠는 `dad`예요. 들린 단어는 `brother`예요." }
      - type: chooseEnglish
        ko: 저는 외동이에요.
        item: sense.only.adj.single
        options:
          - { en: "I'm an only child.", correct: true }
          - { en: "I'm a only child.", why: "`only`가 모음 소리로 시작해서 `an`을 써요." }
          - { en: "I'm only a child.", why: "이 말은 \"저는 그냥 아이일 뿐이에요\"예요. 외동은 `an only child`예요." }
      - type: fillBlank
        item: sense.my.det.mine
        en: "I'm an only child. ___ dad is a nurse."
        ko: 저는 외동이에요. 우리 아빠는 간호사예요.
        options:
          - { en: My, correct: true }
          - { en: Our, why: "외동이라 아빠를 같이 부를 형제가 없어요. 그래서 `my`예요." }
          - { en: Me, why: "`me`는 명사 앞에 쓰지 않아요. \"나의\"는 `my`예요." }
      - type: dialogue
        item: sense.twin.n.sibling
        lines:
          - { speaker: Priya, en: Are they brothers?, ko: 저 둘은 형제예요? }
        question: 그 둘은 같은 날 태어난 형제예요. 레오가 할 말을 골라요.
        options:
          - { en: "Yes, they're twins.", correct: true }
          - { en: "Yes, they're twin.", why: "두 사람이니까 `twins`예요." }
          - { en: "No, they're twins.", why: "쌍둥이도 형제예요. `Yes`로 대답해요." }
      - type: fillBlank
        item: sense.brother.n.sibling
        en: "He's my little ___."
        ko: 제 남동생이에요.
        answers: [brother]
      - type: arrange
        item: sense.sister.n.sibling
        ko: 우리 언니는 의사예요.
        en: My big sister is a doctor.
        extra: [little, brother]
      - type: dictation
        item: sense.twin.n.sibling
        en: My sisters are twins.
        ko: 제 여동생들은 쌍둥이예요.
      - type: spell
        sense: sense.sister.n.sibling
      - type: shadow
        en: "This is my big brother, and this is my little sister."
        ko: 이쪽은 우리 형이고, 이쪽은 우리 여동생이에요.
  - id: lesson.a1-09.3
    title: { ko: "남편, 아내, 아이", en: "Husband, wife and kids" }
    goal: { ko: 배우자와 자녀를 소개할 수 있어요, en: Introduce your partner and children }
    introduces: [sense.husband.n.spouse, sense.wife.n.spouse, sense.son.n.child, sense.daughter.n.child, sense.cute.adj.sweet]
    steps:
      - type: listen
        en: "This is my wife, @Sora."
        ko: 제 아내 소라예요.
      - type: listen
        en: "Our son is a student, and our daughter is a baby."
        ko: 아들은 학생이고 딸은 아기예요.
      - type: explain
        text: |
          배우자는 `husband`(남편)와 `wife`(아내)예요. 아이는 `son`(아들)과 `daughter`(딸)예요. 아이가 둘 이상이면 `kids`라고 해요.

          여기서는 함께 키우는 아이라서 `our`가 자연스러워요. `son`은 `sun`(해)과 소리가 같아요.
        examples:
          - en: "[This]{who} [is]{do} [my husband]{what}."
            ko: 제 남편이에요.
            literal: 이 사람은 / ~이다 / 내 남편
          - en: Our daughter is a student.
            ko: 우리 딸은 학생이에요.
          - en: "@Mina's son is very cute."
            ko: 미나 씨 아들은 정말 귀여워요.
          - en: Are you married?
            ko: 결혼하셨어요?
      - type: chooseMeaning
        en: Our daughter is a student.
        item: sense.daughter.n.child
        options:
          - { ko: 우리 딸은 학생이에요., correct: true }
          - { ko: 우리 아들은 학생이에요., why: "아들은 `son`이에요. `daughter`는 딸이에요." }
          - { ko: 제 아내는 학생이에요., why: "아내는 `wife`예요. `daughter`는 딸이에요." }
      - type: listenChoose
        en: "This is my husband."
        item: sense.husband.n.spouse
        options:
          - { ko: 제 남편이에요., correct: true }
          - { ko: 제 아내예요., why: "아내는 `wife`예요. 들린 단어는 `husband`예요." }
          - { ko: 제 아들이에요., why: "아들은 `son`이에요. 들린 단어는 `husband`예요." }
      - type: chooseEnglish
        ko: 미나 씨 아들은 정말 귀여워요.
        item: sense.cute.adj.sweet
        options:
          - { en: "@Mina's son is very cute.", correct: true }
          - { en: "@Mina's daughter is very cute.", why: "`daughter`는 딸이에요. 아들은 `son`이에요." }
          - { en: "@Mina son is very cute.", why: "\"미나의\"는 이름 뒤에 `'s`를 붙여요." }
      - type: fillBlank
        item: sense.wife.n.spouse
        en: "This is my ___, @Sora."
        ko: 제 아내 소라예요.
        options:
          - { en: wife, correct: true }
          - { en: husband, why: "`husband`는 남편이에요. 아내는 `wife`예요." }
          - { en: daughter, why: "`daughter`는 딸이에요. 아내는 `wife`예요." }
      - type: dialogue
        item: sense.son.n.child
        lines:
          - { speaker: Ana, en: "Wow, cute. Is this your son?", ko: "와, 귀엽다. 아드님이에요?" }
        question: 사진 속 아이는 오마르의 딸이에요. 오마르가 할 말을 골라요.
        options:
          - { en: "No, she's my daughter.", correct: true }
          - { en: "No, he's my daughter.", why: "딸은 여자라서 `she`로 받아요." }
          - { en: "Yes, she's my daughter.", why: "아들이냐고 물었는데 딸이니까 `No`로 대답해요." }
      - type: fillBlank
        item: sense.husband.n.spouse
        en: "My ___ is a writer."
        ko: 제 남편은 작가예요.
        answers: [husband]
      - type: arrange
        item: sense.son.n.child
        ko: 우리 아들은 키가 아주 커요.
        en: Our son is very tall.
        extra: [are, daughter]
      - type: dictation
        item: sense.daughter.n.child
        en: Their daughters are very cute.
        ko: 그 집 딸들은 정말 귀여워요.
      - type: spell
        sense: sense.daughter.n.child
      - type: shadow
        en: "This is my wife, and these are our kids."
        ko: 이쪽은 제 아내고, 얘네가 우리 아이들이에요.
  - id: lesson.a1-09.4
    title: { ko: "할머니, 이모, 사촌", en: "Grandparents, aunts and cousins" }
    goal: { ko: 친척을 소개할 수 있어요, en: Introduce your relatives }
    introduces: [sense.grandmother.n.relative, sense.grandfather.n.relative, sense.aunt.n.relative, sense.uncle.n.relative, sense.cousin.n.relative]
    steps:
      - type: listen
        en: "This is my grandmother."
        ko: 우리 할머니예요.
      - type: listen
        en: "My aunt and uncle are in Canada."
        ko: 삼촌이랑 숙모는 캐나다에 계세요.
      - type: explain
        text: |
          할머니와 할아버지는 `grandmother`, `grandfather`예요. 말할 때는 `grandma`, `grandpa`라고도 해요. 우리말은 친할머니와 외할머니를 나누지만 영어는 다 `grandmother`예요.

          고모, 이모, 숙모는 모두 `aunt`, 삼촌, 외삼촌, 고모부, 이모부는 모두 `uncle`이에요. 사촌, 외사촌, 이종사촌도 나이나 성별과 상관없이 모두 `cousin`이에요.
        examples:
          - en: "[My grandfather]{who} [is]{do} [very kind]{what}."
            ko: 우리 할아버지는 정말 다정하세요.
            literal: 내 할아버지는 / ~이다 / 아주 다정한
          - en: My aunt is a doctor.
            ko: 우리 이모는 의사예요.
          - en: "He's my uncle."
            ko: 우리 삼촌이에요.
          - en: "@Jun is my cousin."
            ko: 준은 제 사촌이에요.
      - type: chooseMeaning
        en: My aunt is a doctor.
        item: sense.aunt.n.relative
        options:
          - { ko: 우리 이모는 의사예요., correct: true }
          - { ko: 우리 삼촌은 의사예요., why: "삼촌은 `uncle`이에요. `aunt`는 이모, 고모, 숙모예요." }
          - { ko: 우리 할머니는 의사예요., why: "할머니는 `grandmother`예요." }
      - type: listenChoose
        en: "@Jun is my cousin."
        item: sense.cousin.n.relative
        options:
          - { ko: 준은 제 사촌이에요., correct: true }
          - { ko: 준은 제 삼촌이에요., why: "삼촌은 `uncle`이에요. 들린 단어는 `cousin`이에요." }
          - { ko: 준은 제 남동생이에요., why: "남동생은 `little brother`예요. 들린 단어는 `cousin`이에요." }
      - type: chooseEnglish
        ko: 우리 외할아버지는 일본 분이에요.
        item: sense.grandfather.n.relative
        options:
          - { en: "My grandfather is {Japanese|sense.japanese.adj.nationality}.", correct: true }
          - { en: "My grandmother is {Japanese|sense.japanese.adj.nationality}.", why: "`grandmother`는 할머니예요. 할아버지는 `grandfather`예요." }
          - { en: "My uncle is {Japanese|sense.japanese.adj.nationality}.", why: "`uncle`은 삼촌이에요. 외할아버지도 영어로는 `grandfather`예요." }
      - type: fillBlank
        item: sense.uncle.n.relative
        en: "He's my ___."
        ko: 우리 외삼촌이에요.
        options:
          - { en: uncle, correct: true }
          - { en: aunt, why: "`aunt`는 이모, 고모예요. 외삼촌은 `uncle`이에요." }
          - { en: cousin, why: "`cousin`은 사촌이에요. 외삼촌은 `uncle`이에요." }
      - type: dialogue
        item: sense.grandmother.n.relative
        lines:
          - { speaker: Diego, en: "Who's that?", ko: 저분은 누구예요? }
        question: 사진 속 분은 미나의 외할머니예요. 미나가 할 말을 골라요.
        options:
          - { en: "That's my grandmother.", correct: true }
          - { en: "That's my aunt.", why: "`aunt`는 이모, 고모예요. 외할머니는 `grandmother`예요." }
          - { en: "That's my mother.", why: "`mother`는 어머니예요. 할머니는 `grandmother`예요." }
      - type: fillBlank
        item: sense.cousin.n.relative
        en: "My ___ are from Canada."
        ko: 제 사촌들은 캐나다에서 왔어요.
        answers: [cousins]
      - type: arrange
        item: sense.aunt.n.relative
        ko: 우리 고모는 아주 재미있어요.
        en: My aunt is very funny.
        extra: [uncle, are]
      - type: dictation
        item: sense.grandmother.n.relative
        en: My grandmother is very kind.
        ko: 우리 할머니는 정말 다정하세요.
      - type: spell
        sense: sense.cousin.n.relative
      - type: shadow
        en: "This is my aunt, and these are my cousins."
        ko: 이분은 우리 이모고, 이쪽은 제 사촌들이에요.
