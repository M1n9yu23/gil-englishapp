id: unit.a1-18
title: { ko: 어디 있어요?, en: Where is it? }
lessons:
  - id: lesson.a1-18.1
    title: { ko: "위에, 아래에", en: "On and under" }
    goal: { ko: 물건이 어디 있는지 말할 수 있어요, en: Say where things are }
    introduces: [sense.on.prep.surface, sense.under.prep.below, sense.floor.n.ground, sense.sofa.n.seat, sense.shelf.n.storage]
    steps:
      - type: listen
        en: "Where's my phone? It's {on|sense.on.prep.surface} the table."
        ko: 제 휴대폰 어디 있어요? 탁자 위에 있어요.
      - type: listen
        en: The cat is under the bed.
        ko: 고양이가 침대 밑에 있어요.
      - type: explain
        text: |
          물건이 어디 있는지는 `in`(안에), `on`(위에), `under`(밑에, 아래에)로 말해요. 이런 말은 `the table`처럼 기준이 되는 곳 앞에 와요. 그래서 `on the table`은 "탁자 위에"예요. 한국어와 순서가 반대예요.

          `on`은 무엇에 닿아 있을 때 써요. 바닥에 놓인 것도 `on the floor`예요. 앞에서 배운 `on Monday`와 글자는 같지만 여기서는 자리를 말해요.
        examples:
          - en: "[My keys]{who} [are]{do} [{on|sense.on.prep.surface} the floor]{where}."
            ko: 제 열쇠가 바닥에 있어요.
            literal: 내 열쇠들은 / 있다 / 바닥 위에
          - en: The cat is under the bed.
            ko: 고양이가 침대 밑에 있어요.
          - en: "The books are {on|sense.on.prep.surface} the shelf."
            ko: 책은 선반 위에 있어요.
          - en: Your phone is in your bag.
            ko: 휴대폰은 가방 안에 있어요.
      - type: chooseMeaning
        en: "My keys are {on|sense.on.prep.surface} the floor."
        item: sense.floor.n.ground
        options:
          - { ko: 제 열쇠가 바닥에 있어요., correct: true }
          - { ko: 제 열쇠가 탁자 위에 있어요., why: "탁자는 `table`이에요. `floor`는 바닥이에요." }
          - { ko: 제 열쇠가 선반 위에 있어요., why: "선반은 `shelf`예요. `floor`는 바닥이에요." }
      - type: listenChoose
        en: The cat is under the bed.
        item: sense.under.prep.below
        options:
          - { en: The cat is under the bed., correct: true }
          - { en: "The cat is {on|sense.on.prep.surface} the bed.", why: "`on`이 아니라 `under`가 들렸어요." }
          - { en: The cat is in the bed., why: "`in`이 아니라 `under`가 들렸어요." }
      - type: chooseEnglish
        ko: 책이 선반 위에 있어요.
        item: sense.on.prep.surface
        options:
          - { en: "The book is {on|sense.on.prep.surface} the shelf.", correct: true }
          - { en: The book is under the shelf., why: "`under`는 \"밑에\"예요. 위에 놓여 있으면 `on`이에요." }
          - { en: "The book is the shelf {on|sense.on.prep.surface}.", why: "`on`은 `the shelf` 앞에 와요. 한국어 \"선반 위에\"와 순서가 반대예요." }
      - type: fillBlank
        item: sense.under.prep.below
        en: Your bag is ___ the chair.
        ko: 가방이 의자 밑에 있어요.
        options:
          - { en: under, correct: true }
          - { en: "{on|sense.on.prep.surface}", why: "`on`은 \"위에\"예요. \"밑에\"는 `under`예요." }
          - { en: in, why: "`in`은 \"안에\"예요. \"밑에\"는 `under`예요." }
      - type: dialogue
        item: sense.sofa.n.seat
        lines:
          - { speaker: Mina, en: "Where's my phone?", ko: 제 휴대폰 어디 있어요? }
        question: 휴대폰은 소파 위에 있어요. 준이 할 말을 골라요.
        options:
          - { en: "It's {on|sense.on.prep.surface} the sofa.", correct: true }
          - { en: "It's under the sofa.", why: "`under`는 \"밑에\"예요. 위에 있으면 `on`이에요." }
          - { en: "It's {on|sense.on.prep.surface} sofa.", why: "`sofa` 앞에 `the`를 붙여요. 서로 아는 그 소파예요." }
      - type: fillBlank
        item: sense.in.prep.inside
        en: Your phone is ___ your bag.
        ko: 휴대폰은 가방 안에 있어요.
        answers: [in]
      - type: arrange
        item: sense.under.prep.below
        ko: 고양이가 소파 밑에 있어요.
        en: The cat is under the sofa.
        extra: [are, in]
      - type: dictation
        item: sense.floor.n.ground
        en: "My bag is {on|sense.on.prep.surface} the floor."
        ko: 제 가방이 바닥에 있어요.
      - type: spell
        sense: sense.shelf.n.storage
      - type: shadow
        en: "Where's my phone? It's {on|sense.on.prep.surface} the sofa."
        ko: 제 휴대폰 어디 있어요? 소파 위에 있어요.
  - id: lesson.a1-18.2
    title: { ko: "옆에, 앞에, 뒤에", en: "Next to, in front of, behind" }
    goal: { ko: "건물이 어디 옆, 앞, 뒤에 있는지 말할 수 있어요", en: Say where a place is compared to other places }
    introduces: [sense.next-to.prep.beside, sense.behind.prep.back, sense.in-front-of.prep.front, sense.between.prep.middle, sense.park.n.green]
    steps:
      - type: listen
        en: The bank is next to the hospital.
        ko: 은행은 병원 옆에 있어요.
      - type: listen
        en: The park is behind the school.
        ko: 공원은 학교 뒤에 있어요.
      - type: explain
        text: |
          `next to`는 "옆에", `behind`는 "뒤에", `in front of`는 "앞에"예요. `between the bank and the store`는 "은행과 가게 사이에"예요. 두세 단어로 된 말도 한 덩어리로 익혀요.

          한국어는 "학교 뒤에"처럼 "학교"가 먼저 오지만 영어는 `behind the school`처럼 `behind`가 먼저 와요. `behind`에는 `of`를 붙이지 않아요. `in front of`는 `of`까지 한 덩어리예요.
        examples:
          - en: "[The bank]{who} [is]{do} [next to the hospital]{where}."
            ko: 은행은 병원 옆에 있어요.
            literal: 은행은 / 있다 / 병원 옆에
          - en: The park is behind the school.
            ko: 공원은 학교 뒤에 있어요.
          - en: My car is in front of the house.
            ko: 제 차는 집 앞에 있어요.
          - en: "It's between the bank and the store."
            ko: 은행과 가게 사이에 있어요.
      - type: chooseMeaning
        en: The park is behind the school.
        item: sense.behind.prep.back
        options:
          - { ko: 공원은 학교 뒤에 있어요., correct: true }
          - { ko: 공원은 학교 앞에 있어요., why: "\"앞에\"는 `in front of`예요. `behind`는 \"뒤에\"예요." }
          - { ko: 공원은 학교 옆에 있어요., why: "\"옆에\"는 `next to`예요." }
      - type: listenChoose
        en: My car is in front of the house.
        item: sense.in-front-of.prep.front
        options:
          - { ko: 제 차는 집 앞에 있어요., correct: true }
          - { ko: 제 차는 집 뒤에 있어요., why: "\"뒤에\"는 `behind`예요. 들린 말은 `in front of`예요." }
          - { ko: 제 차는 집 안에 있어요., why: "`in` 뒤에 `front of`까지 들렸어요. `in front of`는 \"앞에\"예요." }
      - type: chooseEnglish
        ko: 은행과 가게 사이에 있어요.
        item: sense.between.prep.middle
        options:
          - { en: "It's between the bank and the store.", correct: true }
          - { en: "It's next to the bank and the store.", why: "\"사이에\"는 `between`이에요." }
          - { en: "It's behind the bank and the store.", why: "`behind`는 \"뒤에\"예요. \"사이에\"는 `between`이에요." }
      - type: fillBlank
        item: sense.next-to.prep.beside
        en: The station is ___ the park.
        ko: 역은 공원 옆에 있어요.
        options:
          - { en: next to, correct: true }
          - { en: behind, why: "`behind`는 \"뒤에\"예요. \"옆에\"는 `next to`예요." }
          - { en: between, why: "`between`은 둘 사이에 있을 때 써요. \"옆에\"는 `next to`예요." }
      - type: dialogue
        item: sense.next-to.prep.beside
        lines:
          - { speaker: Sam, en: "Excuse me. Where's the bank?", ko: "저기요, 은행이 어디 있어요?" }
        question: 은행은 병원 옆에 있어요. 하린이 할 말을 골라요.
        options:
          - { en: "It's next to the hospital.", correct: true }
          - { en: "It's behind the hospital.", why: "`behind`는 \"뒤에\"예요. \"옆에\"는 `next to`예요." }
          - { en: "It's next to hospital.", why: "`hospital` 앞에 `the`를 붙여요." }
      - type: fillBlank
        item: sense.in-front-of.prep.front
        en: My car is in ___ of the house.
        ko: 제 차는 집 앞에 있어요.
        answers: [front]
      - type: arrange
        item: sense.park.n.green
        ko: 공원은 학교 뒤에 있어요.
        en: The park is behind the school.
        extra: [of, in]
      - type: dictation
        item: sense.next-to.prep.beside
        en: The bank is next to the hospital.
        ko: 은행은 병원 옆에 있어요.
      - type: spell
        sense: sense.behind.prep.back
      - type: shadow
        en: "Excuse me. Where's the bank? It's next to the hospital."
        ko: 저기요, 은행이 어디 있어요? 병원 옆에 있어요.
  - id: lesson.a1-18.3
    title: { ko: 우리 동네, en: My neighborhood }
    goal: { ko: 동네에서 가게가 어디 있는지 묻고 답할 수 있어요, en: Ask and say where places are in your neighborhood }
    introduces: [sense.cafe.n.coffee, sense.library.n.books, sense.supermarket.n.food, sense.pharmacy.n.medicine, sense.post-office.n.mail]
    steps:
      - type: listen
        en: The library is behind the park.
        ko: 도서관은 공원 뒤에 있어요.
      - type: listen
        en: "Excuse me. Where's the post office?"
        ko: 저기요, 우체국이 어디 있어요?
      - type: explain
        text: |
          길을 물을 때는 `Excuse me. Where's the ~?`라고 해요. 대답은 `It's next to the bank`처럼 앞에서 배운 말로 해요. 동네 가게와 건물 앞에는 보통 `the`를 붙여요.

          `pharmacy`는 약국, `post office`는 우체국, `library`는 책을 빌리는 도서관이에요. `cafe`는 "캐페이"처럼 뒤를 세게 읽어요.
        examples:
          - en: "[The library]{who} [is]{do} [behind the park]{where}."
            ko: 도서관은 공원 뒤에 있어요.
            literal: 도서관은 / 있다 / 공원 뒤에
          - en: "Excuse me. Where's the pharmacy?"
            ko: 저기요, 약국이 어디 있어요?
          - en: The cafe is in front of the supermarket.
            ko: 카페는 슈퍼마켓 앞에 있어요.
      - type: readPassage
        sentences:
          - { en: I live near the station., ko: 저는 역 근처에 살아요. }
          - { en: The supermarket is next to the station., ko: 슈퍼마켓은 역 옆에 있어요. }
          - { en: The cafe is in front of the supermarket., ko: 카페는 슈퍼마켓 앞에 있어요. }
          - { en: The library is behind the park., ko: 도서관은 공원 뒤에 있어요. }
          - { en: The post office is between the bank and the pharmacy., ko: 우체국은 은행과 약국 사이에 있어요. }
        questions:
          - ko: 카페는 어디 있어요?
            options:
              - { ko: 슈퍼마켓 앞, correct: true }
              - { ko: 슈퍼마켓 뒤, why: "`in front of`는 \"앞에\"예요." }
              - { ko: 역 옆, why: "역 옆에 있는 건 슈퍼마켓이에요." }
          - ko: 우체국은 어디 있어요?
            options:
              - { ko: 은행과 약국 사이, correct: true }
              - { ko: 은행 앞, why: "`between`은 \"사이에\"예요. 은행과 약국 사이에 있어요." }
              - { ko: 공원 뒤, why: "공원 뒤에 있는 건 도서관이에요." }
      - type: chooseMeaning
        en: I study in the library.
        item: sense.library.n.books
        options:
          - { ko: 저는 도서관에서 공부해요., correct: true }
          - { ko: 저는 카페에서 공부해요., why: "카페는 `cafe`예요. `library`는 도서관이에요." }
          - { ko: 저는 서점에서 공부해요., why: "서점은 `bookstore`예요. `library`는 책을 빌리는 도서관이에요." }
      - type: listenChoose
        en: The pharmacy is next to the bank.
        item: sense.pharmacy.n.medicine
        options:
          - { ko: 약국은 은행 옆에 있어요., correct: true }
          - { ko: 우체국은 은행 옆에 있어요., why: "우체국은 `post office`예요. 들린 단어는 `pharmacy`예요." }
          - { ko: 약국은 은행 앞에 있어요., why: "\"앞에\"는 `in front of`예요. 들린 말은 `next to`예요." }
      - type: chooseEnglish
        ko: 슈퍼마켓이 어디 있어요?
        item: sense.supermarket.n.food
        options:
          - { en: "Where's the supermarket?", correct: true }
          - { en: Where the supermarket is?, why: "물을 때는 `is`가 앞으로 와요. `Where's`예요." }
          - { en: "Where's supermarket?", why: "동네 슈퍼마켓 앞에는 `the`를 붙여요." }
      - type: dialogue
        item: sense.post-office.n.mail
        lines:
          - { speaker: Ana, en: "Excuse me. Where's the post office?", ko: "저기요, 우체국이 어디 있어요?" }
        question: 우체국은 은행 뒤에 있어요. 준이 할 말을 골라요.
        options:
          - { en: "It's behind the bank.", correct: true }
          - { en: "It's in front of the bank.", why: "`in front of`는 \"앞에\"예요. \"뒤에\"는 `behind`예요." }
          - { en: "It's behind of the bank.", why: "`behind` 뒤에는 `of`를 붙이지 않아요." }
      - type: fillBlank
        item: sense.cafe.n.coffee
        en: I drink coffee in the ___.
        ko: 저는 카페에서 커피를 마셔요.
        answers: [cafe]
      - type: arrange
        item: sense.pharmacy.n.medicine
        ko: 약국은 은행과 카페 사이에 있어요.
        en: The pharmacy is between the bank and the cafe.
        extra: [of, to]
      - type: dictation
        item: sense.library.n.books
        en: The library is behind the park.
        ko: 도서관은 공원 뒤에 있어요.
      - type: spell
        sense: sense.pharmacy.n.medicine
      - type: shadow
        en: "Excuse me. Where's the post office? It's next to the bank."
        ko: 저기요, 우체국이 어디 있어요? 은행 옆에 있어요.
