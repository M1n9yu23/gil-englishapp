id: unit.a1-03
title: { ko: "어디에서 왔어요?", en: "Where are you from?" }
lessons:
  - id: lesson.a1-03.1
    title: { ko: from과 나라 이름, en: from and countries }
    goal: { ko: 어느 나라에서 왔는지 묻고 대답할 수 있어요, en: Ask and say where someone is from }
    introduces: [sense.where.adv.question, sense.from.prep.origin, sense.korea.n.country, sense.japan.n.country, sense.china.n.country, sense.canada.n.country]
    steps:
      - type: listen
        en: "Hi, I'm @Leo. Where are you from?"
        ko: "안녕하세요, 레오예요. 어디에서 왔어요?"
      - type: listen
        en: I'm from Korea.
        ko: 저는 한국에서 왔어요.
      - type: explain
        text: |
          어디에서 왔는지 물을 때는 `Where are you from?`이라고 해요. `where`는 "어디", `from`은 "~에서"예요. `from`이 문장 끝에 오지만 이게 자연스러운 말이에요.

          대답은 `I'm from Korea`예요. 우리말은 "한국에서"처럼 "에서"가 뒤에 붙지만 영어는 `from`이 나라 이름 앞에 와요.
        examples:
          - en: Where are you from?
            ko: 어디에서 왔어요?
          - en: "[I]{who} [am]{do} [from Korea]{where}."
            ko: 저는 한국에서 왔어요.
            literal: 저는 / ~이다 / 한국에서
      - type: chooseMeaning
        en: I'm from Japan.
        item: sense.japan.n.country
        options:
          - { ko: 저는 일본에서 왔어요., correct: true }
          - { ko: 저는 중국에서 왔어요., why: "중국은 `China`예요. `Japan`은 일본이에요." }
          - { ko: 일본에서 왔어요?, why: "`I'm`으로 시작하면 내 이야기예요. 물을 때는 `Are you`로 시작해요." }
      - type: listenChoose
        en: Are you from Canada?
        item: sense.canada.n.country
        options:
          - { ko: 캐나다에서 왔어요?, correct: true }
          - { ko: 캐나다에 있어요?, why: "들린 말은 `from`, \"~에서 왔다\"예요. 지금 어디에 있는지 물을 때는 `in`을 써요." }
          - { ko: 저는 캐나다에서 왔어요., why: "`Are you`로 시작해서 상대에게 묻는 말이에요." }
      - type: dialogue
        item: sense.where.adv.question
        lines:
          - { speaker: Leo, en: "Hi, I'm @Leo. Where are you from?", ko: "안녕하세요, 레오예요. 어디에서 왔어요?" }
        question: 미나는 한국에서 왔어요. 미나가 할 말을 골라요.
        options:
          - { en: "Hi, I'm @Mina. I'm from Korea.", correct: true }
          - { en: "Hi, I'm @Mina. I'm Korea.", why: "`from`이 빠졌어요. 어느 나라에서 왔는지 말할 때는 `I'm from Korea`예요." }
          - { en: "Hi, I'm @Mina. I'm fine.", why: "`I'm fine`은 `How are you?`에 하는 대답이에요. 어디에서 왔는지 물었어요." }
      - type: explain
        text: |
          나라 이름은 사람 이름처럼 늘 대문자로 시작해요. `Korea`는 가운데 `re`를 세게 말해요. `Are you from Japan?`처럼 물었는데 아니면 `No`라고 한 뒤 맞는 나라를 말해요.
        examples:
          - en: Are you from Japan?
            ko: 일본에서 왔어요?
          - en: "No, I'm from China."
            ko: "아니요, 중국에서 왔어요."
      - type: chooseEnglish
        ko: 중국에서 왔어요?
        item: sense.china.n.country
        options:
          - { en: Are you from China?, correct: true }
          - { en: Are you China?, why: "`from`이 빠졌어요. 나라 이름 앞에 `from`이 와야 \"~에서 왔다\"가 돼요." }
          - { en: Where are you from?, why: "\"어디에서 왔어요?\"라는 말이에요. 중국에서 왔는지 묻는 말은 `Are you from China?`예요." }
      - type: dialogue
        item: sense.korea.n.country
        lines:
          - { speaker: Ana, en: "Are you from Canada, @Jun?", ko: "준 씨는 캐나다에서 왔어요?" }
        question: 준은 한국에서 왔어요. 준이 할 말을 골라요.
        options:
          - { en: "No, I'm from Korea.", correct: true }
          - { en: "Yes, I'm from Korea.", why: "캐나다에서 왔는지 물었는데 한국에서 왔으니 `No`로 대답해요." }
          - { en: "No, I'm not from Korea.", why: "`not`이 들어가면 한국에서 오지 않았다는 말이 돼요. `No, I'm from Korea`면 돼요." }
      - type: fillBlank
        item: sense.from.prep.origin
        en: I'm ___ Canada.
        ko: 저는 캐나다에서 왔어요.
        answers: [from]
      - type: arrange
        item: sense.where.adv.question
        ko: 어디에서 왔어요?
        en: Where are you from?
        extra: [is]
      - type: spell
        sense: sense.where.adv.question
      - type: shadow
        en: "Where are you from? I'm from Korea."
        ko: "어디에서 왔어요? 저는 한국에서 왔어요."
  - id: lesson.a1-03.2
    title: { ko: Korea와 Korean, en: Korea and Korean }
    goal: { ko: 어느 나라 사람인지 말할 수 있어요, en: Say what nationality you are }
    introduces: [sense.korean.adj.nationality, sense.japanese.adj.nationality, sense.chinese.adj.nationality, sense.canadian.adj.nationality, sense.american.adj.nationality]
    steps:
      - type: listen
        en: "I'm from Korea. I'm Korean."
        ko: "저는 한국에서 왔어요. 한국 사람이에요."
      - type: listen
        en: Are you Japanese?
        ko: 일본 사람이에요?
      - type: explain
        text: |
          "저는 한국 사람이에요"는 `I'm Korean`이에요. `Korea`는 나라 이름이고 `Korean`은 "한국 사람인, 한국의"예요. `I'm Korea`라고 하면 "저는 한국이에요"가 돼요.

          나라 이름은 `from` 뒤에 오고 `Korean` 같은 말은 `I'm` 바로 뒤에 와요. `I'm from Korea`와 `I'm Korean`은 거의 같은 말이에요.
        examples:
          - en: I'm Korean.
            ko: 저는 한국 사람이에요.
          - en: I'm from Korea.
            ko: 저는 한국에서 왔어요.
      - type: chooseEnglish
        ko: 저는 한국 사람이에요.
        item: sense.korean.adj.nationality
        options:
          - { en: I'm Korean., correct: true }
          - { en: I'm Korea., why: "`Korea`는 나라 이름이에요. 한국 사람이라고 할 때는 `Korean`이에요." }
          - { en: I'm from Korean., why: "`from` 뒤에는 나라 이름 `Korea`가 와요. `I'm from Korea`나 `I'm Korean`이라고 해요." }
      - type: dialogue
        item: sense.korean.adj.nationality
        lines:
          - { speaker: Omar, en: "Are you Chinese?", ko: "중국 사람이에요?" }
        question: 미나는 한국 사람이에요. 미나가 할 말을 골라요.
        options:
          - { en: "No, I'm Korean.", correct: true }
          - { en: "No, I'm Korea.", why: "`Korea`는 나라 이름이에요. 한국 사람이라고 할 때는 `Korean`이에요." }
          - { en: "Yes, I'm Korean.", why: "중국 사람인지 물었어요. 중국 사람이 아니면 `No`로 대답해요." }
      - type: explain
        text: |
          끝 모양은 나라마다 달라서 하나씩 익혀요. `Japan`은 `Japanese`, `China`는 `Chinese`, `Canada`는 `Canadian`이에요. 미국 사람은 `American`이에요. `Japanese`와 `Chinese`는 끝의 `nese`를, `Canadian`은 가운데 `na`를 세게 말해요.
        examples:
          - en: Are you Japanese?
            ko: 일본 사람이에요?
          - en: "No, I'm Chinese."
            ko: "아니요, 중국 사람이에요."
          - en: "I'm from Canada. I'm Canadian."
            ko: "저는 캐나다에서 왔어요. 캐나다 사람이에요."
      - type: chooseMeaning
        en: I'm Canadian.
        item: sense.canadian.adj.nationality
        options:
          - { ko: 저는 캐나다 사람이에요., correct: true }
          - { ko: 저는 캐나다에 있어요., why: "캐나다에 있다는 말은 `I'm in Canada`예요. `Canadian`은 캐나다 사람이라는 뜻이에요." }
          - { ko: 캐나다 사람이에요?, why: "`I'm`으로 시작하면 내 이야기예요. 물을 때는 `Are you`로 시작해요." }
      - type: listenChoose
        en: Are you Chinese?
        item: sense.chinese.adj.nationality
        options:
          - { ko: 중국 사람이에요?, correct: true }
          - { ko: 일본 사람이에요?, why: "일본 사람은 `Japanese`예요. 들린 말은 `ch` 소리로 시작하는 `Chinese`예요." }
          - { ko: 중국 사람이에요., why: "`Are you`로 시작해서 묻는 말이에요." }
      - type: dialogue
        item: sense.japanese.adj.nationality
        lines:
          - { speaker: Ana, en: "Are you Japanese, @Yuki?", ko: "유키 씨는 일본 사람이에요?" }
        question: 유키는 일본 사람이에요. 유키가 할 말을 골라요.
        options:
          - { en: "Yes, I am.", correct: true }
          - { en: "Yes, I'm Japan.", why: "`Japan`은 나라 이름이에요. 일본 사람이라고 하려면 `Japanese`예요." }
          - { en: "Yes, I'm.", why: "평소에는 `I'm`으로 줄여도 대답 끝에 오는 `I am`은 줄이지 않아요." }
      - type: fillBlank
        item: sense.american.adj.nationality
        en: "I'm from @Chicago. I'm ___."
        ko: "저는 시카고에서 왔어요. 미국 사람이에요."
        answers: [American]
      - type: arrange
        item: sense.japanese.adj.nationality
        ko: 일본 사람이에요?
        en: Are you Japanese?
        extra: [Japan]
      - type: spell
        sense: sense.korean.adj.nationality
      - type: shadow
        en: "I'm Korean. I'm from @Seoul."
        ko: "저는 한국 사람이에요. 서울에서 왔어요."
  - id: lesson.a1-03.3
    title: { ko: 나라와 도시, en: Countries and cities }
    goal: { ko: 어느 나라 어느 도시에서 왔는지 말할 수 있어요, en: Say which country and city you are from }
    introduces: [sense.brazil.n.country, sense.mexico.n.country, sense.vietnam.n.country, sense.india.n.country, sense.city.n.town]
    steps:
      - type: listen
        en: "I'm from @Hanoi. It's a big city in Vietnam."
        ko: "저는 하노이에서 왔어요. 베트남에 있는 큰 도시예요."
      - type: listen
        en: Are you from Brazil?
        ko: 브라질에서 왔어요?
      - type: explain
        text: |
          나라 이름은 우리말과 비슷한 것이 많지만 힘주는 자리가 달라요. `Brazil`은 뒤의 `zil`을, `Mexico`와 `India`는 앞을 세게 말해요.

          `city`는 "도시"예요. 도시 이름도 `from` 뒤에 와요. 도시 이름만 말하면 상대가 모를 것 같을 때는 `It's a big city in India`처럼 어느 나라에 있는지 덧붙여요.
        examples:
          - en: I'm from Brazil.
            ko: 저는 브라질에서 왔어요.
          - en: Are you from Mexico?
            ko: 멕시코에서 왔어요?
          - en: "I'm from @Pune. It's a big city in India."
            ko: "저는 푸네에서 왔어요. 인도에 있는 큰 도시예요."
      - type: chooseMeaning
        en: "@Hanoi is a city in Vietnam."
        item: sense.vietnam.n.country
        options:
          - { ko: 하노이는 베트남에 있는 도시예요., correct: true }
          - { ko: 하노이는 인도에 있는 도시예요., why: "인도는 `India`예요. `Vietnam`은 베트남이에요." }
          - { ko: 하노이는 베트남이에요., why: "`city`가 있어요. 하노이는 나라가 아니라 베트남에 있는 도시예요." }
      - type: listenChoose
        en: I'm from Mexico.
        item: sense.mexico.n.country
        options:
          - { ko: 저는 멕시코에서 왔어요., correct: true }
          - { ko: 저는 브라질에서 왔어요., why: "브라질은 `Brazil`이에요. 들린 말은 가운데 `x`가 `ks`로 나는 `Mexico`예요." }
          - { ko: 멕시코에서 왔어요?, why: "`I'm`으로 시작해서 끝을 내려 말했어요. 내가 어디에서 왔는지 말하는 거예요." }
      - type: chooseEnglish
        ko: 저는 브라질에서 왔어요.
        item: sense.brazil.n.country
        options:
          - { en: I'm from Brazil., correct: true }
          - { en: I'm in Brazil., why: "`in Brazil`은 지금 브라질에 있다는 말이에요. 브라질 출신이면 `from`을 써요." }
          - { en: I'm Brazil., why: "`from`이 빠졌어요. `I'm Brazil`은 \"저는 브라질이에요\"가 돼요." }
      - type: dialogue
        item: sense.india.n.country
        lines:
          - { speaker: Leo, en: "Where are you from, @Sam?", ko: "샘 씨는 어디에서 왔어요?" }
        question: 샘은 인도에서 왔어요. 샘이 할 말을 골라요.
        options:
          - { en: I'm from India., correct: true }
          - { en: "Yes, I'm from India.", why: "`Where`로 묻는 말에는 `Yes`나 `No`로 대답하지 않아요. 어디인지 바로 말해요." }
          - { en: I'm India., why: "`from`이 빠졌어요. 어디에서 왔는지 말할 때는 `I'm from India`예요." }
      - type: readPassage
        sentences:
          - en: "Hi, everyone. I'm @Diego."
            ko: "다들 안녕하세요. 디에고예요."
          - en: "I'm from @Monterrey."
            ko: "몬테레이에서 왔어요."
          - en: "It's a big city in Mexico."
            ko: "멕시코에 있는 큰 도시예요."
          - en: "Nice to meet you."
            ko: "만나서 반가워요."
        questions:
          - ko: 디에고는 어디에서 왔어요?
            options:
              - { ko: 멕시코에 있는 도시, correct: true }
              - { ko: 브라질에 있는 도시, why: "`It's a big city in Mexico`라고 했어요. 몬테레이는 멕시코에 있어요." }
              - { ko: 몬테레이라는 나라, why: "`It's a big city`라고 했어요. 몬테레이는 나라가 아니라 도시예요." }
          - ko: 몬테레이는 어떤 도시예요?
            options:
              - { ko: 큰 도시, correct: true }
              - { ko: 작은 도시, why: "`big`은 크다는 말이에요. 작다는 `small`이에요." }
      - type: fillBlank
        item: sense.city.n.town
        en: "@Busan is a big ___."
        ko: 부산은 큰 도시예요.
        answers: [city]
      - type: arrange
        item: sense.vietnam.n.country
        ko: 저는 베트남에서 왔어요.
        en: I'm from Vietnam.
        extra: [in]
      - type: dictation
        item: sense.india.n.country
        en: It's a big city in India.
        ko: 인도에 있는 큰 도시예요.
      - type: spell
        sense: sense.city.n.town
      - type: shadow
        en: "Hi, I'm @Ana. I'm from Brazil."
        ko: "안녕하세요, 아나예요. 브라질에서 왔어요."
  - id: lesson.a1-03.4
    title: { ko: 할 줄 아는 언어, en: Languages you speak }
    goal: { ko: 어떤 언어를 하는지 말할 수 있어요, en: Say which languages you speak }
    introduces: [sense.english.n.language, sense.korean.n.language, sense.japanese.n.language, sense.chinese.n.language, sense.speak.v.language, pattern.a-little]
    steps:
      - type: listen
        en: "I speak {Korean|sense.korean.n.language} and English."
        ko: "저는 한국어와 영어를 해요."
      - type: explain
        text: |
          할 줄 아는 언어를 말할 때는 `I speak English`처럼 `speak`를 써요. 우리말 "영어를 해요"의 "하다"를 `do`로 옮기지 않아요. 언어 이름은 대문자로 시작해요. 잘하지는 못해도 조금 하면 `I speak a little English`처럼 `a little`을 붙여요.
        examples:
          - en: I speak English.
            ko: 저는 영어를 해요.
          - en: "[I]{who} [speak]{do} [a little English]{what}."
            ko: 저는 영어를 조금 해요.
            literal: 저는 / 말하다 / 조금 영어를
      - type: chooseMeaning
        en: I speak a little English.
        item: pattern.a-little
        options:
          - { ko: 저는 영어를 조금 해요., correct: true }
          - { ko: 저는 영어를 잘해요., why: "`a little`은 \"조금\"이에요. 잘한다는 말이 아니에요." }
          - { ko: 저는 영어를 못해요., why: "`not`이 없어요. 조금은 한다는 말이에요." }
      - type: chooseEnglish
        ko: 저는 한국어를 해요.
        item: sense.speak.v.language
        options:
          - { en: "I speak {Korean|sense.korean.n.language}.", correct: true }
          - { en: "I'm {Korean|sense.korean.adj.nationality}.", why: "`I'm Korean`은 한국 사람이라는 말이에요. 언어를 한다고 할 때는 `speak`를 써요." }
          - { en: I speak Korea., why: "`Korea`는 나라 이름이에요. 한국어는 `Korean`이에요." }
      - type: fillBlank
        item: sense.speak.v.language
        en: "I ___ English and {Korean|sense.korean.n.language}."
        ko: 저는 영어와 한국어를 해요.
        answers: [speak]
      - type: explain
        text: |
          `Korean`은 "한국 사람인"이라는 뜻도 있고 "한국어"라는 뜻도 있어요. `I'm Korean`은 한국 사람이라는 말이고 `I speak Korean`은 한국어를 한다는 말이에요. `Japanese`와 `Chinese`도 일본어, 중국어라는 뜻이 있어요.
        examples:
          - en: "I'm {Korean|sense.korean.adj.nationality}. I speak {Korean|sense.korean.n.language}."
            ko: "저는 한국 사람이에요. 한국어를 해요."
          - en: "I speak {Japanese|sense.japanese.n.language}."
            ko: 저는 일본어를 해요.
          - en: "I speak a little {Chinese|sense.chinese.n.language}."
            ko: 저는 중국어를 조금 해요.
      - type: listenChoose
        en: "I speak {Japanese|sense.japanese.n.language}."
        item: sense.japanese.n.language
        options:
          - { ko: 저는 일본어를 해요., correct: true }
          - { ko: 저는 일본 사람이에요., why: "일본 사람이라는 말은 `I'm Japanese`예요. `speak` 뒤의 `Japanese`는 일본어예요." }
          - { ko: 저는 중국어를 해요., why: "중국어는 `Chinese`예요. 들린 말은 `j` 소리로 시작하는 `Japanese`예요." }
      - type: chooseEnglish
        ko: 저는 중국어를 조금 해요.
        item: sense.chinese.n.language
