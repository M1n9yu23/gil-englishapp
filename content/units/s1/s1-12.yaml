id: unit.s1-12
title: { ko: 겹자음, en: Consonant clusters }
lessons:
  - id: lesson.s1-12.1
    title: { ko: l과 r이 붙는 자음, en: Clusters with l and r }
    goal: { ko: play와 pray를 듣고 구별할 수 있어요, en: Tell play from pray }
    introduces: [sound.blend-l, sound.blend-r]
    steps:
      - type: listen
        en: Play.
        ko: 놀다
        checkVocab: false
      - type: listen
        en: Pray.
        ko: 기도하다
        checkVocab: false
      - type: explain
        checkVocab: false
        text: |
          한글로 "플레이"라고 적으면 "프"의 "으"가 끼어들어요. 영어 `play`는 `p`와 `l` 사이에 모음이 없어서 한 박자예요.

          `bl`, `cl`, `fl`, `gl`, `pl`, `sl`은 앞 자음을 내는 동안 혀끝을 미리 윗잇몸에 붙여 두세요. 그러면 두 소리가 한 번에 이어져요.

          `br`, `cr`, `dr`, `fr`, `gr`, `tr`은 앞 자음을 내자마자 혀를 뒤로 말아요. 혀끝은 어디에도 닿지 않아요. `play`와 `pray`는 이 차이 하나로 다른 단어가 돼요.
        examples:
          - en: Black.
            ko: 검은색
          - en: Flag.
            ko: 깃발
          - en: Tree.
            ko: 나무
          - en: Bread.
            ko: 빵
      - type: listenChoose
        en: Black.
        item: sound.blend-l
        checkVocab: false
        options:
          - { ko: 한 박자, correct: true }
          - { ko: 두 박자, why: '"블랙"처럼 `b` 뒤에 "으"를 넣으면 두 박자가 돼요. 영어 `black`은 `bl`이 한 번에 이어져서 한 박자예요.' }
      - type: minimalPair
        words: [play, pray]
        answer: pray
        item: sound.blend-r
        why: '`p` 뒤에서 혀끝이 닿지 않고 말리는 소리가 나면 `pray`예요. 혀끝이 윗잇몸에 닿으면 `play`예요.'
      - type: minimalPair
        words: [fly, fry]
        answer: fly
        item: sound.blend-l
        why: '`f` 뒤에 혀끝이 윗잇몸에 닿는 `l`이 이어졌어요. `fry`는 혀를 말아서 소리가 더 둥글어요.'
      - type: minimalPair
        words: [glass, grass]
        answer: grass
        item: sound.blend-r
        why: '`g` 뒤에 혀를 만 `r`이 이어졌어요. 혀끝이 윗잇몸에 닿지 않았으니 `grass`예요.'
      - type: minimalPair
        words: [clown, crown]
        answer: clown
        item: sound.blend-l
        why: '`k` 소리 바로 뒤에 혀끝이 윗잇몸에 닿았어요. 그래서 `clown`이에요.'
      - type: shadow
        en: Play, pray.
        ko: 놀다, 기도하다.
        checkVocab: false
      - type: dictation
        en: Flag.
        ko: 깃발
        item: sound.blend-l
        checkVocab: false
      - type: dictation
        en: Frog.
        ko: 개구리
        item: sound.blend-r
        checkVocab: false
  - id: lesson.s1-12.2
    title: { ko: s로 시작하는 자음, en: Clusters with s }
    goal: { ko: stop과 street를 한 박자로 말할 수 있어요, en: Say stop and street in one beat }
    introduces: [sound.blend-s, sound.blend-three]
    steps:
      - type: listen
        en: Stop.
        ko: 멈춰요.
        checkVocab: false
      - type: listen
        en: Street.
        ko: 거리
        checkVocab: false
      - type: explain
        checkVocab: false
        text: |
          `stop`을 "스톱"이라고 하면 "스"와 "톱" 두 박자가 돼요. 영어 `stop`은 `s`에서 "으"를 빼고 바로 `t`로 넘어가서 한 박자예요.

          `sk`, `sm`, `sn`, `sp`, `st`는 `s`의 바람 소리를 짧게 내다가 그대로 다음 자음을 붙여요. `s` 뒤의 `p`, `t`, `k`는 바람을 세게 터뜨리지 않아요. 그래서 `spoon`의 `p`가 `b`처럼 들려도 정상이에요.

          `street`는 `s`, `t`, `r` 세 자음이 붙어 있어요. "스트리트"는 네 박자지만 영어로는 한 박자예요. 손뼉을 치며 박자를 세어 보면 차이가 잘 느껴져요.
        examples:
          - en: Stop.
            ko: 멈춰요.
          - en: Snow.
            ko: 눈
          - en: Spoon.
            ko: 숟가락
          - en: Street.
            ko: 거리
          - en: Splash.
            ko: 첨벙
      - type: listenChoose
        en: Street.
        item: sound.blend-three
        checkVocab: false
        options:
          - { ko: 한 박자, correct: true }
          - { ko: 두 박자, why: '`str`은 자음 셋이 한 번에 이어져요. 모음은 `ee` 하나뿐이라 한 박자예요.' }
          - { ko: 네 박자, why: '"스트리트"처럼 "으"를 넣으면 네 박자가 돼요. 영어 `street`는 한 박자예요.' }
      - type: minimalPair
        words: [pot, spot]
        answer: spot
        item: sound.blend-s
        why: '`p` 앞에 `s`의 바람 소리가 짧게 붙었어요. "으"가 없어서 `pot`과 박자 수는 같아요.'
      - type: minimalPair
        words: [stop, spot]
        answer: stop
        item: sound.blend-s
        why: '`s` 바로 뒤에 혀끝이 윗잇몸에 닿는 `t`가 왔어요. `spot`은 입술이 닫히는 `p`가 먼저 와요.'
      - type: minimalPair
        words: [pray, spray]
        answer: spray
        item: sound.blend-three
        why: '맨 앞에 `s`가 짧게 붙어 `spr` 세 자음이 이어졌어요. 그래도 한 박자예요.'
      - type: listenChoose
        en: Snow.
        item: sound.blend-s
        checkVocab: false
        options:
          - { en: snow, correct: true }
          - { en: slow, why: '`slow`는 `s` 뒤에 혀끝이 닿는 `l`이 와요. 여기서는 코로 울리는 `n`이 들렸어요.' }
          - { en: so, why: '`s`와 모음 사이에 `n`이 하나 더 있었어요.' }
      - type: shadow
        en: Stop.
        ko: 멈춰요.
        checkVocab: false
      - type: shadow
        en: Street.
        ko: 거리
        checkVocab: false
      - type: dictation
        en: Spoon.
        ko: 숟가락
        item: sound.blend-s
        checkVocab: false
      - type: dictation
        en: Street.
        ko: 거리
        item: sound.blend-three
        checkVocab: false
  - id: lesson.s1-12.3
    title: { ko: "ng, nk와 끝소리", en: "ng, nk and final sounds" }
    goal: { ko: "끝소리에 \"으\"를 붙이지 않고 말할 수 있어요", en: End a word without adding a vowel }
    introduces: [sound.ng, sound.nk]
    steps:
      - type: listen
        en: Sing.
        ko: 노래하다
        checkVocab: false
      - type: listen
        en: Sink.
        ko: 싱크대
        checkVocab: false
      - type: explain
        checkVocab: false
        text: |
          `sing`의 `ng`는 우리말 "강"의 받침과 같은 소리예요. 단어 끝의 `ng`에서는 `g`를 따로 소리 내지 않아요. "싱그"가 아니라 받침에서 멈춰요.

          `nk`는 그 받침 소리 뒤에 `k`를 짧게 붙여요. `pink`를 "핑크"라고 하면 "크"가 한 박자를 더 차지해요. 영어 `pink`는 한 박자예요.

          다른 자음으로 끝나는 단어도 같아요. `desk`는 "데스크" 세 박자가 아니라 한 박자예요. 끝 자음은 짧고 약해도 괜찮아요. "으"만 붙이지 않으면 돼요.
        examples:
          - en: Sing.
            ko: 노래하다
          - en: Long.
            ko: 긴
          - en: Pink.
            ko: 분홍색
          - en: Think.
            ko: 생각하다
          - en: Desk.
            ko: 책상
      - type: minimalPair
        words: [sing, sink]
        answer: sink
        item: sound.nk
        why: '코로 울리는 소리 뒤에 `k`가 짧게 붙었어요. `sing`은 코 울림으로 끝나요.'
      - type: minimalPair
        words: [thing, think]
        answer: thing
        item: sound.ng
        why: '끝이 코 울림으로 끝나고 `k`가 없었어요. 그래서 `thing`이에요.'
      - type: minimalPair
        words: [wing, wink]
        answer: wink
        item: sound.nk
        why: '끝에 `k`가 짧게 들렸어요. `wing`은 받침 소리에서 멈춰요.'
      - type: listenChoose
        en: Pink.
        item: sound.nk
        checkVocab: false
        options:
          - { ko: 한 박자, correct: true }
          - { ko: 두 박자, why: '"핑크"처럼 "크"를 따로 내면 두 박자가 돼요. 영어는 `k`를 짧게 붙여 한 박자예요.' }
      - type: listenChoose
        en: Long.
        item: sound.ng
        checkVocab: false
        options:
          - { ko: 한 박자, correct: true }
          - { ko: 두 박자, why: '`g`를 따로 내면 "롱그"처럼 두 박자가 돼요. `ng`는 받침 하나예요.' }
      - type: shadow
        en: Think.
        ko: 생각해 봐요.
        checkVocab: false
      - type: shadow
        en: Desk.
        ko: 책상
        checkVocab: false
      - type: dictation
        en: Long.
        ko: 긴
        item: sound.ng
        checkVocab: false
      - type: dictation
        en: Pink.
        ko: 분홍색
        item: sound.nk
        checkVocab: false
