id: unit.s1-01
title: { ko: 알파벳 이름 A부터 M까지, en: Letter names A to M }
lessons:
  - id: lesson.s1-01.1
    title: { ko: "A, B, C, D", en: "A, B, C, D" }
    goal: { ko: A부터 D까지 이름을 듣고 고를 수 있어요, en: Hear and pick the letters A to D }
    introduces: [sound.letter-a, sound.letter-b, sound.letter-c, sound.letter-d]
    steps:
      - type: listen
        en: A, B, C, D.
        ko: 알파벳의 처음 네 글자예요.
        checkVocab: false
      - type: explain
        text: |
          영어 글자는 26개이고, 글자마다 이름이 있어요. 이 단원에서는 그 이름을 익혀요. 단어 안에서 글자가 내는 소리는 이름과 다를 때가 많은데, 그건 나중에 따로 배워요.

          `A`는 "에이"에 가까워요. `B`, `C`, `D`는 셋 다 길게 끄는 "이"로 끝나요. 끝이 같으니 첫소리를 듣고 구별해요.

          `B`는 두 입술을 붙였다가 떼면서 시작해요. `D`는 입술 대신 혀끝을 윗잇몸에 댔다가 떼요. `C`의 첫소리는 "씨"처럼 바람이 새는 소리예요.
        examples:
          - en: A, a.
            ko: 대문자 A와 소문자 a
          - en: B.
            ko: 글자 B
          - en: C.
            ko: 글자 C
          - en: D.
            ko: 글자 D
        checkVocab: false
      - type: listenChoose
        en: "B"
        item: sound.letter-b
        options:
          - en: "B"
            correct: true
          - en: "D"
            why: '`D`는 혀끝으로 시작해요. 방금은 두 입술이 붙었다 떨어지는 소리였어요.'
          - en: "C"
            why: '`C`는 바람이 새는 "씨"로 시작해요. 입술이 닫혔다 열리면 `B`예요.'
        checkVocab: false
      - type: minimalPair
        words: ["B", "D"]
        answer: "D"
        why: '`D`는 혀끝을 윗잇몸에 댔다 떼며 시작하고, `B`는 두 입술로 시작해요.'
        item: sound.letter-d
      - type: chooseEnglish
        ko: 이름이 길게 끄는 "이" 하나로 끝나지 않는 글자
        item: sound.letter-a
        options:
          - en: "A"
            correct: true
          - en: "B"
            why: '`B`는 "비"처럼 긴 "이"로 끝나요. `A`는 "에"에서 "이"로 움직여요.'
          - en: "C"
            why: '`C`는 "씨"처럼 긴 "이"로 끝나요. `A`는 "에"에서 "이"로 움직여요.'
          - en: "D"
            why: '`D`는 "디"처럼 긴 "이"로 끝나요. `A`는 "에"에서 "이"로 움직여요.'
        checkVocab: false
      - type: listenChoose
        en: "C"
        item: sound.letter-c
        options:
          - en: "C"
            correct: true
          - en: "B"
            why: '`B`는 입술을 붙였다 떼며 시작해요. 바람이 새는 소리로 시작하면 `C`예요.'
          - en: "D"
            why: '`D`는 혀끝을 댔다 떼며 시작해요. 바람이 새는 소리로 시작하면 `C`예요.'
        checkVocab: false
      - type: fillBlank
        en: A, ___, C, D.
        ko: 빈칸에 들어갈 글자를 써 보세요.
        answers: ["B", "b"]
        item: sound.letter-b
        checkVocab: false
      - type: shadow
        en: A, B, C, D.
        ko: 알파벳의 처음 네 글자예요.
        checkVocab: false
      - type: explain
        text: |
          이번에는 들리는 글자를 받아써요. 단어 하나를 한 글자씩 불러 줘요.

          글자 사이를 한 칸씩 띄워 써요. 대문자로 써도 되고 소문자로 써도 돼요.
        checkVocab: false
      - type: dictation
        en: D, A, D.
        ko: 아빠라는 뜻의 dad를 한 글자씩 불렀어요.
        item: sound.letter-a
        checkVocab: false

  - id: lesson.s1-01.2
    title: { ko: "E, F, G, H", en: "E, F, G, H" }
    goal: { ko: E부터 H까지 이름을 듣고 고를 수 있어요, en: Hear and pick the letters E to H }
    introduces: [sound.letter-e, sound.letter-f, sound.letter-g, sound.letter-h]
    steps:
      - type: listen
        en: E, F, G, H.
        ko: 알파벳의 다섯째부터 여덟째 글자예요.
        checkVocab: false
      - type: explain
        text: |
          `E`는 길게 끄는 "이"예요. 처음부터 끝까지 입 모양이 그대로예요. `A`는 "에"에서 "이"로 입이 움직이니 끝까지 들으면 구별돼요.

          `G`도 "이"로 끝나요. `B`, `C`, `D`, `E`, `G`가 한 무리예요. `G`의 첫소리는 우리말 "지"의 첫소리와 비슷해요.
        examples:
          - en: E.
            ko: 글자 E
          - en: E, A, E, A.
            ko: E와 A를 번갈아 들어요.
          - en: G.
            ko: 글자 G
        checkVocab: false
      - type: listenChoose
        en: "E"
        item: sound.letter-e
        options:
          - en: "E"
            correct: true
          - en: "A"
            why: '`A`는 "에"에서 "이"로 움직여요. 처음부터 "이"만 길게 들리면 `E`예요.'
          - en: "G"
            why: '`G`는 앞에 "지" 같은 첫소리가 있어요. 첫소리 없이 "이"만 들리면 `E`예요.'
        checkVocab: false
      - type: listenChoose
        en: "G"
        item: sound.letter-g
        options:
          - en: "G"
            correct: true
          - en: "D"
            why: '`D`는 혀끝을 댔다 떼며 시작해요. "지"처럼 시작하면 `G`예요.'
          - en: "E"
            why: '`E`는 첫소리 없이 "이"만 내요. 앞에 "지" 같은 소리가 있으면 `G`예요.'
        checkVocab: false
      - type: explain
        text: |
          `F`는 "에"로 시작해서 바람 소리로 끝나요. 윗니를 아랫입술에 가볍게 대고 그 틈으로 바람만 내보내요. 우리말로 "에프"라고 적곤 하지만 끝에 "으"를 붙이지 않아요.

          `H`는 `A`처럼 "에이"로 시작하고 짧은 "치"로 끝나요. 끝의 "치"는 "이"를 거의 내지 않고 짧게 끊어요.
        examples:
          - en: F.
            ko: 글자 F
          - en: H.
            ko: 글자 H
        checkVocab: false
      - type: listenChoose
        en: "H"
        item: sound.letter-h
        options:
          - en: "H"
            correct: true
          - en: "A"
            why: '`A`는 "에이"에서 끝나요. 끝에 짧은 "치"가 붙으면 `H`예요.'
          - en: "E"
            why: '`E`는 "이"만 길게 내요. "에이"로 시작하면 `A`나 `H`예요.'
        checkVocab: false
      - type: listenChoose
        en: "F"
        item: sound.letter-f
        options:
          - en: "F"
            correct: true
          - en: "H"
            why: '`H`는 "에이"로 시작해요. 짧은 "에" 다음에 바람 소리가 나면 `F`예요.'
          - en: "E"
            why: '`E`는 "이"만 길게 내요. 끝에 바람 소리가 남으면 `F`예요.'
        checkVocab: false
      - type: fillBlank
        en: D, E, ___, G.
        ko: 빈칸에 들어갈 글자를 써 보세요.
        answers: ["F", "f"]
        item: sound.letter-f
        checkVocab: false
      - type: shadow
        en: E, F, G, H.
        ko: 알파벳의 다섯째부터 여덟째 글자예요.
        checkVocab: false
      - type: dictation
        en: B, E, D.
        ko: 침대라는 뜻의 bed를 한 글자씩 불렀어요.
        item: sound.letter-e
        checkVocab: false
      - type: dictation
        en: E, G, G.
        ko: 달걀이라는 뜻의 egg를 한 글자씩 불렀어요.
        item: sound.letter-g
        checkVocab: false

  - id: lesson.s1-01.3
    title: { ko: I부터 M까지, en: I to M }
    goal: { ko: I부터 M까지 이름을 듣고 고를 수 있어요, en: Hear and pick the letters I to M }
    introduces: [sound.letter-i, sound.letter-j, sound.letter-k, sound.letter-l, sound.letter-m]
    steps:
      - type: listen
        en: I, J, K, L, M.
        ko: 알파벳의 아홉째부터 열셋째 글자예요.
        checkVocab: false
      - type: explain
        text: |
          `I`는 "아이"예요. `E`는 "이"라서 둘을 자주 헷갈려요. 철자를 들을 때 "이"가 들리면 `E`, "아이"가 들리면 `I`예요.

          `J`와 `K`는 `A`처럼 "에이"로 끝나요. `J`는 "제이", `K`는 "케이"에 가까워요. `G`와 `J`는 첫소리가 같고 끝만 달라요.
        examples:
          - en: I.
            ko: 글자 I
          - en: E.
            ko: 글자 E
          - en: J.
            ko: 글자 J
          - en: K.
            ko: 글자 K
        checkVocab: false
      - type: minimalPair
        words: ["E", "I"]
        answer: "I"
        why: '"아이"로 들리면 `I`, 처음부터 "이"만 길게 들리면 `E`예요.'
        item: sound.letter-i
      - type: minimalPair
        words: ["G", "J"]
        answer: "J"
        why: '둘은 첫소리가 같아요. "이"로 끝나면 `G`, "에이"로 끝나면 `J`예요.'
        item: sound.letter-j
      - type: listenChoose
        en: "K"
        item: sound.letter-k
        options:
          - en: "K"
            correct: true
          - en: "J"
            why: '`J`는 "제이"처럼 시작해요. "케이"처럼 시작하면 `K`예요.'
          - en: "A"
            why: '`A`는 첫소리 없이 "에이"만 내요. 앞에 "크" 같은 소리가 있으면 `K`예요.'
          - en: "H"
            why: '`H`는 "에이"로 시작해서 "치"로 끝나요. `K`는 "에이"로 끝나요.'
        checkVocab: false
      - type: explain
        text: |
          `L`과 `M`은 `F`처럼 짧은 "에"로 시작해요. 둘의 차이는 끝에서 입을 어떻게 닫느냐예요.

          `L`은 "에" 다음에 혀끝을 윗잇몸에 붙인 채 끝내요. `M`은 입술을 꼭 닫고 코로 소리를 내며 끝내요. 둘 다 끝에 "으"를 붙이지 않아요.
        examples:
          - en: L.
            ko: 글자 L
          - en: M.
            ko: 글자 M
        checkVocab: false
      - type: listenChoose
        en: "M"
        item: sound.letter-m
        options:
          - en: "M"
            correct: true
          - en: "L"
            why: '`L`은 끝에서 입술이 열려 있어요. 입술을 닫고 코로 끝나면 `M`이에요.'
          - en: "F"
            why: '`F`는 바람 소리로 끝나요. 코로 울리며 끝나면 `M`이에요.'
        checkVocab: false
      - type: chooseEnglish
        ko: 끝에서 혀끝이 윗잇몸에 붙는 글자
        item: sound.letter-l
        options:
          - en: "L"
            correct: true
          - en: "M"
            why: '`M`은 입술을 닫으며 끝나요. 혀끝을 붙이며 끝나면 `L`이에요.'
          - en: "F"
            why: '`F`는 윗니를 아랫입술에 대며 끝나요. 혀끝을 붙이며 끝나면 `L`이에요.'
        checkVocab: false
      - type: fillBlank
        en: I, J, ___, L, M.
        ko: 빈칸에 들어갈 글자를 써 보세요.
        answers: ["K", "k"]
        item: sound.letter-k
        checkVocab: false
      - type: shadow
        en: E, I, E, I.
        ko: E와 I를 번갈아 말해요.
        checkVocab: false
      - type: dictation
        en: M, I, L, K.
        ko: 우유라는 뜻의 milk를 한 글자씩 불렀어요.
        item: sound.letter-l
        checkVocab: false
