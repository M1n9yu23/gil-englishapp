id: unit.s1-15
title: { ko: 숫자 0부터 20까지, en: Numbers 0 to 20 }
lessons:
  - id: lesson.s1-15.1
    title: { ko: 0부터 5까지, en: 0 to 5 }
    goal: { ko: 0부터 5까지 듣고 말할 수 있어요, en: Hear and say 0 to 5 }
    introduces: [sense.zero.num.count, sense.one.num.count, sense.two.num.count, sense.three.num.count, sense.four.num.count, sense.five.num.count]
    steps:
      - type: listen
        en: One, two, three, four, five.
        ko: 하나, 둘, 셋, 넷, 다섯.
      - type: explain
        text: |
          이제 처음으로 단어를 배워요. 숫자는 하루에도 몇 번씩 듣는 말이라 먼저 익혀 두면 좋아요. 0은 `zero`예요. `z`는 벌이 붕붕거리는 소리로 시작해요.

          `one`은 철자와 소리가 많이 달라요. `o`로 쓰지만 소리는 `w`로 시작하는 `/wʌn/`이에요. `two`의 `w`는 소리 내지 않아요. 이 둘은 철자를 그냥 외워요.

          `three`는 앞에서 배운 `th`로 시작해요. 혀끝을 이 사이에 살짝 물고 바람을 내요. `five`는 끝의 `v`에서 윗니를 아랫입술에 댄 채 목을 울리고, 뒤에 "으"를 붙이지 않아요.
        examples:
          - en: Zero.
            ko: 영.
          - en: Three, four, five.
            ko: 셋, 넷, 다섯.
      - type: minimalPair
        words: [three, tree]
        answer: three
        why: "`three`는 혀끝을 이 사이에 두고 바람을 내는 `th`로 시작해요. `tree`(나무)는 혀끝이 윗잇몸에 닿는 `t`로 시작해요."
        item: sound.th-voiceless
      - type: chooseMeaning
        en: three
        item: sense.three.num.count
        options:
          - { ko: "3, 셋", correct: true }
          - { ko: 나무, why: "나무는 `tree`예요. `three`는 혀를 이 사이에 두는 `th`로 시작해요." }
          - { ko: "2, 둘", why: "2는 `two`예요. `three`의 `th`와 달리 `t` 하나로 시작해요." }
      - type: listenChoose
        en: Four.
        item: sense.four.num.count
        options:
          - { en: "4", correct: true }
          - { en: "5", why: "5는 `five`예요. \"아이\" 소리가 있고 끝이 `v`예요. `four`는 `f` 뒤에 `or` 소리예요." }
          - { en: "2", why: "2는 `two`예요. `t`로 시작해요. `four`는 윗니를 아랫입술에 대는 `f`로 시작해요." }
      - type: chooseEnglish
        ko: "5, 다섯"
        item: sense.five.num.count
        options:
          - { en: five, correct: true }
          - { en: four, why: "`four`는 4예요. 둘 다 `f`로 시작하지만 5는 \"아이\" 소리가 나는 `five`예요." }
          - { en: two, why: "`two`는 2예요. `five`는 윗니를 아랫입술에 대는 `f`로 시작해요." }
      - type: listenChoose
        en: Two, zero, five.
        item: sense.zero.num.count
        options:
          - { en: "2 0 5", correct: true }
          - { en: "2 5 0", why: "가운데가 0이에요. `zero`가 `five`보다 먼저 나왔어요." }
          - { en: "2 0 4", why: "마지막은 \"아이\" 소리가 나는 `five`예요. 4라면 `four`예요." }
      - type: fillBlank
        en: Three, two, ___.
        ko: 셋, 둘, 하나.
        answers: [one]
        item: sense.one.num.count
      - type: spell
        sense: sense.two.num.count
      - type: shadow
        en: Zero, one, two, three, four, five.
        ko: 영, 하나, 둘, 셋, 넷, 다섯.

  - id: lesson.s1-15.2
    title: { ko: 6부터 10까지, en: 6 to 10 }
    goal: { ko: 6부터 10까지 듣고 말할 수 있어요, en: Hear and say 6 to 10 }
    introduces: [sense.six.num.count, sense.seven.num.count, sense.eight.num.count, sense.nine.num.count, sense.ten.num.count]
    steps:
      - type: listen
        en: Six, seven, eight, nine, ten.
        ko: 여섯, 일곱, 여덟, 아홉, 열.
      - type: explain
        text: |
          `six`의 끝 `x`는 `ks` 소리예요. 끝에 "으"를 붙이지 말고 바람 소리로 끝내요.

          `seven`은 두 음절이고 앞을 세게 말해요. 가운데 `v`는 윗니를 아랫입술에 대고 목을 울리는 소리예요. 뒤 음절은 힘을 뺀 약한 "어"예요.

          `eight`는 철자가 길지만 소리는 짧아요. `gh`는 소리 내지 않아서 "에이" 뒤에 `t`만 살짝 붙여요. 철자는 그냥 외워요. `nine`과 `ten`은 혀끝을 윗잇몸에 붙인 `n`으로 끝나요.
        examples:
          - en: Six, seven.
            ko: 여섯, 일곱.
          - en: Eight, nine, ten.
            ko: 여덟, 아홉, 열.
      - type: listenChoose
        en: Seven.
        item: sense.seven.num.count
        options:
          - { en: "7", correct: true }
          - { en: "6", why: "6은 `six`예요. 한 음절이고 끝이 `ks`예요. 지금 들은 말은 두 음절이었어요." }
          - { en: "1", why: "1은 `one`이에요. 한 음절이고 `w` 소리로 시작해요." }
      - type: listenChoose
        en: Nine.
        item: sense.nine.num.count
        options:
          - { en: "9", correct: true }
          - { en: "5", why: "5는 `five`예요. `f`로 시작하고 `v`로 끝나요. `nine`은 `n`으로 시작해서 `n`으로 끝나요." }
          - { en: "1", why: "1은 `one`이에요. `w` 소리로 시작해요." }
      - type: chooseEnglish
        ko: "10, 열"
        item: sense.ten.num.count
        options:
          - { en: ten, correct: true }
          - { en: two, why: "`two`는 2예요. 둘 다 `t`로 시작하지만 10은 짧은 \"에\" 뒤에 `n`으로 끝나는 `ten`이에요." }
          - { en: seven, why: "`seven`은 7이에요. 철자가 `en`으로 끝나서 비슷해 보이지만 두 음절이에요. `ten`은 한 음절이에요." }
      - type: spell
        sense: sense.eight.num.count
      - type: arrange
        ko: 아홉, 여섯, 둘, 일곱.
        en: Nine, six, two, seven.
        extra: [ten]
        item: sense.six.num.count
      - type: dictation
        en: Three, six, nine.
        ko: 셋, 여섯, 아홉.
      - type: shadow
        en: Six, seven, eight, nine, ten.
        ko: 여섯, 일곱, 여덟, 아홉, 열.

  - id: lesson.s1-15.3
    title: { ko: 11부터 15까지, en: 11 to 15 }
    goal: { ko: 11부터 15까지 듣고 말할 수 있어요, en: Hear and say 11 to 15 }
    introduces: [sense.eleven.num.count, sense.twelve.num.count, sense.thirteen.num.count, sense.fourteen.num.count, sense.fifteen.num.count]
    steps:
      - type: listen
        en: Eleven, twelve, thirteen, fourteen, fifteen.
        ko: 열하나, 열둘, 열셋, 열넷, 열다섯.
      - type: explain
        text: |
          11과 12는 따로 외우는 이름이에요. `eleven`은 세 음절이고 가운데 `lev`를 세게 말해요. `twelve`는 `tw`를 한 번에 붙이고 끝은 `v`로 닫아요.

          13부터는 끝에 `teen`이 붙어요. 숫자 하나만 말할 때는 `teen`을 길고 세게 말해요. 이어 셀 때는 앞이 세게 들리기도 해요. 끝이 `n`으로 닫히는지도 함께 들어요. `fourteen`은 `four`에 `teen`을 붙인 그대로예요.

          11부터 15 사이에서는 철자가 바뀌는 숫자가 두 개 있어요. `three`는 `thir`로, `five`는 `fif`로 바뀌어서 `thirteen`, `fifteen`이 돼요. 18도 하나 바뀌는데 다음 과에서 봐요.
        examples:
          - en: Eleven, twelve.
            ko: 열하나, 열둘.
          - en: Thirteen, fourteen, fifteen.
            ko: 열셋, 열넷, 열다섯.
      - type: listenChoose
        en: Twelve.
        item: sense.twelve.num.count
        options:
          - { en: "12", correct: true }
          - { en: "11", why: "11은 `eleven`이에요. 세 음절이에요. 지금 들은 말은 한 음절이고 `v`로 끝났어요." }
          - { en: "2", why: "2는 `two`예요. `twelve`처럼 `tw`로 쓰지만 `l`과 `v` 소리가 없어요." }
      - type: listenChoose
        en: Thirteen.
        item: sense.thirteen.num.count
        options:
          - { en: "13", correct: true }
          - { en: "3", why: "3은 `three`예요. 한 음절이에요. 지금은 뒤에 길게 `teen`이 붙었어요." }
          - { en: "30", why: "30은 앞을 세게 말하고 끝이 짧아요. 지금은 뒤 `teen`이 길고 셌어요. 다음 단원에서 자세히 배워요." }
      - type: chooseMeaning
        en: fourteen
        item: sense.fourteen.num.count
        options:
          - { ko: "14, 열넷", correct: true }
          - { ko: "40, 마흔", why: "`teen`으로 끝나면 13부터 19 사이 숫자예요. 40은 `forty`예요." }
          - { ko: "4, 넷", why: "4는 `four`예요. 뒤에 `teen`이 붙어서 14가 됐어요." }
      - type: listenChoose
        en: Eleven.
        item: sense.eleven.num.count
        options:
          - { en: "11", correct: true }
          - { en: "7", why: "7은 `seven`이에요. 두 음절이고 앞을 세게 말해요. `eleven`은 세 음절이고 가운데가 세요." }
          - { en: "12", why: "12는 `twelve`예요. 한 음절이에요." }
      - type: spell
        sense: sense.fifteen.num.count
      - type: fillBlank
        en: Ten, eleven, ___.
        ko: 열, 열하나, 열둘.
        answers: [twelve]
        item: sense.twelve.num.count
      - type: dictation
        en: Three, thirteen, five, fifteen.
        ko: 셋, 열셋, 다섯, 열다섯.
      - type: shadow
        en: Thirteen, fourteen, fifteen.
        ko: 열셋, 열넷, 열다섯.

  - id: lesson.s1-15.4
    title: { ko: 16부터 20까지, en: 16 to 20 }
    goal: { ko: 16부터 20까지 듣고 말할 수 있어요, en: Hear and say 16 to 20 }
    introduces: [sense.sixteen.num.count, sense.seventeen.num.count, sense.eighteen.num.count, sense.nineteen.num.count, sense.twenty.num.count]
    steps:
      - type: listen
        en: Sixteen, seventeen, eighteen, nineteen, twenty.
        ko: 열여섯, 열일곱, 열여덟, 열아홉, 스물.
      - type: explain
        text: |
          16부터 19까지도 숫자 뒤에 `teen`을 붙여요. 숫자 하나만 말할 때는 `teen`을 세게 말해요. `six`, `seven`, `nine`은 철자 그대로 `sixteen`, `seventeen`, `nineteen`이 돼요.

          `eighteen`은 `t`를 하나만 써요. `eight`의 `t`와 `teen`의 `t`가 하나로 합쳐졌다고 생각하면 돼요. 소리도 `t` 한 번이에요.

          20은 `twenty`예요. `teen`과 달리 앞을 세게 말하고 끝 `ty`는 짧아요. 미국 사람이 빨리 말하면 가운데 `t`가 약해져서 "트웨니"처럼 들리기도 해요.
        examples:
          - en: Sixteen, seventeen.
            ko: 열여섯, 열일곱.
          - en: Eighteen, nineteen, twenty.
            ko: 열여덟, 열아홉, 스물.
      - type: listenChoose
        en: Seventeen.
        item: sense.seventeen.num.count
        options:
          - { en: "17", correct: true }
          - { en: "7", why: "7은 `seven`이에요. 지금은 뒤에 길게 `teen`이 붙었어요." }
          - { en: "70", why: "70은 앞을 세게 말하고 끝이 짧은 \"티\"예요. 지금은 뒤 `teen`이 길고 셌어요." }
      - type: listenChoose
        en: Twenty.
        item: sense.twenty.num.count
        options:
          - { en: "20", correct: true }
          - { en: "12", why: "12는 `twelve`예요. 한 음절이고 `v`로 끝나요. `twenty`는 두 음절이고 끝이 짧은 \"티\"예요." }
          - { en: "2", why: "2는 `two`예요. 한 음절이에요." }
      - type: chooseMeaning
        en: nineteen
        item: sense.nineteen.num.count
        options:
          - { ko: "19, 열아홉", correct: true }
          - { ko: "90, 아흔", why: "`teen`으로 끝나면 13부터 19 사이 숫자예요. 90은 `ninety`예요." }
          - { ko: "9, 아홉", why: "9는 `nine`이에요. 뒤에 `teen`이 붙어서 19가 됐어요." }
      - type: listenChoose
        en: Six, sixteen.
        item: sense.sixteen.num.count
        options:
          - { en: "6 16", correct: true }
          - { en: "16 6", why: "먼저 짧은 `six`, 다음에 `teen`이 붙은 `sixteen`이 나왔어요." }
          - { en: "6 60", why: "두 번째는 `n`으로 닫히는 `teen`이었어요. 60이라면 끝이 짧은 `ty`로 끝나요." }
      - type: spell
        sense: sense.eighteen.num.count
      - type: fillBlank
        en: Eighteen, nineteen, ___.
        ko: 열여덟, 열아홉, 스물.
        answers: [twenty]
        item: sense.twenty.num.count
      - type: dictation
        en: Two, twelve, twenty.
        ko: 둘, 열둘, 스물.
      - type: shadow
        en: Sixteen, seventeen, eighteen, nineteen, twenty.
        ko: 열여섯, 열일곱, 열여덟, 열아홉, 스물.
