id: unit.s1-03
title: { ko: 대문자와 소문자, en: Capital and small letters }
lessons:
  - id: lesson.s1-03.1
    title: { ko: 대문자와 소문자 짝, en: Matching pairs }
    goal: { ko: 대문자와 소문자를 짝지을 수 있어요, en: Match capital and small letters }
    introduces: []
    steps:
      - type: listen
        en: G, g, R, r, H, h.
        ko: 대문자와 소문자 짝 세 개예요.
        checkVocab: false
      - type: explain
        text: |
          영어 글자는 대문자와 소문자 두 벌이 있어요. 모양은 달라도 이름은 같아요. `G`와 `g`는 둘 다 같은 이름으로 불러요.

          `C c`, `O o`, `S s`, `X x`, `Z z`처럼 크기만 다른 짝이 많아요. 이런 짝은 따로 외우지 않아도 돼요.

          모양이 많이 다른 짝만 따로 익히면 돼요. `A a`, `B b`, `D d`, `E e`, `F f`, `G g`, `H h`, `L l`, `M m`, `N n`, `Q q`, `R r`, `T t` 같은 짝이 그래요.

          글꼴에 따라 `a`와 `g`는 모양이 조금씩 달라 보여요.
        examples:
          - en: G, g.
            ko: 대문자 G와 소문자 g의 이름은 같아요.
        checkVocab: false
      - type: chooseEnglish
        ko: 대문자 `A`의 소문자
        item: sound.letter-a
        options:
          - en: "a"
            correct: true
          - en: "e"
            why: '`e`는 `E`의 소문자예요.'
          - en: "d"
            why: '`d`는 `D`의 소문자예요. 위로 긴 막대가 있어요.'
        checkVocab: false
      - type: listenChoose
        en: "G"
        item: sound.letter-g
        options:
          - en: "g"
            correct: true
          - en: "q"
            why: '`q`는 `Q`(큐)의 소문자예요. 아래로 내려가는 막대가 곧아요.'
          - en: "j"
            why: '`j`는 `J`(제이)의 소문자예요. 위에 점이 있어요.'
        checkVocab: false
      - type: chooseEnglish
        ko: 소문자 `r`의 대문자
        item: sound.letter-r
        options:
          - en: "R"
            correct: true
          - en: "P"
            why: '`P`의 소문자는 `p`예요. 막대가 아래로 내려가요.'
          - en: "N"
            why: '`N`의 소문자는 `n`이에요. `r`은 `n`에서 오른쪽 기둥이 빠진 모양이에요.'
        checkVocab: false
      - type: chooseEnglish
        ko: 소문자 `h`의 대문자
        item: sound.letter-h
        options:
          - en: "H"
            correct: true
          - en: "N"
            why: '`N`의 소문자 `n`은 기둥이 짧아요. `h`는 왼쪽 기둥이 위로 길어요.'
          - en: "K"
            why: '`K`의 소문자 `k`도 기둥이 길지만 오른쪽이 꺾쇠 모양이에요.'
        checkVocab: false
      - type: explain
        text: |
          가장 헷갈리는 것은 소문자 `l`과 대문자 `I`예요. 글꼴에 따라 둘 다 세로 막대 하나로 보여요.

          짝을 기억해 두면 구별하기 쉬워요. 소문자 `l`의 짝은 대문자 `L`이에요. 대문자 `I`의 짝은 위에 점이 있는 소문자 `i`예요.
        examples:
          - en: L, l.
            ko: 대문자 L과 소문자 l
          - en: I, i.
            ko: 대문자 I와 소문자 i
        checkVocab: false
      - type: chooseEnglish
        ko: 대문자 `I`의 소문자
        item: sound.letter-i
        options:
          - en: "i"
            correct: true
          - en: "l"
            why: '`l`은 `L`의 소문자예요. `I`의 짝은 위에 점이 있는 `i`예요.'
          - en: "j"
            why: '`j`도 점이 있지만 아래로 꼬리가 휘어요. `J`의 소문자예요.'
        checkVocab: false
      - type: listenChoose
        en: "E"
        item: sound.letter-e
        options:
          - en: "e"
            correct: true
          - en: "i"
            why: '`i`는 `I`(아이)의 소문자예요. "이"로 들리면 `E`, 곧 `e`예요.'
          - en: "a"
            why: '`a`는 `A`(에이)의 소문자예요. "이"로 들리면 `e`예요.'
        checkVocab: false
      - type: listenChoose
        en: "N"
        item: sound.letter-n
        options:
          - en: "n"
            correct: true
          - en: "m"
            why: '`m`은 `M`의 소문자예요. 봉우리가 두 개예요.'
          - en: "h"
            why: '`h`는 `H`의 소문자예요. 왼쪽 기둥이 위로 길어요.'
        checkVocab: false
      - type: fillBlank
        en: G, g, H, h, Q, ___.
        ko: 대문자 다음에 그 짝인 소문자를 써요.
        answers: ["q"]
        item: sound.letter-q
        checkVocab: false

  - id: lesson.s1-03.2
    title: { ko: "b와 d, p와 q", en: "b and d, p and q" }
    goal: { ko: 모양이 헷갈리는 소문자를 구별할 수 있어요, en: Tell apart small letters that look alike }
    introduces: []
    steps:
      - type: listen
        en: B, b, D, d, P, p, Q, q.
        ko: 모양이 헷갈리는 소문자 넷과 그 대문자예요.
        checkVocab: false
      - type: explain
        text: |
          소문자 `b`와 `d`는 거울에 비친 것처럼 서로 반대 모양이에요. 처음 배울 때 누구나 헷갈려요. 모양을 통째로 외우기보다 기준을 하나씩 잡아 두면 편해요.

          `b`는 대문자 `B`에서 위쪽 둥근 부분을 뗀 모양이에요. 막대가 왼쪽, 둥근 배가 오른쪽에 있어요. `d`는 `c`를 먼저 쓰고 오른쪽에 막대를 세운 모양이에요. 알파벳 순서도 `c` 다음이 `d`예요.

          `bed`(침대)를 써 보면 `b`와 `d`가 양쪽 끝에서 침대 머리판처럼 마주 봐요.
        examples:
          - en: B, E, D.
            ko: 침대라는 뜻의 bed를 한 글자씩 불렀어요.
        checkVocab: false
      - type: chooseEnglish
        ko: 대문자 `B`의 소문자
        item: sound.letter-b
        options:
          - en: "b"
            correct: true
          - en: "d"
            why: '`d`는 둥근 부분이 막대 왼쪽에 있어요. `B`에서 위를 떼면 둥근 부분이 오른쪽에 남아요.'
          - en: "p"
            why: '`p`는 막대가 아래로 내려가요. `P`의 소문자예요.'
        checkVocab: false
      - type: listenChoose
        en: "D"
        item: sound.letter-d
        options:
          - en: "d"
            correct: true
          - en: "b"
            why: '`b`는 막대가 왼쪽에 있어요. `c`에 막대를 붙인 모양이 `d`예요.'
          - en: "q"
            why: '`q`는 막대가 아래로 내려가요. `d`는 막대가 위로 올라가요.'
        checkVocab: false
      - type: fillBlank
        en: B, b, D, ___.
        ko: 대문자 다음에 그 짝인 소문자를 써요.
        answers: ["d"]
        item: sound.letter-d
        checkVocab: false
      - type: explain
        text: |
          `p`와 `q`도 거울 짝이에요. 둘 다 둥근 부분은 위에 있고 막대는 아래로 내려가요.

          `p`는 대문자 `P`를 그대로 아래로 내린 모양이에요. `q`는 막대가 오른쪽에 있고, 단어에서는 거의 늘 뒤에 `u`가 붙어 `qu`로 나와요.
        examples:
          - en: P, Q.
            ko: 글자 P와 Q
        checkVocab: false
      - type: listenChoose
        en: "Q"
        item: sound.letter-q
        options:
          - en: "q"
            correct: true
          - en: "p"
            why: '`p`는 막대가 왼쪽에 있어요. `P`의 소문자예요.'
          - en: "g"
            why: '`g`는 `G`의 소문자예요. 아래쪽이 고리처럼 휘어요.'
        checkVocab: false
      - type: chooseEnglish
        ko: 대문자 `P`의 소문자
        item: sound.letter-p
        options:
          - en: "p"
            correct: true
          - en: "q"
            why: '`q`는 막대가 오른쪽에 있어요. `P`를 아래로 내리면 막대가 왼쪽인 `p`가 돼요.'
          - en: "b"
            why: '`b`는 막대가 위로 올라가요. `B`의 소문자예요.'
        checkVocab: false
      - type: fillBlank
        en: P, p, Q, ___.
        ko: 대문자 다음에 그 짝인 소문자를 써요.
        answers: ["q"]
        item: sound.letter-q
        checkVocab: false
      - type: explain
        text: |
          `n`과 `m`은 위가 둥근 봉우리 모양이에요. `n`은 봉우리가 하나, `m`은 둘이에요.

          `u`는 `n`을 위아래로 뒤집은 모양이라 아래가 둥글어요. `w`는 `m`을 뒤집은 것과 비슷하지만 아래가 뾰족한 골짜기 두 개예요.
        examples:
          - en: N, U.
            ko: 글자 N과 U
          - en: M, W.
            ko: 글자 M과 W
        checkVocab: false
      - type: listenChoose
        en: "U"
        item: sound.letter-u
        options:
          - en: "u"
            correct: true
          - en: "n"
            why: '`n`은 위가 둥근 봉우리예요. `u`는 아래가 둥글어요.'
          - en: "v"
            why: '`v`는 `V`의 소문자예요. 아래가 뾰족해요.'
        checkVocab: false
      - type: chooseEnglish
        ko: 대문자 `M`의 소문자
        item: sound.letter-m
        options:
          - en: "m"
            correct: true
          - en: "w"
            why: '`w`는 `W`의 소문자예요. 아래가 뾰족한 골짜기 모양이에요.'
          - en: "n"
            why: '`n`은 봉우리가 하나예요. `m`은 둘이에요.'
        checkVocab: false
      - type: listenChoose
        en: "W"
        item: sound.letter-w
        options:
          - en: "w"
            correct: true
          - en: "m"
            why: '`m`은 `M`의 소문자예요. 위가 둥근 봉우리 두 개예요.'
          - en: "v"
            why: '`v`는 골짜기가 하나예요. `w`는 둘이에요.'
        checkVocab: false
      - type: dictation
        en: Q, U, I, Z.
        ko: 퀴즈라는 뜻의 quiz를 한 글자씩 불렀어요.
        item: sound.letter-q
        checkVocab: false

  - id: lesson.s1-03.3
    title: { ko: 철자 말하기, en: Spelling out loud }
    goal: { ko: 한 글자씩 불러 주는 철자를 듣고 쓸 수 있어요, en: Write a word spelled out letter by letter }
    introduces: []
    steps:
      - type: listen
        en: How do you spell that?
        ko: 철자가 어떻게 돼요?
        checkVocab: false
      - type: explain
        text: |
          이름이나 이메일 주소를 말하면 상대가 `How do you spell that?`이라고 자주 되물어요. 그러면 글자 이름을 하나씩 불러 주면 돼요.

          한국 이름은 로마자로 적는 방법이 여러 가지예요. 같은 "준"도 `Jun`이라고 쓰는 사람이 있고 `Joon`이라고 쓰는 사람이 있어요. 그래서 내 이름 철자를 불러 줄 일이 생각보다 많아요.
        examples:
          - en: J, U, N.
            ko: 준을 Jun으로 쓸 때의 철자예요.
          - en: J, O, O, N.
            ko: 준을 Joon으로 쓸 때의 철자예요.
        checkVocab: false
      - type: listenChoose
        en: K, I, M
        item: sound.letter-m
        options:
          - en: Kim
            correct: true
          - en: Kin
            why: '마지막 글자는 입술을 닫으며 끝나는 `M`이었어요. `N`은 입술이 열려 있어요.'
          - en: Kem
            why: '가운데 글자는 "아이"로 들렸으니 `I`예요. `E`는 "이"예요.'
        checkVocab: false
      - type: listenChoose
        en: L, E, E
        item: sound.letter-l
        options:
          - en: Lee
            correct: true
          - en: Rhee
            why: '`R`은 "아"로 시작해요. 첫 글자는 "에"로 시작하는 `L`이었어요.'
          - en: Yi
            why: '`Y`는 "와이"예요. 첫 글자는 "에"로 시작해 혀끝을 붙이는 `L`이었어요.'
        checkVocab: false
      - type: explain
        text: |
          `B`, `D`, `P`, `T`, `V`처럼 "이"로 끝나는 글자는 전화로 들으면 서로 비슷해요. 그래서 원어민도 `B as in boy`처럼 그 글자로 시작하는 단어를 붙여 말하곤 해요.

          같은 글자가 두 번 이어지면 그냥 두 번 부르거나 앞에 `double`을 붙여요. `Joon`은 `J, O, O, N`이라고도 하고 `J, double O, N`이라고도 해요.
        examples:
          - en: B as in boy.
            ko: boy라는 단어의 B라고 알려 주는 말이에요.
          - en: J, double O, N.
            ko: Joon의 철자예요.
        checkVocab: false
      - type: listenChoose
        en: J, double O, N
        item: sound.letter-o
        options:
          - en: Joon
            correct: true
          - en: Jon
            why: '`double O`는 `O`가 두 개라는 뜻이에요.'
          - en: Jun
            why: '가운데는 "유"로 들리는 `U`가 아니라 "오우"로 들리는 `O` 두 개였어요.'
        checkVocab: false
      - type: listenChoose
        en: B, E, N
        item: sound.letter-b
        options:
          - en: Ben
            correct: true
          - en: Den
            why: '첫 글자는 입술로 시작하는 `B`였어요. `D`는 혀끝으로 시작해요.'
          - en: Pen
            why: '`P`는 입술을 뗄 때 바람이 훅 나와요. 들린 것은 바람이 약한 `B`였어요.'
        checkVocab: false
      - type: dialogue
        lines:
          - speaker: Ana
            en: What's your name?
            ko: 이름이 뭐예요?
          - speaker: Leo
            en: Leo.
            ko: 레오예요.
          - speaker: Ana
            en: How do you spell that?
            ko: 철자가 어떻게 돼요?
        question: 레오는 뭐라고 대답할까요?
        options:
          - en: L, E, O.
            correct: true
          - en: L, I, O.
            why: '`Leo`의 둘째 글자는 `E`예요. `I`는 "아이"라고 불러요.'
          - en: Leo.
            why: '이름을 한 번 더 말했어요. 철자를 물었으니 글자를 하나씩 불러 줘요.'
        item: sound.letter-e
        checkVocab: false
      - type: shadow
        en: How do you spell that?
        ko: 철자가 어떻게 돼요?
        checkVocab: false
      - type: dictation
        en: C, H, O, I.
        ko: 성 "최"를 로마자로 쓴 철자예요.
        item: sound.letter-h
        checkVocab: false
      - type: dictation
        en: S, M, I, T, H.
        ko: 영어권에서 흔한 성 스미스의 철자예요.
        item: sound.letter-t
        checkVocab: false
