id: unit.s1-05
title: { ko: "자음 소리 2: t, d, n, l, r", en: "Consonants 2: t, d, n, l, r" }
lessons:
  - id: lesson.s1-05.1
    title: { ko: "t, d, n", en: "t, d, n" }
    goal: { ko: "t, d, n 소리를 듣고 구별할 수 있어요", en: "Hear the difference between t, d and n" }
    introduces: [sound.t, sound.d, sound.n]
    steps:
      - type: listen
        en: Ten.
        ko: 열(10).
        checkVocab: false
      - type: listen
        en: Dog.
        ko: 개.
        checkVocab: false
      - type: explain
        text: |
          `ten`, `dog`, `net`을 들어 보세요. `t`, `d`, `n`은 모두 혀끝을 윗니 바로 뒤 잇몸에 댔다가 떼면서 내요.

          `t`는 `p`처럼 혀를 뗄 때 바람이 세게 터져요. 단어 첫머리에서 그래요. `d`는 `b`처럼 바람이 약해요. 앞 단원에서 `p`와 `b`를 구별한 방법을 그대로 쓰면 돼요.

          `n`은 혀끝을 붙인 채 코로 소리를 내요. 우리말 "나"의 첫소리와 거의 같아요.

          단어 끝의 `t`, `p`, `k`는 혀나 입술을 붙인 채 멈추기만 하고 바람을 거의 내지 않을 때가 많아요. `net`, `not`의 끝이 그래요.

          미국 영어에서는 `water`처럼 모음 사이의 `t`가 약하게 굴러서 우리말 "라"의 첫소리처럼 들릴 때가 많아요. 지금은 알아 두기만 하면 돼요.
        examples:
          - { en: Ten., ko: 열(10). }
          - { en: Dog., ko: 개. }
          - { en: Net., ko: 그물. }
        checkVocab: false
      - type: minimalPair
        words: [ten, den]
        answer: den
        item: sound.d
        why: "들린 단어는 `den`(굴)이에요. 바람이 약하고 부드럽게 시작하면 `d`예요. `ten`은 혀를 뗄 때 바람이 확 터져요."
      - type: minimalPair
        words: [tip, dip]
        answer: tip
        item: sound.t
        why: "들린 단어는 `tip`(끝, 팁)이에요. 바람이 세게 터지면 `t`예요. `dip`(살짝 담그다)의 `d`는 바람이 약해요."
      - type: listenChoose
        en: town
        item: sound.t
        options:
          - { en: town, correct: true }
          - { en: down, why: "`down`의 `d`는 바람이 약해요. 들은 소리는 바람이 세게 터지는 `t`였어요." }
        checkVocab: false
      - type: listenChoose
        en: nap
        item: sound.n
        options:
          - { en: "n", correct: true }
          - { en: d, why: "`d`였다면 혀를 뗄 때 입에서 한 번 터져요. 들은 소리는 코로 울렸어요." }
          - { en: t, why: "`t`였다면 바람이 세게 터져요. 들은 소리는 코로 울리는 `n`이었어요." }
        checkVocab: false
      - type: dictation
        en: Ten.
        ko: 열(10).
        checkVocab: false
      - type: dictation
        en: Net.
        ko: 그물.
        checkVocab: false
      - type: shadow
        en: Not now.
        ko: 지금은 안 돼요.
        checkVocab: false
      - type: shadow
        en: Good dog.
        ko: 옳지, 착하다.
        checkVocab: false
  - id: lesson.s1-05.2
    title: { ko: l과 r, en: l and r }
    goal: { ko: l과 r 소리를 낼 수 있어요, en: Make the l and r sounds }
    introduces: [sound.l, sound.r]
    steps:
      - type: listen
        en: Leg.
        ko: 다리.
        checkVocab: false
      - type: listen
        en: Red.
        ko: 빨간색.
        checkVocab: false
      - type: explain
        text: |
          `leg`와 `red`를 들어 보세요. 우리말로는 둘 다 "레"로 시작하게 적지만 영어에서 `l`과 `r`은 전혀 다른 소리예요. 차이는 혀끝이 닿느냐에 있어요.

          `l`은 혀끝을 윗니 뒤 잇몸에 꼭 붙이고 소리 내요. 소리는 혀 양옆으로 흘러나와요. 단어 끝의 `l`도 혀끝이 닿은 채로 끝내요.

          `r`은 혀끝이 어디에도 닿지 않아요. 혀를 뒤로 살짝 당기고 입술을 조금 둥글게 내밀어요. 우리말 "라"처럼 혀끝으로 윗잇몸을 톡 치면 안 돼요.

          처음에는 천천히 길게 내요. `l`은 혀끝이 닿는지, `r`은 닿지 않는지만 확인하면 돼요.
        examples:
          - { en: Leg., ko: 다리. }
          - { en: Lip., ko: 입술. }
          - { en: Red., ko: 빨간색. }
          - { en: Run., ko: 뛰어요. }
        checkVocab: false
      - type: minimalPair
        words: [lip, rip]
        answer: lip
        item: sound.l
        why: "들린 단어는 `lip`(입술)이에요. 맑고 또렷하게 시작하면 `l`이에요. `rip`(찢다)은 혀를 뒤로 당기고 입술을 둥글게 내밀며 시작해요."
      - type: listenChoose
        en: run
        item: sound.r
        options:
          - { en: r, correct: true }
          - { en: l, why: "`l`이었다면 혀끝이 잇몸에 닿아요. 들은 소리는 혀끝이 닿지 않는 `r`이었어요." }
        checkVocab: false
      - type: shadow
        en: Leg.
        ko: 다리.
        checkVocab: false
      - type: shadow
        en: Really?
        ko: 정말요?
        checkVocab: false
      - type: shadow
        en: Let's run.
        ko: 같이 뛰어요.
        checkVocab: false
      - type: dictation
        en: Red.
        ko: 빨간색.
        checkVocab: false
      - type: dictation
        en: Lip.
        ko: 입술.
        checkVocab: false
  - id: lesson.s1-05.3
    title: { ko: r과 l 구별, en: r or l }
    goal: { ko: light와 right처럼 r과 l을 듣고 구별할 수 있어요, en: Tell light from right }
    introduces: []
    steps:
      - type: listen
        en: "Light, right."
        ko: "빛, 오른쪽."
        checkVocab: false
      - type: explain
        text: |
          `light`와 `right`는 첫소리만 달라요. 우리말로 적으면 둘 다 "라이트"라서 글자로는 구별이 안 돼요.

          귀로 들을 때는 시작을 들어요. `l`은 맑고 또렷하게 시작해요. `r`은 입술을 둥글게 내밀고 시작해서 "우"가 살짝 섞인 듯 둥글게 들릴 때가 많아요.

          처음에는 반쯤 틀려도 괜찮아요. 듣는 횟수가 쌓이면 차이가 들리기 시작해요.
        examples:
          - { en: Light., ko: 빛. }
          - { en: Right., ko: 오른쪽. }
        checkVocab: false
      - type: minimalPair
        words: [light, right]
        answer: right
        item: sound.r
        why: "들린 단어는 `right`(오른쪽)예요. 둥글고 어둡게 시작하면 `r`이에요. `light`(빛)는 혀끝이 닿아서 맑게 시작해요."
      - type: minimalPair
        words: [lock, rock]
        answer: lock
        item: sound.l
        why: "들린 단어는 `lock`(자물쇠)이에요. 혀끝이 닿아 맑게 시작하면 `l`이에요. `rock`(바위)은 둥글게 시작해요."
      - type: minimalPair
        words: [long, wrong]
        answer: wrong
        item: sound.r
        why: "들린 단어는 `wrong`(틀린)이에요. `wr`의 `w`는 소리 나지 않고 `r` 소리로 시작해요. `long`(긴)은 혀끝이 닿는 `l`이에요."
      - type: minimalPair
        words: [low, row]
        answer: low
        item: sound.l
        why: "들린 단어는 `low`(낮은)예요. 맑게 시작하면 `l`이에요. `row`(줄)는 입술을 둥글게 내밀고 시작해요."
      - type: listenChoose
        en: road
        item: sound.r
        options:
          - { en: road, correct: true }
          - { en: load, why: "`load`(짐)는 혀끝이 닿는 `l`로 시작해요. 들은 소리는 둥글게 시작하는 `r`이었어요." }
        checkVocab: false
      - type: listenChoose
        en: collect
        item: sound.l
        options:
          - { en: collect, correct: true }
          - { en: correct, why: "`correct`(맞는)는 가운데가 `r`이라 혀끝이 닿지 않아요. 들은 소리는 혀끝이 닿는 `l`이었어요." }
        checkVocab: false
      - type: dictation
        en: Run.
        ko: 뛰어요.
        checkVocab: false
      - type: dictation
        en: Leg.
        ko: 다리.
        checkVocab: false
      - type: shadow
        en: "Lock, rock."
        ko: "자물쇠, 바위."
        checkVocab: false
      - type: shadow
        en: All right.
        ko: 알겠어요.
        checkVocab: false
