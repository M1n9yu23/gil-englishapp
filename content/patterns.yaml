# Chunks such as "I'd like ~". The format is described in docs/content.md.

# Greetings (s1-19)
- id: pattern.thank-you
  text: Thank you.
  ko: 고마워요
  note: "`Thanks`보다 조금 더 정중해요. 가게나 식당에서 누구에게나 써요."
  examples:
    - en: Thank you, @Mina.
      ko: 고마워요, 미나 씨.
- id: pattern.youre-welcome
  text: You're welcome.
  ko: 별말씀을요, 천만에요
  note: "`Thank you`에 대한 대답이에요. `welcome`이 들어 있지만 환영한다는 뜻이 아니에요."
  examples:
    - en: You're welcome.
      ko: 별말씀을요.
- id: pattern.how-are-you
  text: How are you?
  ko: 잘 지내요?
  note: 정말 안부를 묻기보다 인사에 가까워요. 짧게 대답하고 되물으면 돼요.
  examples:
    - en: Hi, @Jun. How are you?
      ko: 안녕하세요, 준 씨. 잘 지내요?

# Names and first meetings (a1-01)
- id: pattern.whats-your-name
  text: What's your name?
  ko: 이름이 뭐예요?
  note: "`What's`는 `What is`를 줄인 말이에요. 처음 만난 사람에게 물을 때는 앞에 `Hi`를 붙이면 부드러워요."
  examples:
    - en: Hi. What's your name?
      ko: 안녕하세요. 이름이 뭐예요?
- id: pattern.call-me
  text: Call me ~.
  ko: ~라고 불러 주세요
  note: "이름이 길거나 발음하기 어려울 때 짧게 부를 이름을 알려 줘요."
  examples:
    - en: I'm @Minjun. Call me @Jun.
      ko: 저는 민준이에요. 준이라고 불러 주세요.
- id: pattern.nice-to-meet-you
  text: Nice to meet you.
  ko: 만나서 반가워요
  note: "처음 만났을 때만 써요. 대답은 `Nice to meet you, too`예요."
  examples:
    - en: Nice to meet you, @Leo.
      ko: 만나서 반가워요, 레오 씨.
- id: pattern.excuse-me
  text: Excuse me.
  ko: 저기요, 잠시만요
  note: "모르는 사람에게 말을 걸 때나 지나가야 할 때 써요. 잘못을 사과할 때는 `Sorry`예요."
  examples:
    - en: Excuse me. Are you @Sam?
      ko: 저기요, 샘 씨예요?
- id: pattern.see-you
  text: See you.
  ko: 또 봐요
  note: "뒤에 때를 붙여 `See you later.`, `See you tomorrow`처럼 말해요."
  examples:
    - en: Bye. See you.
      ko: 잘 가요. 또 봐요.

# Agreeing (a1-02)
- id: pattern.me-too
  text: Me too.
  ko: 저도요
  note: "상대가 `I'm hungry`라고 하면 `Me too`로 맞장구쳐요. 친한 사이에서도 윗사람에게도 써요."
  examples:
    - en: Me too.
      ko: 저도요.
- id: pattern.me-neither
  text: Me neither.
  ko: 저도요(not이 든 말에), 저도 안 그래요
  note: "상대가 `I'm not hungry`처럼 `not`이 든 말을 하면 `Me too`가 아니라 `Me neither`로 맞장구쳐요."
  examples:
    - en: Me neither.
      ko: 저도요.

# Languages (a1-03)
- id: pattern.a-little
  text: a little
  ko: 조금, 약간
  examples:
    - en: I speak a little English.
      ko: 저는 영어를 조금 해요.

# Jobs (a1-05)
- id: pattern.what-do-you-do
  text: What do you do?
  ko: 무슨 일 하세요?
  note: "직업을 묻는 말이에요. 지금 무엇을 하고 있는지 묻는 말이 아니에요. 통째로 외워 두면 돼요."
  examples:
    - en: What do you do, @Mina?
      ko: 미나 씨는 무슨 일 하세요?

# Pointing (a1-06)
- id: pattern.over-there
  text: over there
  ko: 저기, 저쪽에
  note: "손으로 가리키며 \"저기\"라고 할 때는 `there`만 쓰기보다 `over there`라고 할 때가 많아요."
  examples:
    - en: It's over there.
      ko: 저기 있어요.

# Age and contact details (a1-10)
- id: pattern.how-old
  text: How old ~?
  ko: ~는 몇 살이에요?
  note: "사람뿐 아니라 물건의 나이도 `How old is your car?`처럼 물어요."
  examples:
    - en: "How {old|sense.old.adj.age} is your son?"
      ko: 아드님은 몇 살이에요?
- id: pattern.how-do-you-spell
  text: How do you spell ~?
  ko: ~ 철자가 어떻게 돼요?
  note: "통째로 외워 두면 돼요. 이름이나 이메일을 받아 적을 때 자주 써요."
  examples:
    - en: How do you spell that?
      ko: 철자가 어떻게 돼요?

# Inflections. course.yaml gates each kind of form on one of these.
- id: pattern.plural-s
  text: ~s
  ko: 둘 이상을 말할 때(복수)
  level: a1
  examples:
    - en: "[The cats]{who} [are]{do} [small]{what}."
      ko: 고양이들이 작아요.
      literal: 고양이들은 / ~이다 / 작은
- id: pattern.possessive-s
  text: ~'s
  ko: ~의(소유)
  level: a1
  examples:
    - en: "[This]{who} [is]{do} [@Mina's book]{what}."
      ko: 이건 미나 씨 책이에요.
      literal: 이것은 / ~이다 / 미나의 책
- id: pattern.third-person-s
  text: He ~s
  ko: 그 사람이 하는 일(3인칭 단수 현재)
  level: a1
  examples:
    - en: She plays tennis.
      ko: 그녀는 테니스를 쳐요.
- id: pattern.present-continuous
  text: be ~ing
  ko: 지금 하고 있는 일
  level: a1
  examples:
    - en: I'm reading a book.
      ko: 저는 책을 읽고 있어요.
- id: pattern.past-simple
  text: ~ed
  ko: 지난 일(과거)
  level: a2
  examples:
    - en: I walked to school.
      ko: 저는 학교에 걸어갔어요.
- id: pattern.present-perfect
  text: have ~ed
  ko: 지금까지 해 본 일, 막 끝난 일(현재완료)
  level: a2
  examples:
    - en: I have finished my homework.
      ko: 숙제를 다 했어요.
- id: pattern.comparative
  text: ~er than
  ko: ~보다 더 ~한(비교급)
  level: a2
  examples:
    - en: The dog is bigger than the cat.
      ko: 개가 고양이보다 커요.
- id: pattern.superlative
  text: the ~est
  ko: 가장 ~한(최상급)
  level: a2
  examples:
    - en: This is the biggest room.
      ko: 여기가 가장 큰 방이에요.
