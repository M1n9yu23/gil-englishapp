# Chunks such as "I'd like ~". The format is described in docs/content.md.

# Greetings (s1-19)
- id: pattern.thank-you
  text: Thank you.
  ko: 고마워요
  note: "`Thanks`보다 조금 더 정중해요. 가게나 식당에서 누구에게나 써요."
  examples:
    - en: Thank you, @Mina.
      ko: 고마워요, 미나 씨.
- id: pattern.youre-welcome
  text: You're welcome.
  ko: 별말씀을요, 천만에요
  note: "`Thank you`에 대한 대답이에요. `welcome`이 들어 있지만 환영한다는 뜻이 아니에요."
  examples:
    - en: You're welcome.
      ko: 별말씀을요.
- id: pattern.how-are-you
  text: How are you?
  ko: 잘 지내요?
  note: 정말 안부를 묻기보다 인사에 가까워요. 짧게 대답하고 되물으면 돼요.
  examples:
    - en: Hi, @Jun. How are you?
      ko: 안녕하세요, 준 씨. 잘 지내요?

# Names and first meetings (a1-01)
- id: pattern.whats-your-name
  text: What's your name?
  ko: 이름이 뭐예요?
  note: "`What's`는 `What is`를 줄인 말이에요. 처음 만난 사람에게 물을 때는 앞에 `Hi`를 붙이면 부드러워요."
  examples:
    - en: Hi. What's your name?
      ko: 안녕하세요. 이름이 뭐예요?
- id: pattern.call-me
  text: Call me ~.
  ko: ~라고 불러 주세요
  note: "이름이 길거나 발음하기 어려울 때 짧게 부를 이름을 알려 줘요."
  examples:
    - en: I'm @Minjun. Call me @Jun.
      ko: 저는 민준이에요. 준이라고 불러 주세요.
- id: pattern.nice-to-meet-you
  text: Nice to meet you.
  ko: 만나서 반가워요
  note: "처음 만났을 때만 써요. 대답은 `Nice to meet you, too`예요."
  examples:
    - en: Nice to meet you, @Leo.
      ko: 만나서 반가워요, 레오 씨.
- id: pattern.excuse-me
  text: Excuse me.
  ko: 저기요, 잠시만요
  note: "모르는 사람에게 말을 걸 때나 지나가야 할 때 써요. 잘못을 사과할 때는 `Sorry`예요."
  examples:
    - en: Excuse me. Are you @Sam?
      ko: 저기요, 샘 씨예요?
- id: pattern.see-you
  text: See you.
  ko: 또 봐요
  note: "뒤에 때를 붙여 `See you later.`, `See you tomorrow`처럼 말해요."
  examples:
    - en: Bye. See you.
      ko: 잘 가요. 또 봐요.

# Agreeing (a1-02)
- id: pattern.me-too
  text: Me too.
  ko: 저도요
  note: "상대가 `I'm hungry`라고 하면 `Me too`로 맞장구쳐요. 친한 사이에서도 윗사람에게도 써요."
  examples:
    - en: Me too.
      ko: 저도요.
- id: pattern.me-neither
  text: Me neither.
  ko: 저도요(not이 든 말에), 저도 안 그래요
  note: "상대가 `I'm not hungry`처럼 `not`이 든 말을 하면 `Me too`가 아니라 `Me neither`로 맞장구쳐요."
  examples:
    - en: Me neither.
      ko: 저도요.

# Languages (a1-03)
- id: pattern.a-little
  text: a little
  ko: 조금, 약간
  examples:
    - en: I speak a little English.
      ko: 저는 영어를 조금 해요.

# Jobs (a1-05)
- id: pattern.what-do-you-do
  text: What do you do?
  ko: 무슨 일 하세요?
  note: "직업을 묻는 말이에요. 지금 무엇을 하고 있는지 묻는 말이 아니에요. 통째로 외워 두면 돼요."
  examples:
    - en: What do you do, @Mina?
      ko: 미나 씨는 무슨 일 하세요?

# Pointing (a1-06)
- id: pattern.over-there
  text: over there
  ko: 저기, 저쪽에
  note: "손으로 가리키며 \"저기\"라고 할 때는 `there`만 쓰기보다 `over there`라고 할 때가 많아요."
  examples:
    - en: It's over there.
      ko: 저기 있어요.

# Age and contact details (a1-10)
- id: pattern.how-old
  text: How old ~?
  ko: ~는 몇 살이에요?
  note: "사람뿐 아니라 물건의 나이도 `How old is your car?`처럼 물어요."
  examples:
    - en: "How {old|sense.old.adj.age} is your son?"
      ko: 아드님은 몇 살이에요?
- id: pattern.how-do-you-spell
  text: How do you spell ~?
  ko: 철자가 어떻게 돼요?
  note: "통째로 외워 두면 돼요. 이름이나 이메일을 받아 적을 때 자주 써요."
  examples:
    - en: How do you spell that?
      ko: 철자가 어떻게 돼요?
- id: pattern.every-day
  text: every day
  ko: 매일
  note: "보통 문장 끝에 와요. 붙여 쓴 `everyday`는 \"일상적인\"이라는 다른 말이에요."
  examples:
    - en: They study English every day.
      ko: 그 사람들은 매일 영어를 공부해요.

# Questions with do and does (a1-15)
- id: pattern.do-you
  text: Do you ~?
  ko: ~해요?(묻기)
  note: "`speak`, `eat` 같은 동사로 말하는 문장은 앞에 `Do`를 붙여 물어요. 뒤의 동사는 그대로예요. `am`, `is`, `are` 문장은 `Are you ~?`처럼 순서만 바꿔요."
  examples:
    - en: "Do [you]{who} [speak]{do} [English]{what}?"
      ko: 영어 할 줄 알아요?
      literal: 너는 / 말하니 / 영어를
- id: pattern.short-answer-do
  text: "Yes, I do. / No, I don't."
  ko: 네, 그래요. / 아니요, 안 그래요.
  note: "`Do`로 물으면 동사를 다시 말하지 않고 `do`, `don't`로 짧게 대답해요."
  examples:
    - en: "Do you eat spicy food? Yes, I do."
      ko: 매운 음식 먹어요? 네, 먹어요.
- id: pattern.does-he
  text: Does he ~?
  ko: 그 사람은 ~해요?(묻기)
  note: "주어가 `he`, `she`, `it`이면 `Does`로 물어요. `-s`는 `Does`가 가져가서 뒤의 동사는 그대로예요."
  examples:
    - en: "Does [he]{who} [wear]{do} [glasses]{what}?"
      ko: 그 사람은 안경을 써요?
      literal: 그는 / 쓰니 / 안경을
- id: pattern.short-answer-does
  text: "Yes, he does. / No, he doesn't."
  ko: 네, 그래요. / 아니요, 안 그래요.
  note: "`Does`로 물으면 `does`, `doesn't`로 짧게 대답해요. 여자면 `she`, 물건이면 `it`으로 바꿔요."
  examples:
    - en: "Does your brother play soccer? Yes, he does."
      ko: 형은 축구를 해요? 네, 해요.
- id: pattern.how-do-you-say
  text: How do you say ~ in English?
  ko: ~를 영어로 뭐라고 해요?
  note: "모르는 말을 물을 때 써요. 가리키면서 `How do you say this in English?`라고 해도 돼요."
  examples:
    - en: How do you say this in English?
      ko: 이거 영어로 뭐라고 해요?

# Time and days (a1-16)
- id: pattern.what-time-is-it
  text: What time is it?
  ko: 몇 시예요?
  note: "대답은 `It's`로 시작해요. 정각은 `It's seven o'clock`, 7시 30분은 `It's seven thirty`, 7시 5분은 `It's seven oh five`예요."
  examples:
    - en: "What time is it? It's seven o'clock."
      ko: 몇 시예요? 7시예요.
- id: pattern.what-day-is-it
  text: What day is it today?
  ko: 오늘 무슨 요일이에요?
  note: "요일을 묻는 말이에요. `It's Saturday`처럼 `on` 없이 대답해요."
  examples:
    - en: "What day is it today? It's Saturday."
      ko: 오늘 무슨 요일이에요? 토요일이에요.

# Daily routine (a1-17)
- id: pattern.how-often
  text: How often ~?
  ko: 얼마나 자주 ~해요?
  note: "`every day`, `once a week`, `twice a week`처럼 대답해요."
  examples:
    - en: How often do you go to the gym?
      ko: 헬스장에 얼마나 자주 가요?

# There is and there are (a1-19)
- id: pattern.is-there
  text: Is there ~?
  ko: ~이 있어요?(묻기)
  note: "대답은 `Yes, there is`, 없으면 `No, there isn't`예요. 둘 이상이면 `Are there ~?`로 묻고 `Yes, there are`로 대답해요."
  examples:
    - en: "[Is {there|sense.there.pron.exists}]{do} [a bank]{who} [near here]{where}?"
      ko: 근처에 은행 있어요?
      literal: 있니 / 은행이 / 이 근처에
- id: pattern.how-many
  text: How many ~?
  ko: 몇 개, 몇 명(묻기)
  note: "`How many` 뒤에는 `chairs`, `people`처럼 둘 이상을 뜻하는 꼴이 와요. 몇 개 있는지 물을 때는 `How many chairs are there?`처럼 말해요."
  examples:
    - en: "[How many people]{who} [are {there|sense.there.pron.exists}]{do} [in your family]{where}?"
      ko: 가족이 몇 명이에요?
      literal: 사람이 몇 명 / 있니 / 네 가족 안에

# Ordering (a1-22)
- id: pattern.id-like
  text: "I'd like ~."
  ko: ~로 할게요, ~를 주세요(주문)
  note: "`I would like`를 줄인 말이에요. `I want ~`보다 부드러워서 주문할 때 많이 써요. 좋아한다는 `I like ~`와 다른 말이에요."
  examples:
    - en: "I'd like a salad, please."
      ko: 샐러드 하나 주세요.
- id: pattern.what-would-you-like
  text: What would you like?
  ko: 뭐 드릴까요?
  note: "식당이나 카페에서 주문을 받을 때 하는 말이에요. `I'd like ~`로 대답해요."
  examples:
    - en: "What would you like? I'd like the noodles, please."
      ko: 뭐 드릴까요? 국수로 할게요.
- id: pattern.can-i-have
  text: Can I have ~?
  ko: ~를 주세요(부탁)
  note: "무엇을 달라고 부탁하는 말이에요. 끝에 `please`를 붙이면 더 공손해요. 부탁하는 질문에는 보통 `some`을 써요."
  examples:
    - en: "Can I have some water, please?"
      ko: 물 좀 주세요.
- id: pattern.for-here-or-to-go
  text: For here or to go?
  ko: 드시고 가세요, 가져가세요?
  note: "카페나 패스트푸드점에서 묻는 말이에요. `For here, please`나 `To go, please`로 대답해요. 영국에서는 `Eat in or take away?`라고 해요."
  examples:
    - en: "For here or to go? To go, please."
      ko: 드시고 가세요, 가져가세요? 가져갈게요.
- id: pattern.anything-else
  text: Anything else?
  ko: 더 필요한 거 있으세요?
  note: "주문을 받는 사람이 더 주문할 게 있는지 묻는 말이에요."
  examples:
    - en: "Anything else? No, that's all."
      ko: 더 필요한 거 있으세요? 아니요, 그거면 돼요.
- id: pattern.thats-all
  text: "That's all."
  ko: 그거면 돼요, 그게 다예요
  note: "더 주문할 게 없을 때 말해요. `No, thanks`라고 해도 되고, 미국에서는 `That's it`도 많이 써요."
  examples:
    - en: "No, that's all. Thank you."
      ko: 아니요, 그거면 돼요. 고마워요.

# Can and can't (a1-23)
- id: pattern.short-answer-can
  text: "Yes, I can. / No, I can't."
  ko: 네, 할 수 있어요. / 아니요, 못 해요.
  note: "`Can`으로 물으면 동사를 다시 말하지 않고 `can`, `can't`로 짧게 대답해요. `Yes, I do`라고 하지 않아요. 대답 끝의 `can`은 세게 말해요."
  examples:
    - en: "Can you swim? Yes, I can."
      ko: 수영할 줄 알아요? 네, 할 줄 알아요.

# Present continuous (a1-24)
- id: pattern.what-are-you-doing
  text: What are you doing?
  ko: 뭐 하고 있어요?
  note: "지금 하고 있는 일을 묻는 말이에요. `What do you do?`는 직업을 묻는 말이라서 달라요."
  examples:
    - en: "What are you doing? I'm looking for my keys."
      ko: 뭐 하고 있어요? 열쇠를 찾고 있어요.

# Inflections. course.yaml gates each kind of form on one of these.
- id: pattern.plural-s
  text: ~s
  ko: 둘 이상을 말할 때(복수)
  level: a1
  examples:
    - en: "[The cats]{who} [are]{do} [small]{what}."
      ko: 고양이들이 작아요.
      literal: 고양이들은 / ~이다 / 작은
- id: pattern.possessive-s
  text: ~'s
  ko: ~의(소유)
  level: a1
  examples:
    - en: "[This]{who} [is]{do} [@Mina's book]{what}."
      ko: 이건 미나 씨 책이에요.
      literal: 이것은 / ~이다 / 미나의 책
- id: pattern.third-person-s
  text: He ~s
  ko: he, she, it 뒤에서 바뀌는 동사 끝(has, ~s)
  level: a1
  examples:
    - en: "[She]{who} [has]{do} [long hair]{what}."
      ko: 그 사람은 머리가 길어요.
      literal: 그녀는 / 가지고 있다 / 긴 머리
- id: pattern.present-continuous
  text: be ~ing
  ko: 지금 하고 있는 일
  level: a1
  note: "`am`, `is`, `are` 뒤에 동사의 `-ing` 꼴을 써서 지금 하고 있는 일이나 요즘 한동안 하는 일을 말해요. `make`는 `making`처럼 `e`를 빼고, `run`은 `running`처럼 끝 글자를 한 번 더 써요."
  examples:
    - en: I'm reading a book.
      ko: 저는 책을 읽고 있어요.
- id: pattern.past-simple
  text: ~ed
  ko: 지난 일(과거)
  level: a2
  examples:
    - en: I walked to school.
      ko: 저는 학교에 걸어갔어요.
- id: pattern.present-perfect
  text: have ~ed
  ko: 지금까지 해 본 일, 막 끝난 일(현재완료)
  level: a2
  examples:
    - en: I have finished my homework.
      ko: 숙제를 다 했어요.
- id: pattern.comparative
  text: ~er than
  ko: ~보다 더 ~한(비교급)
  level: a2
  examples:
    - en: The dog is bigger than the cat.
      ko: 개가 고양이보다 커요.
- id: pattern.superlative
  text: the ~est
  ko: 가장 ~한(최상급)
  level: a2
  examples:
    - en: This is the biggest room.
      ko: 여기가 가장 큰 방이에요.
