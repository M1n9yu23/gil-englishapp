      pos: verb
      ko: (게임, 운동을) 하다
      examples:
        - en: We play games together.
          ko: 우리는 같이 게임을 해요.
- word: game
  id: word.game
  senses:
    - id: sense.game.n.play
      pos: noun
      ko: 게임, 경기
      examples:
        - en: We play games every day.
          ko: 우리는 매일 게임을 해요.
- word: together
  id: word.together
  senses:
    - id: sense.together.adv.with
      pos: adverb
      ko: 같이, 함께
      examples:
        - en: We walk together every day.
          ko: 우리는 매일 같이 걸어요.
- word: walk
  id: word.walk
  ipa: wɔːk
  senses:
    - id: sense.walk.v.foot
      pos: verb
      ko: 걷다, 걸어가다
      examples:
        - en: "[I]{who} [walk]{do} [to school]{where} [every day]{when}."
          ko: 저는 매일 학교에 걸어가요.
          literal: 나는 / 걷는다 / 학교에 / 매일
  notes:
    - kind: usage
      ko: "`l`은 소리 내지 않아요. 입을 동그랗게 열고 \"웍\"에 가깝게 읽어요. `work`는 혀를 마는 `r` 소리가 들어가서 달라요."
