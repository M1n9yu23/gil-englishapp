          ko: 문제가 생겼어요.
  notes:
    - kind: usage
      ko: "`No problem`은 \"문제없어요, 괜찮아요\"예요. 고맙다는 말에 대답할 때도 써요."
- word: hair
  id: word.hair
  senses:
    - id: sense.hair.n.head
      pos: noun
      ko: 머리카락, 머리
      examples:
        - en: She has long hair.
          ko: 그 사람은 머리가 길어요.
  notes:
    - kind: mistake
      ko: "머리카락 전체를 말할 때는 `hairs`라고 하지 않아요."
- word: long
  id: word.long
  senses:
    - id: sense.long.adj.length
      pos: adjective
      ko: 긴
      examples:
        - en: My sister has long hair.
          ko: 우리 언니는 머리가 길어요.
- word: eye
  id: word.eye
  senses:
    - id: sense.eye.n.body
      pos: noun
      ko: 눈
      examples:
        - en: He has brown eyes.
          ko: 그 사람은 눈이 갈색이에요.
- word: brown
  id: word.brown
